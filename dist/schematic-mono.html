      $("seat-plus").disabled = seats === 25;
      if (active && !S.reduced()) S.roll($("seat-count"), String(seats));
      else {
        $("seat-count").textContent = String(seats);
        // S.roll rebuilds its strips after the plain reduced-motion readout.
        delete $("seat-count")._rollSig;
      }
      if (announce) $("seat-status").textContent = `${seats} demo team ${seats === 1 ? "seat" : "seats"}. No purchase made.`;
    };
    $("seat-minus").addEventListener("click", () => setSeats(seats - 1));
    $("seat-plus").addEventListener("click", () => setSeats(seats + 1));
    $("seats").addEventListener("input", (e) => {
      const n = e.target.valueAsNumber;
      if (Number.isInteger(n) && n >= 1 && n <= 25) setSeats(n);
      else { e.target.setAttribute("aria-invalid", "true"); status($("seats-error"), "Enter a whole number from 1 to 25.", "error"); }
    });
    $("seats").addEventListener("blur", (e) => { if (e.target.getAttribute("aria-invalid") === "true") { setSeats(seats, false); status($("seats-error"), `Restored the last valid quantity: ${seats}.`); } });

      const n = Number(e.target.value);

      e.target.setAttribute("aria-valuetext", `${n} percent`);
      $("volume-bubble").style.setProperty("--p", `${n}%`);
      $("volume-bubble").textContent = `${n}%`;

    });
    const updateBounds = (changed) => {
      let low = +$("low").value, high = +$("high").value;
      if (high - low < 10) { if (changed === "low") low = high - 10; else high = low + 10; }

    const syncProgress = () => {
      const value = Math.round(progress);

      $("progress").firstElementChild.style.transform = `scaleX(${progress / 100})`;
      $("progress-value").textContent = `${value}%`;
    };
    const syncSimulationButton = () => {
      $("simulate").disabled = !files.length;
      $("simulate").querySelector("span").textContent = simulation ? "Pause simulation" : progress >= 100 ? "Replay simulation" : progress > 0 ? "Resume simulation" : "Simulate progress";
    };
    const pauseSimulation = (message = "Simulation paused. Resume when ready; nothing was uploaded.") => {
      if (!simulation) return;
      simulation.cancel(); simulation = null;
      status($("upload-status"), message);
      syncSimulationButton();
    };
    const size = (n) => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MiB` : n >= 1024 ? `${(n / 1024).toFixed(1)} KiB` : `${n} B`;
    const selectFiles = (incoming) => {
      pauseSimulation();
      const all = [...incoming], accepted = all.filter(f => f.size <= 10 * 1048576).slice(0, 4);
      files = accepted.map(f => ({ name: f.name, size: f.size })); progress = 0;
      $("file-list").innerHTML = files.length ? files.map(f => `<li><span class="forms-file-icon">${icon("document", 20)}</span><span class="forms-file-name">${S.esc(f.name)}<small>Local file · ${size(f.size)}</small></span><span class="forms-file-local">Selected</span></li>`).join("") : `<li class="forms-file-empty">${icon("document", 24)}<span>Your selection will appear here.<small>No files are selected.</small></span></li>`;
      $("file-count").textContent = `${files.length} ${files.length === 1 ? "file" : "files"}`;
      $("clear-files").disabled = !all.length;
      syncProgress(); syncSimulationButton();
      const skipped = all.length - files.length;
      status($("upload-status"), `${files.length ? `${files.length} local ${files.length === 1 ? "file" : "files"} selected. Ready to simulate progress.` : "No eligible files selected."}${skipped ? ` ${skipped} skipped: maximum 4 files, 10 MiB per file.` : ""} Nothing uploaded.`, skipped ? "error" : "");
    };
    $("files-input").addEventListener("change", (e) => { if (e.target.files.length) selectFiles(e.target.files); e.target.value = ""; });
    const dropzone = $("dropzone");
    let dragDepth = 0;
    dropzone.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; dropzone.dataset.drag = "true"; });
    dropzone.addEventListener("dragover", (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "copy"; });
    dropzone.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) delete dropzone.dataset.drag; });
    dropzone.addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; delete dropzone.dataset.drag; if (e.dataTransfer?.files.length) selectFiles(e.dataTransfer.files); });
    $("clear-files").addEventListener("click", () => { selectFiles([]); $("files-input").value = ""; status($("upload-status"), "Local selection cleared. Nothing was uploaded."); });
    $("simulate").addEventListener("click", () => {
      if (simulation) { pauseSimulation(); return; }
      if (!files.length || !active) return;
      if (progress >= 100) progress = 0;
      const done = () => { simulation = null; progress = 100; syncProgress(); syncSimulationButton(); status($("upload-status"), "Simulation complete. Files remain on your device; nothing was uploaded.", "success"); };
      status($("upload-status"), "Simulating progress locally. No upload is taking place.");
      if (S.reduced()) { done(); return; }

      syncSimulationButton();
    });

    const form = $("profile-form");
    const fields = ["name", "email", "handle", "role", "site", "bio"].map(key => $("profile-" + key));
    const touched = new Set();
    let submitted = false, savedOnce = false;
    const snapshot = () => Object.fromEntries(new FormData(form));
    let saved = snapshot();
    const serialize = (data) => JSON.stringify(Object.keys(data).sort().map(key => [key, data[key]]));
    const profileError = (el) => {
      const value = el.value.trim();
      switch (el.id) {
        case "forms-profile-name": return value.length < 2 || value.length > 64 ? "Enter a display name with 2–64 characters." : "";
        case "forms-profile-email": return emailError(el);
        case "forms-profile-handle": return /^[A-Za-z0-9_]{3,24}$/.test(value) && value === el.value ? "" : "Use 3–24 letters, numbers, or underscores; no spaces.";
        case "forms-profile-role": return value ? "" : "Choose a role for the demo profile.";
        case "forms-profile-site": {
          if (!value) return "";
          try { const url = new URL(value); return /^(https?:)$/.test(url.protocol) && url.hostname && !el.validity.typeMismatch ? "" : "Use a complete http:// or https:// address."; } catch { return "Use a complete http:// or https:// address."; }
        }
        case "forms-profile-bio": return el.value.length > 160 ? "Keep your bio to 160 characters or fewer." : "";
        default: return "";
      }
    };
    const validateProfileField = (el) => { const error = profileError(el); setField(el, error, error ? "error" : ""); return error; };
    const updateErrorSummary = () => {
      const errors = fields.map(el => [el, profileError(el)]).filter(([, message]) => message);
      $("profile-errors").hidden = !errors.length;
      $("profile-errors").innerHTML = errors.length ? `<strong>${errors.length === 1 ? "One field needs" : `${errors.length} fields need`} attention</strong><ul>${errors.map(([el, message]) => `<li><a href="#${el.id}">${S.esc(message)}</a></li>`).join("")}</ul>` : "";
      return errors;
    };
    $("profile-errors").addEventListener("click", (e) => { const a = e.target.closest("a"); if (a) { e.preventDefault(); page.querySelector(a.getAttribute("href"))?.focus(); } });
    const preview = () => {
      const data = snapshot(), dirty = serialize(data) !== serialize(saved);
      $("dirty").textContent = dirty ? "Unsaved changes" : savedOnce ? "Saved for this visit" : "Example profile";
      $("dirty").classList.toggle("badge-warning", dirty);
      $("dirty").classList.toggle("badge-success", !dirty && savedOnce);
      const name = data.displayName.trim();
      $("preview-name").textContent = name || "Your display name";
      $("preview-avatar").textContent = name.split(/\s+/).filter(Boolean).slice(0, 2).map(s => [...s][0]).join("").toLocaleUpperCase() || "?";
      $("preview-handle").textContent = data.handle.trim() ? `@${data.handle.trim()}` : "Your username";
      $("preview-role").textContent = data.role || "Choose a role";
      $("preview-bio").textContent = data.bio.trim() || "Add a short introduction to your local preview.";
      $("preview-visibility").textContent = `${data.visibility === "public" ? "Public" : "Team only"} · local preview`;
      $("profile-bio-count").textContent = `${data.bio.length} / 160`;
      grow($("profile-bio"));
      return dirty;
    };
    fields.forEach(el => el.addEventListener("blur", () => { touched.add(el); validateProfileField(el); }));
    form.addEventListener("input", (e) => {
      if (fields.includes(e.target) && (touched.has(e.target) || submitted)) validateProfileField(e.target);
      if (submitted) updateErrorSummary();
      const dirty = preview();
      status($("profile-status"), dirty ? "Unsaved local changes. Save the demo profile when ready." : "Matches the current demo profile. Nothing sent.");
    });
    form.addEventListener("change", preview);
    form.addEventListener("submit", (e) => {
      e.preventDefault(); submitted = true;
      fields.forEach(validateProfileField);
      const errors = updateErrorSummary();
      if (errors.length) {
        status($("profile-status"), "Demo save stopped. Correct the marked fields.", "error");
        errors[0][0].focus(); flash($("profile-errors"), true); return;
      }
      saved = snapshot(); savedOnce = true; submitted = false;
      preview();
      status($("profile-status"), "Demo profile saved in memory for this visit. Nothing sent, published, or written to disk.", "success");
      flash($("profile-status"));
    });
    form.addEventListener("reset", (e) => {
      e.preventDefault();
      [...form.elements].forEach(el => {
        if (!el.name) return;
        if (el.type === "radio") el.checked = saved[el.name] === el.value;
        else if (el.type === "checkbox") el.checked = Object.hasOwn(saved, el.name);
        else el.value = saved[el.name] ?? "";
      });
      touched.clear(); submitted = false;
      fields.forEach(el => setField(el, ""));
      $("profile-errors").hidden = true; $("profile-errors").textContent = "";
      preview();
      status($("profile-status"), savedOnce ? "Restored your last saved demo profile for this visit." : "Restored the example profile. Nothing sent or saved to disk.");
    });
    preview();

    let lastWidth = 0;
    const resize = new ResizeObserver(entries => {
      const width = entries[0].contentRect.width;
      if (!active || width === lastWidth) return;
      lastWidth = width;
      grow($("note")); grow($("profile-bio"));
    });
    const pause = () => {
      active = false; page.dataset.paused = "true";
      resize.disconnect();
      pauseSimulation("Simulation paused while the page is hidden. Resume when ready; nothing uploaded.");
      animations.forEach(a => a.cancel()); animations.clear();
      page.getAnimations?.({ subtree: true }).forEach(a => a.cancel());
      dragDepth = 0; delete dropzone.dataset.drag;
    };
    const enter = () => {
      if (root.hidden || document.hidden) return;
      active = true; delete page.dataset.paused;
      lastWidth = page.getBoundingClientRect().width;
      resize.observe(page);
      updateNote(); grow($("profile-bio"));
    };
    document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); else if (!root.hidden) enter(); });
    controllers.set(root, { enter, leave: pause });
  }

  S.page({ id: "forms", title: "Forms & Inputs", group: "Build", icon: "input", order: 50, description: "Thoughtful text fields, validation, credentials, ranges, local file demos, and a complete profile form.", render, mount, enter: root => controllers.get(root)?.enter(), leave: root => controllers.get(root)?.leave() });
})();

(() => {

  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

  const names = ["Forma Studio", "Linear House", "Orbit Supply", "Northstar Lab", "Mono Works", "Field Notes", "Common Ground", "Index Studio", "Parallel Co.", "Good Measure", "Open Edition", "Atlas Objects", "Studio Tuesday", "Quiet Practice", "Outer Office", "Paper Plane", "New Standard", "Basecamp Goods", "Another Country", "Small Hours", "Made of Matter", "Third Space", "Daybreak Co.", "Pattern House", "Local Assembly", "Frame & Form", "Workshop One", "Future Ordinary"];
  const channels = ["Organic search", "Direct", "Referral", "Social", "Email", "Paid search"];
  const accounts = names.map((name, i) => ({
    id: `SC-${String(1024 + i).padStart(4, "0")}`, name, channel: channels[i % channels.length],
    status: i % 7 === 3 ? "Trial" : i % 9 === 4 ? "Paused" : "Active",
    orders: 12 + Math.floor(random() * 140), revenue: 850 + Math.round(random() * 14500),
    growth: +(random() * 38 - 9).toFixed(1), initials: name.split(/\s+/).slice(0, 2).map((v) => v[0]).join("")
  }));
  const devices = [{ name: "Desktop", count: 12400, color: 1 }, { name: "Mobile", count: 5400, color: 2 }, { name: "Tablet", count: 2200, color: 3 }];
  const goals = [{ name: "Revenue", value: 76, detail: "$76k / $100k", color: 1 }, { name: "Activation", value: 88, detail: "880 / 1,000", color: 2 }, { name: "Retention", value: 64, detail: "640 / 1,000", color: 4 }];
  const dateLabel = (date) => new Date(`${date}T12:00:00Z`).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const sample = (values, length = 90) => Array.from({ length }, (_, i) => {
    const p = i / (length - 1) * (values.length - 1), j = Math.floor(p);
    return values[j] + ((values[j + 1] ?? values[j]) - values[j]) * (p - j);
  });
  const line = (values, width, height, max, left = 48, top = 22, right = 18, bottom = 36) => {
    const x = (i) => left + i / (values.length - 1) * (width - left - right);

        if (name === "period" && st.period !== Number(button.dataset.value)) { st.period = Number(button.dataset.value); st.index = st.period - 1; updateChart(); updateKpis(); updateBars(); updateRanks(); }
        if (name === "bars" && st.mode !== button.dataset.value) { st.mode = button.dataset.value; updateBars(); }
      }
      if (button.hasAttribute("data-device")) { const i = Number(button.dataset.device); st.enabled[i] = !st.enabled[i]; updateDonut(); }
      if (button.hasAttribute("data-rank-inspect")) { const i = +button.dataset.rankInspect; st.rankPinned = st.rankPinned === i ? null : i; highlightRank(st.rankPinned ?? null); }
      if (button.hasAttribute("data-goal")) { const i = +button.dataset.goal; st.goalPinned = st.goalPinned === i ? null : i; highlightGoal(st.goalPinned); }
      if (button.hasAttribute("data-table-sort")) { const key = button.dataset.tableSort; st.direction = st.sort === key ? -st.direction : 1; st.sort = key; updateTable(); }
      if (button.hasAttribute("data-prev-page")) { st.page--; updateTable(); }
      if (button.hasAttribute("data-next-page")) { st.page++; updateTable(); }
      if (button.hasAttribute("data-clear-selection")) { st.selected.clear(); selection(); }
      if (button.hasAttribute("data-export")) exportCsv();
      if (button.hasAttribute("data-reset")) { st.query = ""; st.status = "all"; st.page = 0; $("[data-search]").value = ""; $("[data-status]").value = "all"; updateTable(); }
      if (button.hasAttribute("data-tick")) { tick(); schedule(); }
    });
    page.addEventListener("change", (event) => {
      const el = event.target;
      if (el.matches("[data-compare]")) { st.compare = el.checked; updateChart(); }
      if (el.matches("[data-live]")) { st.live = el.checked; liveLabel(); schedule(); }
      if (el.matches("[data-rank-sort]")) { st.rankSort = el.value; updateRanks(); }
      if (el.matches("[data-status]")) { st.status = el.value; st.page = 0; updateTable(); }
      if (el.matches("[data-page-size]")) { st.size = Number(el.value); st.page = 0; updateTable(); }
      if (el.matches("[data-select]")) { el.checked ? st.selected.add(el.dataset.select) : st.selected.delete(el.dataset.select); st.selectionAnchor = el.dataset.select; selection(); }
      if (el.matches("[data-select-page]")) { $$("[data-account]").filter((row) => !row.hidden).forEach((row) => { el.checked ? st.selected.add(row.dataset.account) : st.selected.delete(row.dataset.account); }); selection(); }
    });
    function toggleRow(row, extend = false) {
      const id = row.dataset.account;
      const rows = $$("[data-account]").filter((el) => !el.hidden);
      const anchor = rows.findIndex((el) => el.dataset.account === st.selectionAnchor), end = rows.indexOf(row);
      if (extend && anchor >= 0) rows.slice(Math.min(anchor, end), Math.max(anchor, end) + 1).forEach((el) => st.selected.add(el.dataset.account));
      else { st.selected.has(id) ? st.selected.delete(id) : st.selected.add(id); st.selectionAnchor = id; }
      selection();
    }
    page.addEventListener("keydown", (event) => {
      const row = event.target.closest("[data-account]");
      if (row && event.target === row) {
        if ([" ", "Enter"].includes(event.key)) { event.preventDefault(); toggleRow(row, event.shiftKey); }
        if (["ArrowUp", "ArrowDown"].includes(event.key)) { event.preventDefault(); const rows = $$("[data-account]").filter((el) => !el.hidden); rows[clamp(rows.indexOf(row) + (event.key === "ArrowDown" ? 1 : -1), 0, rows.length - 1)].focus(); }
      }
      const target = event.target.closest("[data-bar-group],[data-donut]");
      if (target && [" ", "Enter"].includes(event.key)) { event.preventDefault(); target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
      if (event.key === "Escape" && target?.hasAttribute("data-bar-group")) { st.barPinned = null; highlightBar(null); }
    });
    const highlightTarget = (target) => {
      const bar = target.closest("[data-bar-group]"); if (bar) highlightBar(+bar.dataset.barGroup);
      const rank = target.closest("[data-rank-inspect]"); if (rank) highlightRank(+rank.dataset.rankInspect);
      const device = target.closest("[data-device],[data-donut]"); if (device) { const i = Number(device.dataset.device ?? device.dataset.donut); if (st.deviceHover !== i) highlightDevice(i); }
      const goal = target.closest("[data-goal]"); if (goal) highlightGoal(+goal.dataset.goal);
    };
    page.addEventListener("pointerover", (event) => { if (event.pointerType !== "touch") highlightTarget(event.target); });
    page.addEventListener("focusin", (event) => highlightTarget(event.target));
    $("[data-bars]").addEventListener("pointerleave", () => { if (!$("[data-bars]").contains(document.activeElement)) highlightBar(st.barPinned); });
    $("[data-ranks]").addEventListener("pointerleave", () => { if (!$("[data-ranks]").contains(document.activeElement)) highlightRank(st.rankPinned ?? null); });
    $(".dt-donut-layout").addEventListener("pointerleave", () => { if (!$(".dt-donut-layout").contains(document.activeElement)) highlightDevice(null); });
    $(".dt-goals").addEventListener("pointerleave", () => { if (!$(".dt-goals").contains(document.activeElement)) highlightGoal(st.goalPinned); });
    page.addEventListener("focusout", (event) => {
      if (!$("[data-bars]").contains(event.relatedTarget)) highlightBar(st.barPinned);
      if (!$("[data-ranks]").contains(event.relatedTarget)) highlightRank(st.rankPinned ?? null);
      if (!$(".dt-donut-layout").contains(event.relatedTarget)) highlightDevice(null);
      if (!$(".dt-goals").contains(event.relatedTarget)) highlightGoal(st.goalPinned);
    });
    $("[data-search]").addEventListener("input", (event) => { st.query = event.target.value; st.page = 0; updateTable(); });
    $("#dt-day").addEventListener("input", (event) => { st.index = Number(event.target.value); inspect(true); });
    $("#dt-day").addEventListener("focus", () => inspect(true));
    $("#dt-day").addEventListener("keydown", (event) => { if (event.key === "Escape") $("[data-chart-wrap]").classList.remove("is-inspecting"); });
    $("#dt-day").addEventListener("blur", () => $("[data-chart-wrap]").classList.remove("is-inspecting"));
    const pointAt = (event) => {
      const rect = $("[data-main-chart]").getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width * st.width;
      st.index = Math.round(clamp((x - 48) / (st.width - 66), 0, 1) * (st.period - 1)); inspect(true);
    };
    $("[data-chart-hit]").addEventListener("pointermove", pointAt);
    $("[data-chart-hit]").addEventListener("pointerdown", pointAt);
    $("[data-chart-wrap]").addEventListener("pointerleave", () => { if (document.activeElement !== $("#dt-day")) $("[data-chart-wrap]").classList.remove("is-inspecting"); });
    page.addEventListener("replay", (event) => {
      if (!running()) return;
      const demo = event.target.closest(".demo"); if (!demo) return;
      if (demo.querySelector("[data-main-chart]")) { updateChart(true); updateKpis(true); }
      if (demo.querySelector("[data-bars]")) updateBars(true);
      if (demo.querySelector("[data-ranks]")) updateRanks(true);
      if (demo.querySelector("[data-donut]")) updateDonut(true);
      if (demo.querySelector("[data-ring]")) updateGoals(true);
    });
    updateTable();
    instances.set(root, {
      enter() { st.active = true; resume(true); },
      leave() { st.active = false; stop(); ro.disconnect(); mo.disconnect(); liveLabel(); }
    });
  }

  S.page({
    id: "data", title: "Data & Charts", group: "Build", icon: "chart-bar", order: 60,
    description: "Continuous charts, meaningful comparisons, and data you can explore.",
    render: () => `<div class="pg-data">${S.pageHead({ icon: "chart-bar", eyebrow: "Build / 06", title: "Data & Charts", lead: "Charts, comparisons, progress and customer records.", meta: [] })}${S.section({ id: "dt-overview", num: "01", title: "Revenue", desc: "Change the period to update cards and charts.", body: `<div class="dt-period-bar"><div><span class="dt-workspace-name">Schematic Commerce</span><span class="t-caption">Analytics playground · USD</span></div>${segment("period", [["7", "7D"], ["30", "30D"], ["90", "90D"]], "30", "Analytics period")}</div>${cardMarkup()}${chartMarkup()}` })}${S.section({ id: "dt-comparisons", num: "02", title: "Comparisons", desc: "Compare grouped or stacked values and reorder the ranking.", body: `<div class="grid cols-2 dt-comparison-grid">${barMarkup()}${rankMarkup()}</div>` })}${S.section({ id: "dt-composition", num: "03", title: "Composition and progress", desc: "Select a segment or inspect progress toward a target.", body: `<div class="grid cols-2">${donutMarkup()}${goalMarkup()}</div>` })}${S.section({ id: "dt-records", num: "04", title: "Customer records", desc: "Click anywhere in a customer row to select it, or press Space when focused. Filter, sort and take the selected records with you.", body: tableMarkup() })}<footer class="dt-page-note"><span class="t-mono">[ DATA / DEMO ]</span><p>All figures, accounts, and live samples are generated for this prototype. No production analytics or network requests.</p></footer></div>`,
    mount,
    enter: (root) => instances.get(root)?.enter(),
    leave: (root) => instances.get(root)?.leave()
  });
})();

</script>

      ${S.section({ id: "ov-dialogs", num: "01", title: "Dialogs", body: `<div class="grid cols-2">
        ${S.demo({ cls: "ov-morph-demo span-all", title: "Origin morph", desc: "A project card becomes its detail surface. The return journey carries the same spatial context.", specs: ["spring-smooth", "origin → surface"], body: `<div class="ov-origin-scene"><div class="ov-scene-heading"><span class="t-eyebrow">Your workspace</span><span class="t-caption">Select a project to inspect</span></div><button type="button" class="ov-project" data-ov-open="project" aria-haspopup="dialog"><span class="ov-project-art" aria-hidden="true"><svg viewBox="0 0 320 120" fill="none"><path class="ov-art-grid" d="M0 30h320M0 60h320M0 90h320M40 0v120M80 0v120M120 0v120M160 0v120M200 0v120M240 0v120M280 0v120"/><rect class="ov-art-back" x="100" y="16" width="118" height="72" rx="8"/><rect class="ov-art-front" x="72" y="34" width="118" height="72" rx="8"/><path class="ov-art-lines" d="M88 54h50M88 66h84M88 78h64"/><path class="ov-art-accent" d="m163 84 7 7 13-15"/></svg><span class="ov-project-open">${ic("arrow-up-right", 16)}</span></span><span class="ov-project-info"><span><strong>Atlas workspace</strong><span class="t-caption">Design foundations · 12 components</span></span>${badge("In review", "accent")}</span></button><div class="ov-origin-aside"><span class="ov-symbol">${ic("layers", 22)}</span><h3 class="t-h3">Keep the connection.</h3><p class="t-small muted">The surface starts where your attention already is.</p><span class="ov-key-note"><kbd class="kbd">Enter</kbd> to open <span aria-hidden="true">/</span> <kbd class="kbd">Esc</kbd> to return</span></div></div>` })}
        ${S.demo({ title: "Modal dialog", desc: "A focused form with native validation and a persistent local result.", specs: ["ease-out", "focus trap"], body: `<div class="ov-mini-spec"><span class="ov-symbol">${ic("pencil", 22)}</span><strong data-workspace-name>Atlas workspace</strong><button type="button" class="btn btn-secondary" data-ov-open="rename" aria-haspopup="dialog">Rename workspace</button><span class="t-caption" data-rename-result>Edits stay in this page.</span></div>` })}
        ${S.demo({ title: "Destructive confirmation", desc: "The safe action receives focus first. Removal affects only this specimen.", specs: ["explicit choice", "reversible demo"], body: `<div class="ov-mini-spec"><span class="ov-symbol ov-danger">${ic("trash", 22)}</span><strong data-draft-label>Exploration draft</strong><div class="row"><button type="button" class="btn btn-secondary" data-ov-open="delete" aria-haspopup="dialog">Remove draft</button><button type="button" class="btn btn-ghost" data-restore-draft hidden>Restore draft</button></div><span class="t-caption" data-draft-state>1 local demo draft</span></div>` })}

      </div>` })}

      ${S.section({ id: "ov-menus", num: "03", title: "Menus and popovers", body: `<div class="grid cols-2 ov-flyouts">

        ${S.demo({ cls: "ov-pop-demo", title: "Context menu", desc: "Right-click the canvas, use Shift + F10, or use the visible menu button.", specs: ["pointer + keyboard", "focus return"], body: `<div class="ov-context-target" tabindex="0" role="group" aria-label="Atlas specimen canvas. Press Shift F10 for its context menu." data-context-target><span class="ov-context-cross" aria-hidden="true">+</span><span class="t-mono t-small">atlas / specimen.svg</span><span class="t-caption">Right-click anywhere in this canvas</span><button type="button" class="btn btn-secondary btn-sm" id="ov-context-trigger" data-menu-trigger="context" aria-haspopup="menu" aria-expanded="false" aria-controls="ov-context-menu">${ic("more", 16)} Open context menu</button></div><div class="ov-menu" id="ov-context-menu" role="menu" aria-label="Specimen actions" popover="manual">${menuItem("eye", "Inspect specimen", "inspect")}${menuItem("copy", "Duplicate specimen", "duplicate")}${menuItem("star", "Mark as favorite", "favorite")}</div>` })}
        ${S.demo({ cls: "ov-pop-demo", title: "Intent hovercard", desc: "Wait briefly on the name or focus it with Tab. The pointer can travel into the card; Escape dismisses it.", specs: ["intent delay", "focus equivalent"], body: `<div class="ov-byline"><span class="ov-avatar" aria-hidden="true">MC</span><div><p class="t-small">Reviewed by <button type="button" class="ov-person" id="ov-person" aria-haspopup="dialog" aria-controls="ov-person-card" aria-expanded="false">Maya Chen</button></p><span class="t-caption">Motion designer · example profile</span></div></div><div class="ov-hovercard" id="ov-person-card" role="dialog" aria-label="Maya Chen, example profile" popover="manual"><div class="row"><span class="ov-avatar ov-avatar-lg" aria-hidden="true">MC</span><div><strong>Maya Chen</strong><p class="t-caption">@maya · example profile</p></div></div><p class="t-small muted">Designing calm interfaces, one deliberate transition at a time.</p><div class="ov-profile-stats"><span><strong>24</strong> components</span><span><strong>8</strong> reviews</span></div><button type="button" class="btn btn-secondary btn-sm" data-profile-action>Mark review as read ${ic("check", 14)}</button></div>` })}
        ${S.demo({ cls: "ov-pop-demo", title: "Tooltip toolbar", desc: "Intent on hover; immediate on keyboard focus. Labels remain accessible without the tooltip.", specs: ["shared tooltip", "arrow navigation"], body: `<div class="ov-mini-spec"><div class="ov-toolbar" role="toolbar" aria-label="Specimen tools">${[["copy", "Duplicate", "duplicate"], ["star", "Favorite", "favorite"], ["link", "Inspect link", "link"], ["info", "Show details", "inspect"]].map(([icon, label, action], i) => `<button type="button" class="btn btn-ghost btn-icon" data-tool="${action}" aria-label="${label}" data-tip="${label}" tabindex="${i ? -1 : 0}" ${action === "favorite" ? 'aria-pressed="false"' : ""}>${ic(icon)}</button>`).join("")}</div><span class="t-caption" data-tool-result role="status">Tab in, then use Left / Right.</span></div>` })}
      </div>` })}

      ${S.section({ id: "ov-notifications", num: "04", title: "Notifications", body: `<div class="grid cols-2">

        ${S.demo({ title: "Promise feedback", desc: "A deterministic local delay. Pending is dismissed before success appears; nothing is uploaded.", specs: ["pending → success", "simulated"], body: `<div class="ov-mini-spec"><span class="ov-symbol">${ic("upload", 22)}</span><button type="button" class="btn btn-primary" data-promise>Simulate save ${ic("arrow-right", 16)}</button><span class="t-caption" data-promise-result role="status">Local simulation · no network</span></div>` })}
      </div><div class="ov-alerts">${tones.map(([tone, icon, title, desc]) => `<div class="ov-alert ov-tone-${tone}"><span>${ic(icon)}</span><div><strong>${title}</strong><p>${desc}</p></div></div>`).join("")}</div>
      <div class="ov-banner-wrap"><div class="row-between"><span class="t-eyebrow">Collapsing announcement</span><button type="button" class="btn btn-ghost btn-sm" data-banner-restore aria-controls="ov-banner" aria-expanded="true">Replay banner ${ic("refresh", 14)}</button></div><div class="ov-collapse is-open" id="ov-banner"><div class="ov-collapse-inner"><div class="ov-banner"><span class="ov-symbol">${ic("sparkles")}</span><div><strong>A smaller interruption.</strong><p class="t-small muted">Dismiss this banner and the page closes the gap.</p></div><button type="button" class="btn btn-ghost btn-icon" data-banner-close aria-label="Dismiss announcement">${ic("x")}</button></div></div></div></div>` })}

      ${S.section({ id: "ov-disclosure", num: "05", title: "Accordion", body: `<div class="grid cols-2">
        ${S.demo({ title: "Single accordion", desc: "Opening a new answer closes the previous one. Up / Down move between headings.", specs: ["grid 0fr → 1fr", "single open"], stage: "is-plain is-col", body: accordion("single", [["When should I use a dialog?", "Use a dialog when the current task needs a decision before work can continue. Keep its title specific and its primary action unambiguous."], ["Where does focus go?", "Move focus inside on open. For destructive actions, start with the safe choice. Return focus to the initiating control on close."], ["How much motion is enough?", "Enough to explain the change in context. Reduced motion preserves every state and skips the spatial journey."]]) })}
        ${S.demo({ title: "Multiple accordion", desc: "Answers remain open independently. Their state survives a trip to another page.", specs: ["grid 0fr → 1fr", "multiple open"], stage: "is-plain is-col", body: accordion("multi", [["Keyboard", "Tab reaches each heading. Enter or Space toggles an answer. Arrow keys, Home and End move between headings."], ["Motion", "The content track interpolates from zero to one fraction. Opacity follows the disclosure; reversing mid-transition stays smooth."], ["Semantics", "Each real button exposes its expanded state and controls a named region. Closed content is inert and excluded from navigation."]]) })}

      } else if (b.hasAttribute("data-ws-name-cancel"))
        closeDialog("[data-ws-name-dialog]");
      else if (b.hasAttribute("data-ws-reset")) {
        stopJob(false);
        state.threads = fixtures.map(createThread);
        state.selected = "search";
        state.check = "tests";
        state.tab = "pr";
        $("[data-ws-prompt-input]").value = "";
        renderMessages();
        renderState();
        setView("editor");
        setConsole(true);
        $("[data-ws-source]").scrollTop = 12 + 10 * 22;
      }
    });
    $("[data-ws-composer]").addEventListener("submit", (e) => {
      e.preventDefault();
      send($("[data-ws-prompt-input]").value);
    });
    $("[data-ws-prompt-input]").addEventListener("input", (e) => {
      current().draft = e.target.value;
    });
    $("[data-ws-prompt-input]").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        send(e.target.value);
      }
    });
    $("[data-ws-code-input]").addEventListener("input", applyEdit);
    $("[data-ws-code-input]").addEventListener("scroll", syncEditorScroll);
    const updateCursor = () => {
      const input = $("[data-ws-code-input]"),
        text = input.value.slice(0, input.selectionStart),
        lines = text.split("\n");
      $("[data-ws-cursor]").textContent =
        `Ln ${lines.length}, Col ${lines.at(-1).length + 1}`;
    };
    ["keyup", "click", "input", "select"].forEach((name) =>
      $("[data-ws-code-input]").addEventListener(name, updateCursor),
    );
    $("[data-ws-code-input]").addEventListener("keydown", (e) => {
      const input = e.target;
      if (
        e.key === "Escape" ||
        ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s")
      ) {
        e.preventDefault();
        current().editing = false;
        renderEditor();
        $("[data-ws-edit]").focus();
      }
      if (e.key === "Tab" && !input.readOnly) {
        e.preventDefault();
        const a = input.selectionStart,
          b = input.selectionEnd;
        if (e.shiftKey) {
          const start = input.value.lastIndexOf("\n", a - 1) + 1;
          const indent =
            input.value.slice(start).match(/^ {1,2}/)?.[0].length || 0;
          input.setRangeText("", start, start + indent, "preserve");
        } else input.setRangeText("  ", a, b, "end");
        applyEdit();
      }
      e.stopPropagation();
    });
    $("[data-ws-name-form]").addEventListener("submit", (e) => {
      e.preventDefault();
      const title = $("#ws-name").value.trim();
      if (!title) return;
      current().title = title;
      closeDialog("[data-ws-name-dialog]");
      renderState();
    });
    $$("dialog").forEach((dialog) =>
      dialog.addEventListener("cancel", (e) => {
        e.preventDefault();
        closeDialog(dialog);
      }),
    );
    page.addEventListener("keydown", (e) => {
      const dialog = e.target.closest("dialog[open]");
      if (dialog) {
        e.stopPropagation();
        if (e.key === "Tab") {
          const controls = [
            ...dialog.querySelectorAll(
              'button:not(:disabled),input:not(:disabled),textarea:not(:disabled),[href],[tabindex="0"]',
            ),
          ].filter(
            (el) => el.getClientRects().length && !el.closest("[inert]"),
          );
          const first = controls[0],
            last = controls.at(-1);
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last?.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first?.focus();
          }
        }
      }
      const tab = e.target.closest('[role="tab"]');
      if (tab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
        e.preventDefault();
        const tabs = [
            ...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
          ],
          i = tabs.indexOf(tab),
          next =
            e.key === "Home"
              ? 0
              : e.key === "End"
                ? tabs.length - 1
                : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) %
                  tabs.length;
        tabs[next].click();
        (tab.hasAttribute("data-ws-file")
          ? $("[data-ws-file-tabs]").querySelector(
              `[data-ws-file="${current().file}"]`,
            )
          : tabs[next]
        ).focus({ preventScroll: true });
      }
    });
    state.leave = () => {
      state.active = false;
      stopJob(false);
      clearTimers();
      settleMotion();
      $$("dialog[open]").forEach((d) => closeDialog(d, false));
    };
    new MutationObserver(() => {
      if (S.reduced()) settleMotion();
    }).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-motion"],
    });
    matchMedia("(prefers-reduced-motion:reduce)").addEventListener(
      "change",
      () => {
        if (S.reduced()) settleMotion();
      },
    );
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopJob(false);
        settleMotion();
      }
    });
    renderMessages();
    renderState();
    $("[data-ws-source]").scrollTop = 12 + 10 * 22;
  }
  S.page({
    id: "workspace",
    title: "Coding workspace",
    group: "Examples",
    icon: "code",
    order: 80,
    count: 1,
    description: "Editor, split diffs, CI logs and coding assistant.",
    render,
    mount,
    enter(root) {
      const state = instances.get(root);
      if (state) state.active = true;
    },
    leave(root) {
      instances.get(root)?.leave();
    },
  });
})();

</script>
