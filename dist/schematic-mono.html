<!doctype html>
<html lang="en" data-theme="light" data-palette="mono">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schematic</title>
  <meta name="description" content="Schematic — a unified, motion-first design system prototype.">
  <meta name="color-scheme" content="light dark">
  <!-- Apply palette and explicit preferences before first paint. -->
  <script>
    (() => {
      const g = (k) => { try { return localStorage.getItem("schematic:" + k); } catch { return null; } };
      const r = document.documentElement;
      r.dataset.theme = g("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      const palette = g("palette");
      r.dataset.palette = palette === "mono" || palette === "color" ? palette : r.dataset.palette || "color";
      const h = g("hue");
      if (h !== null && h.trim() !== "" && Number.isFinite(Number(h))) r.style.setProperty("--accent-h", h);
      const rad = g("radius"); if (rad && rad !== "default") r.dataset.radius = rad;
      const m = g("motion"); if (m) r.dataset.motion = m;
    })();
  </script>

/* =============================================================================
   SCHEMATIC — DESIGN TOKENS
   The single source of truth. Every other file consumes these; nothing else
   hard-codes a colour, size, radius, duration or curve.
   Reference for future Tailwind/CSS, SwiftUI and Rust adapters.
   ============================================================================= */

:root {
  /* ---------------------------------------------------------------- Tuning */
  --accent-h: 168;          /* forest; this knob retunes only the accent    */
  --accent-c: 0.115;        /* restrained chroma, readable at every hue     */
  --neutral-h: 80;          /* warm paper / graphite, independent of brand  */
  --neutral-c: 0.008;       /* subtle warmth in the neutral surfaces        */
  --radius-scale: 1;        /* 0 = sharp, 1 = default, 1.6 = round          */
  --motion-scale: 1;        /* 1 = normal, 4 = slow-mo inspection, 0.01 = off */

  /* ---------------------------------------------------------------- Spacing
     4px base grid. Never use a value outside this scale.                   */
  --s-0: 0px;
  --s-px: 1px;
  --s-0_5: 2px;
  --s-1: 4px;
  --s-1_5: 6px;
  --s-2: 8px;
  --s-2_5: 10px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --s-10: 40px;
  --s-12: 48px;
  --s-16: 64px;
  --s-20: 80px;
  --s-24: 96px;

  /* ---------------------------------------------------------------- Radius */
  --r-xs: calc(4px * var(--radius-scale));
  --r-sm: calc(6px * var(--radius-scale));
  --r-md: calc(8px * var(--radius-scale));
  --r-lg: calc(12px * var(--radius-scale));
  --r-xl: calc(16px * var(--radius-scale));
  --r-2xl: calc(22px * var(--radius-scale));
  --r-full: 999px;

  /* ---------------------------------------------------------------- Type */
  --font-sans: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --font-display: "SF Pro Display", "Inter Display", "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, monospace;

  --t-2xs: 11px;  --lh-2xs: 16px;
  --t-xs: 12px;   --lh-xs: 16px;
  --t-sm: 13px;   --lh-sm: 20px;
  --t-md: 14px;   --lh-md: 22px;   /* body */
  --t-lg: 16px;   --lh-lg: 24px;
  --t-xl: 18px;   --lh-xl: 26px;
  --t-2xl: 22px;  --lh-2xl: 30px;
  --t-3xl: 28px;  --lh-3xl: 34px;
  --t-4xl: 36px;  --lh-4xl: 42px;
  --t-5xl: 48px;  --lh-5xl: 52px;
  --t-6xl: 64px;  --lh-6xl: 66px;

  --w-regular: 420;
  --w-medium: 520;
  --w-semibold: 600;
  --w-bold: 680;

  --tracking-tight: -0.022em;
  --tracking-display: -0.035em;
  --tracking-wide: 0.06em;

  /* ---------------------------------------------------------------- Sizing */
  --control-xs: 24px;
  --control-sm: 28px;
  --control-md: 34px;
  --control-lg: 40px;
  --control-xl: 48px;

  --icon-sm: 16px;
  --icon-md: 18px;
  --icon-lg: 20px;
  --icon-xl: 24px;
  --ic-stroke: 1.6;

  --sidebar-w: 248px;
  --topbar-h: 56px;
  --content-max: 1080px;
  --rail-w: 196px;

  /* ---------------------------------------------------------------- Motion
     Durations are multiplied by --motion-scale so the whole system can be
     slowed down for inspection, or switched off for reduced-motion users.  */
  --d-instant: calc(80ms * var(--motion-scale));   /* press feedback          */
  --d-fast: calc(140ms * var(--motion-scale));     /* hover, colour, opacity  */
  --d-base: calc(220ms * var(--motion-scale));     /* small moves, toggles    */
  --d-moderate: calc(320ms * var(--motion-scale)); /* popovers, menus         */
  --d-slow: calc(460ms * var(--motion-scale));     /* page, dialog, layout    */
  --d-slower: calc(650ms * var(--motion-scale));   /* data viz, choreography  */
  --d-glacial: calc(1000ms * var(--motion-scale)); /* ambient / hero only     */

  /* Curves. Rule of thumb:
       entering / responding to the user  -> out
       leaving the screen                 -> in  (and ~30% faster)
       moving something already on screen -> in-out
       physical / playful / confirmation  -> spring                        */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);            /* quint, the default */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);        /* big, decisive entrances */
  --ease-out-soft: cubic-bezier(0.25, 0.8, 0.25, 1);     /* colour & opacity */
  --ease-in: cubic-bezier(0.64, 0, 0.78, 0);             /* exits */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);         /* on-screen travel */
  --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);   /* pop-ins, badges */
  --ease-anticipate: cubic-bezier(0.68, -0.4, 0.32, 1.4);/* wind-up then go */

  /* Springs, pre-baked as linear() from a real mass-spring simulation.
     Pair them with their natural duration token below.                    */
  --spring-smooth: linear(0, 0.0198, 0.0597, 0.1221, 0.1858, 0.2639, 0.3334, 0.4115, 0.477, 0.5388, 0.604, 0.656, 0.7095, 0.7512, 0.7933, 0.8255, 0.8537, 0.8814, 0.9021, 0.9222, 0.937, 0.9511, 0.9613, 0.9709, 0.9778, 0.9834, 0.9885, 0.992, 0.9952, 0.9973, 0.9991, 1.0003, 1.0012, 1.0018, 1.0021, 1.0024, 1.0025, 1.0024, 1.0024, 1.0022, 1.0021, 1.0019, 1.0017, 1.0015, 1.0014, 1.0012, 1.001, 1.0009, 1);
  --spring-snappy: linear(0, 0.0203, 0.0681, 0.1343, 0.212, 0.2954, 0.3803, 0.4635, 0.5425, 0.6159, 0.6721, 0.733, 0.7868, 0.8334, 0.8732, 0.9067, 0.9345, 0.9571, 0.9752, 0.9893, 0.9984, 1.0067, 1.0126, 1.0165, 1.0188, 1.0199, 1.02, 1.0195, 1.0184, 1.0172, 1.0157, 1.014, 1.0123, 1.0106, 1.009, 1.0076, 1.0062, 1.0051, 1.004, 1.0033, 1.0025, 1.0018, 1.0013, 1.0008, 1.0005, 1.0002, 1, 0.9998, 1);
  --spring-bouncy: linear(0, 0.0584, 0.1975, 0.3806, 0.5604, 0.7473, 0.9084, 1.0253, 1.116, 1.1696, 1.1903, 1.1879, 1.1669, 1.1375, 1.1004, 1.0633, 1.0325, 1.0048, 0.9842, 0.9718, 0.9647, 0.9632, 0.9655, 0.9708, 0.9776, 0.9843, 0.9911, 0.997, 1.0012, 1.0045, 1.0063, 1.007, 1.0069, 1.0061, 1.005, 1.0036, 1.0022, 1.0011, 1.0001, 0.9994, 0.9989, 0.9987, 0.9986, 0.9987, 0.9989, 0.9992, 0.9994, 0.9997, 1);
  --d-spring-smooth: calc(600ms * var(--motion-scale));
  --d-spring-snappy: calc(470ms * var(--motion-scale));
  --d-spring-bouncy: calc(930ms * var(--motion-scale));

  --stagger: calc(32ms * var(--motion-scale));  /* delay step for lists */

  /* ---------------------------------------------------------------- Z */
  --z-sticky: 10;
  --z-sidebar: 20;
  --z-popover: 50;
  --z-toast: 70;
  --z-dialog: 80;
  --z-tooltip: 90;
}

/* =============================================================================
   COLOUR — LIGHT (default)
   OKLCH keeps lightness perceptually even. Only intent follows --accent-h;
   paper, graphite and chart series remain independent of the brand hue.
   ============================================================================= */
:root,
[data-theme="light"] {
  color-scheme: light;

  --bg: oklch(0.982 var(--neutral-c) var(--neutral-h));
  --bg-sunken: oklch(0.958 var(--neutral-c) var(--neutral-h));
  --surface: oklch(0.995 calc(var(--neutral-c) * 0.35) var(--neutral-h));
  --surface-2: oklch(0.972 calc(var(--neutral-c) * 0.8) var(--neutral-h));
  --surface-3: oklch(0.945 var(--neutral-c) var(--neutral-h));
  --surface-raised: var(--surface);
  --overlay: oklch(0.2 var(--neutral-c) var(--neutral-h) / 0.28);

  --border: oklch(0.895 calc(var(--neutral-c) * 1.2) var(--neutral-h));
  --border-soft: oklch(0.93 var(--neutral-c) var(--neutral-h));
  --border-strong: oklch(0.82 calc(var(--neutral-c) * 1.4) var(--neutral-h));

  --text: oklch(0.23 var(--neutral-c) var(--neutral-h));
  --text-2: oklch(0.41 var(--neutral-c) var(--neutral-h));
  --text-3: oklch(0.49 var(--neutral-c) var(--neutral-h));
  --text-4: oklch(0.67 var(--neutral-c) var(--neutral-h));
  --text-inverse: oklch(0.99 0 0);

  --accent: oklch(0.45 var(--accent-c) var(--accent-h));
  --accent-hover: oklch(0.42 var(--accent-c) var(--accent-h));
  --accent-press: oklch(0.39 var(--accent-c) var(--accent-h));
  --accent-text: oklch(0.41 var(--accent-c) var(--accent-h));
  --accent-contrast: oklch(0.995 0 0);
  --accent-soft: oklch(0.45 var(--accent-c) var(--accent-h) / 0.08);
  --accent-soft-2: oklch(0.45 var(--accent-c) var(--accent-h) / 0.13);
  --accent-ring: oklch(0.45 var(--accent-c) var(--accent-h) / 0.42);

  --success: oklch(0.6 0.15 155);
  --success-soft: oklch(0.6 0.15 155 / 0.12);
  --success-text: oklch(0.44 0.11 155);
  --warning: oklch(0.75 0.16 70);
  --warning-soft: oklch(0.75 0.16 70 / 0.16);
  --warning-text: oklch(0.47 0.11 60);
  --danger: oklch(0.51 0.19 25);
  --danger-hover: oklch(0.46 0.19 25);
  --danger-contrast: oklch(0.99 0 0);
  --danger-soft: oklch(0.6 0.21 25 / 0.1);
  --danger-text: oklch(0.47 0.18 25);
  --info: oklch(0.62 0.14 235);
  --info-soft: oklch(0.62 0.14 235 / 0.12);
  --info-text: oklch(0.44 0.11 235);

  /* Graphs only: five independent hues, including in Mono interface mode. */
  --chart-1: oklch(0.53 0.15 255);
  --chart-2: oklch(0.58 0.1 185);
  --chart-3: oklch(0.65 0.14 75);
  --chart-4: oklch(0.58 0.17 340);
  --chart-5: oklch(0.57 0.14 295);
  --chart-grid: var(--border-soft);

  --shadow-xs: 0 1px 2px oklch(0.2 0 0 / 0.06);
  --shadow-sm: 0 1px 2px oklch(0.2 0 0 / 0.05), 0 2px 6px -1px oklch(0.2 0 0 / 0.06);
  --shadow-md: 0 1px 2px oklch(0.2 0 0 / 0.04), 0 6px 16px -4px oklch(0.2 0 0 / 0.1);

  --inset-highlight: inset 0 1px 0 oklch(1 0 0 / 0.7);
  --btn-primary-highlight: inset 0 1px 0 oklch(1 0 0 / 0.22), inset 0 -1px 0 oklch(0 0 0 / 0.12);
}

   ============================================================================= */
[data-theme="dark"] {

  --bg-sunken: oklch(0.15 var(--neutral-c) var(--neutral-h));

  --surface-2: oklch(0.23 var(--neutral-c) var(--neutral-h));
  --surface-3: oklch(0.265 var(--neutral-c) var(--neutral-h));

  --text-3: oklch(0.68 var(--neutral-c) var(--neutral-h));
  --text-4: oklch(0.47 var(--neutral-c) var(--neutral-h));
  --text-inverse: oklch(0.16 var(--neutral-c) var(--neutral-h));

  --accent: oklch(0.73 var(--accent-c) var(--accent-h));
  --accent-hover: oklch(0.78 var(--accent-c) var(--accent-h));
  --accent-press: oklch(0.69 var(--accent-c) var(--accent-h));

  --accent-soft: oklch(0.73 var(--accent-c) var(--accent-h) / 0.12);
  --accent-soft-2: oklch(0.73 var(--accent-c) var(--accent-h) / 0.18);
  --accent-ring: oklch(0.73 var(--accent-c) var(--accent-h) / 0.45);

  --success: oklch(0.7 0.15 155);
  --success-soft: oklch(0.7 0.15 155 / 0.14);
  --success-text: oklch(0.78 0.14 155);
  --warning: oklch(0.8 0.15 75);
  --warning-soft: oklch(0.8 0.15 75 / 0.14);
  --warning-text: oklch(0.84 0.13 80);
  --danger: oklch(0.69 0.18 25);
  --danger-hover: oklch(0.74 0.18 25);
  --danger-contrast: oklch(0.14 0 0);
  --danger-soft: oklch(0.66 0.2 25 / 0.15);
  --danger-text: oklch(0.76 0.16 25);
  --info: oklch(0.7 0.13 235);
  --info-soft: oklch(0.7 0.13 235 / 0.15);
  --info-text: oklch(0.8 0.11 235);

  --chart-1: oklch(0.73 0.13 255);
  --chart-2: oklch(0.76 0.11 185);
  --chart-3: oklch(0.8 0.13 80);
  --chart-4: oklch(0.74 0.15 340);
  --chart-5: oklch(0.75 0.13 295);

  --shadow-xs: 0 1px 2px oklch(0 0 0 / 0.3);
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3), 0 2px 6px -1px oklch(0 0 0 / 0.3);
  --shadow-md: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 20px -4px oklch(0 0 0 / 0.45);
  --shadow-lg: 0 2px 4px oklch(0 0 0 / 0.3), 0 18px 44px -8px oklch(0 0 0 / 0.55);
  --shadow-xl: 0 4px 8px oklch(0 0 0 / 0.3), 0 32px 80px -12px oklch(0 0 0 / 0.65);
  --inset-highlight: inset 0 1px 0 oklch(1 0 0 / 0.05);
  --btn-primary-highlight: inset 0 1px 0 oklch(1 0 0 / 0.25), inset 0 -1px 0 oklch(0 0 0 / 0.15);

/* =============================================================================
   MONO — neutral interface, with chart colours reserved for data.
   Meaning still comes from the existing status labels and icons.
   ============================================================================= */
[data-palette="mono"] {
  --neutral-c: 0;
  --accent-c: 0;
  --accent: oklch(0.25 0 0);
  --accent-hover: oklch(0.2 0 0);
  --accent-press: oklch(0.15 0 0);
  --accent-text: oklch(0.25 0 0);
  --accent-contrast: oklch(0.995 0 0);
  --accent-soft: oklch(0.25 0 0 / 0.07);
  --accent-soft-2: oklch(0.25 0 0 / 0.12);
  --accent-ring: oklch(0.25 0 0 / 0.42);

  --success: oklch(0.42 0 0);
  --warning: oklch(0.49 0 0);
  --info: oklch(0.45 0 0);
  --danger: oklch(0.32 0 0);
  --danger-hover: oklch(0.25 0 0);
  --danger-contrast: oklch(0.995 0 0);
  --success-text: var(--text-2);
  --warning-text: var(--text-2);
  --info-text: var(--text-2);
  --danger-text: var(--text);
  --success-soft: var(--accent-soft);
  --warning-soft: var(--accent-soft);
  --info-soft: var(--accent-soft);
  --danger-soft: var(--accent-soft-2);
}

[data-theme="dark"][data-palette="mono"] {
  --accent: oklch(0.9 0 0);
  --accent-hover: oklch(0.95 0 0);
  --accent-press: oklch(0.84 0 0);
  --accent-text: oklch(0.9 0 0);
  --accent-contrast: oklch(0.14 0 0);
  --accent-soft: oklch(0.9 0 0 / 0.1);
  --accent-soft-2: oklch(0.9 0 0 / 0.16);
  --accent-ring: oklch(0.9 0 0 / 0.45);
  --success: oklch(0.77 0 0);
  --warning: oklch(0.82 0 0);
  --info: oklch(0.79 0 0);
  --danger: oklch(0.85 0 0);
  --danger-hover: oklch(0.92 0 0);
  --danger-contrast: oklch(0.14 0 0);
}

/* =============================================================================
   ACCESSIBILITY OVERRIDES
   ============================================================================= */
@media (prefers-reduced-motion: reduce) {
  :root:not([data-motion="full"]) { --motion-scale: 0.01; }
}
[data-motion="reduced"] { --motion-scale: 0.01; }
[data-motion="slow"] { --motion-scale: 4; }

[data-radius="sharp"] { --radius-scale: 0.35; }
[data-radius="round"] { --radius-scale: 1.6; }

/* =============================================================================
   SCHEMATIC — BASE: reset, typography, application shell
   ============================================================================= */

@property --accent-h { syntax: "<number>"; inherits: true; initial-value: 168; }
@property --radius-scale { syntax: "<number>"; inherits: true; initial-value: 1; }

/* Re-tuning the brand hue or radius morphs the whole UI instead of snapping */
:root {
  transition: --accent-h calc(500ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1),
              --radius-scale calc(500ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1);
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
body {
  min-height: 100%;
  font-family: var(--font-sans);
  font-size: var(--t-md);
  line-height: var(--lh-md);
  font-weight: var(--w-regular);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv11", "ss01", "ss03";
  overflow: hidden;
}
img, svg, video, canvas { display: block; max-width: 100%; }
svg.ic { display: inline-block; }
input, button, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4 { font-weight: var(--w-semibold); letter-spacing: var(--tracking-tight); text-wrap: balance; }
p { text-wrap: pretty; }
::selection { background: var(--accent-soft-2); color: var(--text); }
[hidden] { display: none !important; }
.skip-link { position:fixed;top:var(--s-3);left:var(--s-3);z-index:100;padding:var(--s-3) var(--s-4);border-radius:var(--r-md);background:var(--surface);color:var(--text);box-shadow:var(--shadow-md);transform:translateY(-200%); }
.skip-link:focus { transform:none; }

/* Focus: a ring that *settles* onto the element rather than blinking on */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 2px;
  animation: focus-settle var(--d-base) var(--ease-out);
}
@keyframes focus-settle { from { outline-offset: 6px; outline-color: transparent; } }
.page h1[tabindex="-1"]:focus { outline:none;animation:none; }

/* Scrollbars: quiet until needed */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* ------------------------------------------------------------------ type */
.t-display { font-family: var(--font-display); font-size: var(--t-5xl); line-height: var(--lh-5xl); letter-spacing: var(--tracking-display); font-weight: var(--w-semibold); }
.t-h1 { font-family: var(--font-display); font-size: var(--t-4xl); line-height: var(--lh-4xl); letter-spacing: var(--tracking-display); font-weight: var(--w-semibold); }
.t-h2 { font-size: var(--t-2xl); line-height: var(--lh-2xl); letter-spacing: var(--tracking-tight); font-weight: var(--w-semibold); }
.t-h3 { font-size: var(--t-lg); line-height: var(--lh-lg); letter-spacing: -0.011em; font-weight: var(--w-semibold); }

  document.addEventListener("focusin", (e) => {
    const t = e.target;
    if (t.matches?.(":focus-visible") && t.matches(TRIGGER)) playWithin(t);
  });

  /* Touch: play on press so mobile users still get the feedback */
  document.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch") return;
    const host = e.target.closest?.(TRIGGER);
    if (host) playWithin(host);
  }, { passive: true });
})();

  <script data-source="js/core.js">
/* =============================================================================
   SCHEMATIC — CORE RUNTIME
   Motion utilities, interaction primitives, router with view transitions and
   intent-based prerendering, tooltips, toasts, command palette, theming.
   Pages register with Schematic.page({...}) — see CONTRACT.md.
   ============================================================================= */
(() => {
  const S = (window.Schematic = window.Schematic || {});
  const root = document.documentElement;

  /* ===================================================================== utils */
  S.$ = (sel, ctx = document) => ctx.querySelector(sel);
  S.$$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];
  S.html = (str) => { const t = document.createElement("template"); t.innerHTML = str.trim(); return t.content.firstElementChild; };
  S.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  S.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  S.lerp = (a, b, t) => a + (b - a) * t;
  S.token = (name) => getComputedStyle(root).getPropertyValue(name).trim();
  S.motionScale = () => { const n = parseFloat(S.token("--motion-scale")); return Number.isFinite(n) ? n : 1; };
  S.reduced = () => S.motionScale() < 0.05;
  /** Scale a duration in ms by the global motion setting */
  S.dur = (ms) => ms * S.motionScale();
  S.wait = (ms) => new Promise((r) => setTimeout(r, S.dur(ms)));
  S.nextFrame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  S.idle = (fn) => (window.requestIdleCallback ? requestIdleCallback(fn, { timeout: 1500 }) : setTimeout(fn, 120));
  /** Report clipboard success only after a confirmed write, including file://. */
  S.copy = async (text) => {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    const active = document.activeElement;
    const field = document.createElement("textarea");
    field.value = text; field.setAttribute("aria-label", "Copy text");
    field.style.cssText = "position:fixed;opacity:0;pointer-events:none";
    document.body.append(field); field.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    field.remove(); active?.focus({ preventScroll: true });
    return ok;
  };

  /* ===================================================================== easing
     JS mirrors of the CSS tokens, for rAF tweens (charts, scroll, counters). */
  const bezier = (x1, y1, x2, y2) => {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t;
    const sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x; if (Math.abs(e) < 1e-6) return sy(t); const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  };
  const fromLinear = (str) => {
    const pts = (str.match(/linear\((.*)\)/)?.[1] || "0, 1").split(",").map((v) => parseFloat(v));
    const n = pts.length - 1;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; const p = x * n, i = Math.floor(p); return pts[i] + (pts[i + 1] - pts[i]) * (p - i); };
  };
  S.curve = {
    out: "cubic-bezier(0.22, 1, 0.36, 1)",
    outExpo: "cubic-bezier(0.16, 1, 0.3, 1)",
    in: "cubic-bezier(0.64, 0, 0.78, 0)",
    inOut: "cubic-bezier(0.65, 0, 0.35, 1)",
    overshoot: "cubic-bezier(0.34, 1.56, 0.64, 1)",
  };
  S.ease = {
    linear: (t) => t,
    out: bezier(0.22, 1, 0.36, 1),
    outExpo: bezier(0.16, 1, 0.3, 1),
    in: bezier(0.64, 0, 0.78, 0),
    inOut: bezier(0.65, 0, 0.35, 1),
    overshoot: bezier(0.34, 1.56, 0.64, 1),
  };
  S.springDur = { smooth: 600, snappy: 470, bouncy: 930 };
  const loadSprings = () => {
    ["smooth", "snappy", "bouncy"].forEach((k) => {
      const v = S.token(`--spring-${k}`);
      S.curve[`spring${k[0].toUpperCase()}${k.slice(1)}`] = v;
      S.ease[`spring${k[0].toUpperCase()}${k.slice(1)}`] = fromLinear(v);
    });
  };

  /* ===================================================================== tween
     S.tween({from, to, duration, ease, delay, onUpdate}) → { cancel, finished }
     from/to may be numbers or equal-length arrays (for path morphing).       */
  S.tween = ({ from = 0, to = 1, duration = 400, ease = S.ease.out, delay = 0, onUpdate, onDone } = {}) => {
    const d = S.dur(duration), dl = S.dur(delay), arr = Array.isArray(from);
    let raf, start = null, dead = false, resolve;
    const finished = new Promise((r) => (resolve = r));
    const step = (now) => {
      if (dead) return;
      if (start === null) start = now + dl;
      if (now < start) { raf = requestAnimationFrame(step); return; }
      const t = d <= 0 ? 1 : S.clamp((now - start) / d, 0, 1), k = ease(t);
      onUpdate?.(arr ? from.map((f, i) => f + (to[i] - f) * k) : from + (to - from) * k, t);
      if (t < 1) raf = requestAnimationFrame(step); else { onDone?.(); resolve(); }
    };
    raf = requestAnimationFrame(step);
    return { cancel() { dead = true; cancelAnimationFrame(raf); resolve(); }, finished };
  };

  /** Animate a number in an element's text. */
  S.countTo = (el, to, { from, duration = 900, format = (v) => Math.round(v).toLocaleString(), ease = S.ease.outExpo } = {}) => {
    el._count?.cancel();
    const start = from ?? el._countVal ?? 0;
    el._countVal = to;
    el._count = S.tween({ from: start, to, duration, ease, onUpdate: (v) => (el.textContent = format(v)) });
    return el._count.finished;
  };

  /* ===================================================================== FLIP
     S.flip(elements, mutate, opts) — record, mutate the DOM, animate the delta.
     New elements (not present before) scale/fade in.                          */
  S.flip = (els, mutate, { duration = S.springDur.snappy, easing, stagger = 0, enter = true } = {}) => {
    const list = [...(typeof els === "function" ? els() : els)];
    list.forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
    const first = new Map(list.map((el) => [el, el.getBoundingClientRect()]));
    mutate();
    const ease = easing || S.curve.springSnappy || S.curve.out;
    const anims = [];
    const after = typeof els === "function" ? els() : list;
    [...after].forEach((el, i) => {
      if (!el.isConnected || el.hidden) return;
      const f = first.get(el), l = el.getBoundingClientRect();
      if (!f) {
        if (enter) anims.push(el.animate([{ opacity: 0, transform: "scale(0.94)" }, { opacity: 1, transform: "none" }], { duration: S.dur(duration), easing: ease, delay: S.dur(i * stagger), fill: "backwards" }));
        return;
      }
      const dx = f.left - l.left, dy = f.top - l.top;
      const sx = l.width ? f.width / l.width : 1, sy = l.height ? f.height / l.height : 1;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(sx - 1) < 0.01 && Math.abs(sy - 1) < 0.01) return;
      anims.push(el.animate(
        [{ transformOrigin: "top left", transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` }, { transformOrigin: "top left", transform: "none" }],
        { duration: S.dur(duration), easing: ease, delay: S.dur(i * stagger) }
      ));
    });
    return Promise.all(anims.map((a) => a.finished.catch(() => {})));
  };

  /* ===================================================================== number roll
     Digits roll on vertical strips (odometer). S.roll(el, "1,284")            */
  S.roll = (el, value, { stagger = 28 } = {}) => {
    const text = String(value), chars = [...text];
    el.classList.add("roll");
    el.setAttribute("aria-label", text);
    const sig = chars.map((c) => (/\d/.test(c) ? "d" : c)).join("");
    if (el._rollSig !== sig) {
      el._rollSig = sig;
      el.innerHTML = chars.map((c) => /\d/.test(c)
        ? `<span class="roll-col" aria-hidden="true"><span class="roll-strip" style="--d:0">${"0123456789".split("").map((n) => `<span>${n}</span>`).join("")}</span></span>`
        : `<span class="roll-sym" aria-hidden="true">${S.esc(c)}</span>`).join("");
      el.offsetWidth; // commit the 0-state so the first roll animates
    }
    const strips = S.$$(".roll-strip", el);
    const digits = chars.filter((c) => /\d/.test(c));
    strips.forEach((strip, i) => {
      strip.style.transitionDelay = `${S.dur((strips.length - 1 - i) * stagger)}ms`; // ones place leads
      strip.style.setProperty("--d", digits[i]);
    });
  };

  /* ===================================================================== spotlight
     Any .btn, .spot or [data-spot] gets --mx/--my = pointer position inside it */
  document.addEventListener("pointermove", (e) => {
    const el = e.target.closest?.(".btn, .spot, [data-spot]");
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", `${e.clientX - r.left}px`);
    el.style.setProperty("--my", `${e.clientY - r.top}px`);
  }, { passive: true });

  /* ===================================================================== glide
     S.glide(container, { items, persist }) — a single hover highlight that
     travels between items. Returns { moveTo(el), hide() }.                    */
  S.glide = (container, { items = "[data-glide-item]", persist = false, className = "" } = {}) => {
    container.setAttribute("data-glide", "");
    const pill = document.createElement("span");
    pill.className = `glide-pill ${className}`.trim();
    pill.setAttribute("aria-hidden", "true");
    container.prepend(pill);
    let on = false, current = null;
    const moveTo = (el, { instant = false } = {}) => {
      if (!el) return;
      current = el;
      const c = container.getBoundingClientRect(), r = el.getBoundingClientRect();
      const x = r.left - c.left + container.scrollLeft, y = r.top - c.top + container.scrollTop;
      const place = () => { pill.style.transform = `translate(${x}px, ${y}px)`; pill.style.width = `${r.width}px`; pill.style.height = `${r.height}px`; };
      if (!on || instant) { pill.classList.add("no-move"); place(); pill.offsetWidth; pill.classList.remove("no-move"); }
      else place();
      pill.classList.add("is-on"); on = true;
    };
    const hide = () => { pill.classList.remove("is-on"); on = false; current = null; };
    container.addEventListener("pointerover", (e) => {
      if (e.pointerType === "touch") return;
      const it = e.target.closest(items);
      if (it && container.contains(it) && it !== current && !it.matches(":disabled,[aria-disabled=true]")) moveTo(it);
    });
    if (!persist) {
      container.addEventListener("pointerleave", hide);
      container.addEventListener("focusin", (e) => { const it = e.target.closest(items); if (it && e.target.matches(":focus-visible")) moveTo(it); });
      container.addEventListener("focusout", (e) => { if (!container.contains(e.relatedTarget)) hide(); });
    }
    return { moveTo, hide, pill, get current() { return current; } };
  };

  /* ===================================================================== segmented
     <div class="seg"><button class="seg-btn" data-value="a">…</button>…</div>
     The thumb springs to the chosen option. S.segmented(el, { value, onChange }) */
  S.segmented = (el, { value, onChange } = {}) => {
    if (!el) return;
    const thumb = document.createElement("span");
    thumb.className = "seg-thumb no-move"; thumb.setAttribute("aria-hidden", "true");
    el.prepend(thumb);
    const btns = S.$$(".seg-btn", el);
    if (!el.hasAttribute("role")) el.setAttribute("role", "group");
    const place = (btn) => {
      thumb.style.transform = `translateX(${btn.offsetLeft}px)`;
      thumb.style.width = `${btn.offsetWidth}px`;
    };
    const set = (v, { silent = false, instant = false } = {}) => {
      const btn = btns.find((b) => b.dataset.value === String(v)) || btns[0];
      btns.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      if (instant) thumb.classList.add("no-move");
      place(btn);
      if (instant) { thumb.offsetWidth; thumb.classList.remove("no-move"); }
      if (!silent) onChange?.(btn.dataset.value, btn);
    };
    btns.forEach((b) => b.addEventListener("click", () => set(b.dataset.value)));
    el.addEventListener("keydown", (e) => {
      const i = btns.indexOf(e.target);
      if (i < 0 || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
      e.preventDefault();
      const next = e.key === "Home" ? 0 : e.key === "End" ? btns.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + btns.length) % btns.length;
      btns[next].focus(); set(btns[next].dataset.value);
    });
    const init = () => { set(value ?? (btns.find((b) => b.getAttribute("aria-pressed") === "true") || btns[0]).dataset.value, { silent: true, instant: true }); };
    if (el.isConnected && el.offsetWidth) init(); else requestAnimationFrame(init);
    new ResizeObserver(() => { const a = btns.find((b) => b.getAttribute("aria-pressed") === "true"); if (a) { thumb.classList.add("no-move"); place(a); thumb.offsetWidth; thumb.classList.remove("no-move"); } }).observe(el);
    return { set, get value() { return btns.find((b) => b.getAttribute("aria-pressed") === "true")?.dataset.value; } };
  };

  /* ===================================================================== popover
     S.popover(trigger, panel) — toggles [data-open], closes on outside click /
     Escape, and sets transform-origin so the panel grows out of its trigger.  */
  S.popover = (trigger, panel, { onOpen, onClose } = {}) => {
    panel.inert = !panel.hasAttribute("data-open");
    const open = () => {
      panel.inert = false;
      panel.setAttribute("data-open", ""); trigger.setAttribute("aria-expanded", "true");
      const t = trigger.getBoundingClientRect(), p = panel.getBoundingClientRect();
      panel.style.setProperty("--pop-origin", `${S.clamp(t.left + t.width / 2 - p.left, 0, p.width)}px ${t.top < p.top ? "0" : "100%"}`);
      onOpen?.();
    };
    const close = () => { panel.removeAttribute("data-open"); panel.inert = true; trigger.setAttribute("aria-expanded", "false"); onClose?.(); };
    const isOpen = () => panel.hasAttribute("data-open");
    trigger.addEventListener("click", (e) => { e.stopPropagation(); isOpen() ? close() : open(); });
    document.addEventListener("pointerdown", (e) => { if (isOpen() && !panel.contains(e.target) && !trigger.contains(e.target)) close(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && isOpen()) { close(); trigger.focus(); } });
    document.addEventListener("schematic:navigate", close);
    return { open, close, isOpen };
  };

  S._loadSprings = loadSprings;
})();
