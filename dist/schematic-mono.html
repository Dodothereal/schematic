<!doctype html>
<html lang="en" data-theme="light" data-palette="mono">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schematic</title>
  <meta name="description" content="Schematic — a unified, motion-first design system prototype.">
  <meta name="color-scheme" content="light dark">
  <!-- Apply palette and explicit preferences before first paint. -->
  <script>
    (() => {
      const g = (k) => { try { return localStorage.getItem("schematic:" + k); } catch { return null; } };
      const r = document.documentElement;
      r.dataset.theme = g("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      const palette = g("palette");
      r.dataset.palette = palette === "mono" || palette === "color" ? palette : r.dataset.palette || "color";
      const h = g("hue");
      if (h !== null && h.trim() !== "" && Number.isFinite(Number(h))) r.style.setProperty("--accent-h", h);
      const rad = g("radius"); if (rad && rad !== "default") r.dataset.radius = rad;
      const m = g("motion"); if (m) r.dataset.motion = m;
    })();
  </script>

/* =============================================================================
   SCHEMATIC — DESIGN TOKENS
   The single source of truth. Every other file consumes these; nothing else
   hard-codes a colour, size, radius, duration or curve.
   Reference for future Tailwind/CSS, SwiftUI and Rust adapters.
   ============================================================================= */

:root {
  /* ---------------------------------------------------------------- Tuning */
  --accent-h: 168;          /* forest; this knob retunes only the accent    */
  --accent-c: 0.115;        /* restrained chroma, readable at every hue     */
  --neutral-h: 80;          /* warm paper / graphite, independent of brand  */
  --neutral-c: 0.008;       /* subtle warmth in the neutral surfaces        */
  --radius-scale: 1;        /* 0 = sharp, 1 = default, 1.6 = round          */
  --motion-scale: 1;        /* 1 = normal, 4 = slow-mo inspection, 0.01 = off */

  /* ---------------------------------------------------------------- Spacing
     4px base grid. Never use a value outside this scale.                   */
  --s-0: 0px;
  --s-px: 1px;
  --s-0_5: 2px;
  --s-1: 4px;
  --s-1_5: 6px;
  --s-2: 8px;
  --s-2_5: 10px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --s-10: 40px;
  --s-12: 48px;
  --s-16: 64px;
  --s-20: 80px;
  --s-24: 96px;

  /* ---------------------------------------------------------------- Radius */
  --r-xs: calc(4px * var(--radius-scale));
  --r-sm: calc(6px * var(--radius-scale));
  --r-md: calc(8px * var(--radius-scale));
  --r-lg: calc(12px * var(--radius-scale));
  --r-xl: calc(16px * var(--radius-scale));
  --r-2xl: calc(22px * var(--radius-scale));
  --r-full: 999px;

  /* ---------------------------------------------------------------- Type */
  --font-sans: "Inter", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --font-display: "SF Pro Display", "Inter Display", "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, monospace;

  --t-2xs: 11px;  --lh-2xs: 16px;
  --t-xs: 12px;   --lh-xs: 16px;
  --t-sm: 13px;   --lh-sm: 20px;
  --t-md: 14px;   --lh-md: 22px;   /* body */
  --t-lg: 16px;   --lh-lg: 24px;
  --t-xl: 18px;   --lh-xl: 26px;
  --t-2xl: 22px;  --lh-2xl: 30px;
  --t-3xl: 28px;  --lh-3xl: 34px;
  --t-4xl: 36px;  --lh-4xl: 42px;
  --t-5xl: 48px;  --lh-5xl: 52px;
  --t-6xl: 64px;  --lh-6xl: 66px;

  --w-regular: 420;
  --w-medium: 520;
  --w-semibold: 600;
  --w-bold: 680;

  --tracking-tight: -0.022em;
  --tracking-display: -0.035em;
  --tracking-wide: 0.06em;

  /* ---------------------------------------------------------------- Sizing */
  --control-xs: 24px;
  --control-sm: 28px;
  --control-md: 34px;
  --control-lg: 40px;
  --control-xl: 48px;

  --icon-sm: 16px;
  --icon-md: 18px;
  --icon-lg: 20px;
  --icon-xl: 24px;
  --ic-stroke: 1.6;

  --sidebar-w: 248px;
  --topbar-h: 56px;
  --content-max: 1080px;
  --rail-w: 196px;

  /* ---------------------------------------------------------------- Motion
     Durations are multiplied by --motion-scale so the whole system can be
     slowed down for inspection, or switched off for reduced-motion users.  */
  --d-instant: calc(80ms * var(--motion-scale));   /* press feedback          */
  --d-fast: calc(140ms * var(--motion-scale));     /* hover, colour, opacity  */
  --d-base: calc(220ms * var(--motion-scale));     /* small moves, toggles    */
  --d-moderate: calc(320ms * var(--motion-scale)); /* popovers, menus         */
  --d-slow: calc(460ms * var(--motion-scale));     /* page, dialog, layout    */
  --d-slower: calc(650ms * var(--motion-scale));   /* data viz, choreography  */
  --d-glacial: calc(1000ms * var(--motion-scale)); /* ambient / hero only     */

  /* Curves. Rule of thumb:
       entering / responding to the user  -> out
       leaving the screen                 -> in  (and ~30% faster)
       moving something already on screen -> in-out
       physical / playful / confirmation  -> spring                        */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);            /* quint, the default */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);        /* big, decisive entrances */
  --ease-out-soft: cubic-bezier(0.25, 0.8, 0.25, 1);     /* colour & opacity */
  --ease-in: cubic-bezier(0.64, 0, 0.78, 0);             /* exits */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);         /* on-screen travel */
  --ease-overshoot: cubic-bezier(0.34, 1.56, 0.64, 1);   /* pop-ins, badges */
  --ease-anticipate: cubic-bezier(0.68, -0.4, 0.32, 1.4);/* wind-up then go */

  /* Springs, pre-baked as linear() from a real mass-spring simulation.
     Pair them with their natural duration token below.                    */
  --spring-smooth: linear(0, 0.0198, 0.0597, 0.1221, 0.1858, 0.2639, 0.3334, 0.4115, 0.477, 0.5388, 0.604, 0.656, 0.7095, 0.7512, 0.7933, 0.8255, 0.8537, 0.8814, 0.9021, 0.9222, 0.937, 0.9511, 0.9613, 0.9709, 0.9778, 0.9834, 0.9885, 0.992, 0.9952, 0.9973, 0.9991, 1.0003, 1.0012, 1.0018, 1.0021, 1.0024, 1.0025, 1.0024, 1.0024, 1.0022, 1.0021, 1.0019, 1.0017, 1.0015, 1.0014, 1.0012, 1.001, 1.0009, 1);
  --spring-snappy: linear(0, 0.0203, 0.0681, 0.1343, 0.212, 0.2954, 0.3803, 0.4635, 0.5425, 0.6159, 0.6721, 0.733, 0.7868, 0.8334, 0.8732, 0.9067, 0.9345, 0.9571, 0.9752, 0.9893, 0.9984, 1.0067, 1.0126, 1.0165, 1.0188, 1.0199, 1.02, 1.0195, 1.0184, 1.0172, 1.0157, 1.014, 1.0123, 1.0106, 1.009, 1.0076, 1.0062, 1.0051, 1.004, 1.0033, 1.0025, 1.0018, 1.0013, 1.0008, 1.0005, 1.0002, 1, 0.9998, 1);
  --spring-bouncy: linear(0, 0.0584, 0.1975, 0.3806, 0.5604, 0.7473, 0.9084, 1.0253, 1.116, 1.1696, 1.1903, 1.1879, 1.1669, 1.1375, 1.1004, 1.0633, 1.0325, 1.0048, 0.9842, 0.9718, 0.9647, 0.9632, 0.9655, 0.9708, 0.9776, 0.9843, 0.9911, 0.997, 1.0012, 1.0045, 1.0063, 1.007, 1.0069, 1.0061, 1.005, 1.0036, 1.0022, 1.0011, 1.0001, 0.9994, 0.9989, 0.9987, 0.9986, 0.9987, 0.9989, 0.9992, 0.9994, 0.9997, 1);
  --d-spring-smooth: calc(600ms * var(--motion-scale));
  --d-spring-snappy: calc(470ms * var(--motion-scale));
  --d-spring-bouncy: calc(930ms * var(--motion-scale));

  --stagger: calc(32ms * var(--motion-scale));  /* delay step for lists */

  /* ---------------------------------------------------------------- Z */
  --z-sticky: 10;
  --z-sidebar: 20;
  --z-popover: 50;
  --z-toast: 70;
  --z-dialog: 80;
  --z-tooltip: 90;
}

/* =============================================================================
   COLOUR — LIGHT (default)
   OKLCH keeps lightness perceptually even. Only intent follows --accent-h;
   paper, graphite and chart series remain independent of the brand hue.
   ============================================================================= */
:root,
[data-theme="light"] {
  color-scheme: light;

  --bg: oklch(0.982 var(--neutral-c) var(--neutral-h));
  --bg-sunken: oklch(0.958 var(--neutral-c) var(--neutral-h));
  --surface: oklch(0.995 calc(var(--neutral-c) * 0.35) var(--neutral-h));
  --surface-2: oklch(0.972 calc(var(--neutral-c) * 0.8) var(--neutral-h));
  --surface-3: oklch(0.945 var(--neutral-c) var(--neutral-h));
  --surface-raised: var(--surface);
  --overlay: oklch(0.2 var(--neutral-c) var(--neutral-h) / 0.28);

  --border: oklch(0.895 calc(var(--neutral-c) * 1.2) var(--neutral-h));
  --border-soft: oklch(0.93 var(--neutral-c) var(--neutral-h));
  --border-strong: oklch(0.82 calc(var(--neutral-c) * 1.4) var(--neutral-h));

  --text: oklch(0.23 var(--neutral-c) var(--neutral-h));
  --text-2: oklch(0.41 var(--neutral-c) var(--neutral-h));
  --text-3: oklch(0.49 var(--neutral-c) var(--neutral-h));
  --text-4: oklch(0.67 var(--neutral-c) var(--neutral-h));
  --text-inverse: oklch(0.99 0 0);

  --accent: oklch(0.45 var(--accent-c) var(--accent-h));
  --accent-hover: oklch(0.42 var(--accent-c) var(--accent-h));
  --accent-press: oklch(0.39 var(--accent-c) var(--accent-h));
  --accent-text: oklch(0.41 var(--accent-c) var(--accent-h));
  --accent-contrast: oklch(0.995 0 0);
  --accent-soft: oklch(0.45 var(--accent-c) var(--accent-h) / 0.08);
  --accent-soft-2: oklch(0.45 var(--accent-c) var(--accent-h) / 0.13);
  --accent-ring: oklch(0.45 var(--accent-c) var(--accent-h) / 0.42);

  --success: oklch(0.6 0.15 155);
  --success-soft: oklch(0.6 0.15 155 / 0.12);
  --success-text: oklch(0.44 0.11 155);
  --warning: oklch(0.75 0.16 70);
  --warning-soft: oklch(0.75 0.16 70 / 0.16);
  --warning-text: oklch(0.47 0.11 60);
  --danger: oklch(0.51 0.19 25);
  --danger-hover: oklch(0.46 0.19 25);
  --danger-contrast: oklch(0.99 0 0);
  --danger-soft: oklch(0.6 0.21 25 / 0.1);
  --danger-text: oklch(0.47 0.18 25);
  --info: oklch(0.62 0.14 235);
  --info-soft: oklch(0.62 0.14 235 / 0.12);
  --info-text: oklch(0.44 0.11 235);

  /* Graphs only: five independent hues, including in Mono interface mode. */
  --chart-1: oklch(0.53 0.15 255);
  --chart-2: oklch(0.58 0.1 185);
  --chart-3: oklch(0.65 0.14 75);
  --chart-4: oklch(0.58 0.17 340);
  --chart-5: oklch(0.57 0.14 295);
  --chart-grid: var(--border-soft);

  --shadow-xs: 0 1px 2px oklch(0.2 0 0 / 0.06);
  --shadow-sm: 0 1px 2px oklch(0.2 0 0 / 0.05), 0 2px 6px -1px oklch(0.2 0 0 / 0.06);
  --shadow-md: 0 1px 2px oklch(0.2 0 0 / 0.04), 0 6px 16px -4px oklch(0.2 0 0 / 0.1);

  --inset-highlight: inset 0 1px 0 oklch(1 0 0 / 0.7);
  --btn-primary-highlight: inset 0 1px 0 oklch(1 0 0 / 0.22), inset 0 -1px 0 oklch(0 0 0 / 0.12);
}

   ============================================================================= */
[data-theme="dark"] {

  --bg-sunken: oklch(0.15 var(--neutral-c) var(--neutral-h));

  --surface-2: oklch(0.23 var(--neutral-c) var(--neutral-h));
  --surface-3: oklch(0.265 var(--neutral-c) var(--neutral-h));

  --text-3: oklch(0.68 var(--neutral-c) var(--neutral-h));
  --text-4: oklch(0.47 var(--neutral-c) var(--neutral-h));
  --text-inverse: oklch(0.16 var(--neutral-c) var(--neutral-h));

  --accent: oklch(0.73 var(--accent-c) var(--accent-h));
  --accent-hover: oklch(0.78 var(--accent-c) var(--accent-h));
  --accent-press: oklch(0.69 var(--accent-c) var(--accent-h));

  --accent-soft: oklch(0.73 var(--accent-c) var(--accent-h) / 0.12);
  --accent-soft-2: oklch(0.73 var(--accent-c) var(--accent-h) / 0.18);
  --accent-ring: oklch(0.73 var(--accent-c) var(--accent-h) / 0.45);

  --success: oklch(0.7 0.15 155);
  --success-soft: oklch(0.7 0.15 155 / 0.14);
  --success-text: oklch(0.78 0.14 155);
  --warning: oklch(0.8 0.15 75);
  --warning-soft: oklch(0.8 0.15 75 / 0.14);
  --warning-text: oklch(0.84 0.13 80);
  --danger: oklch(0.69 0.18 25);
  --danger-hover: oklch(0.74 0.18 25);
  --danger-contrast: oklch(0.14 0 0);
  --danger-soft: oklch(0.66 0.2 25 / 0.15);
  --danger-text: oklch(0.76 0.16 25);
  --info: oklch(0.7 0.13 235);
  --info-soft: oklch(0.7 0.13 235 / 0.15);
  --info-text: oklch(0.8 0.11 235);

  --chart-1: oklch(0.73 0.13 255);
  --chart-2: oklch(0.76 0.11 185);
  --chart-3: oklch(0.8 0.13 80);
  --chart-4: oklch(0.74 0.15 340);
  --chart-5: oklch(0.75 0.13 295);

  --shadow-xs: 0 1px 2px oklch(0 0 0 / 0.3);
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3), 0 2px 6px -1px oklch(0 0 0 / 0.3);
  --shadow-md: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 20px -4px oklch(0 0 0 / 0.45);
  --shadow-lg: 0 2px 4px oklch(0 0 0 / 0.3), 0 18px 44px -8px oklch(0 0 0 / 0.55);
  --shadow-xl: 0 4px 8px oklch(0 0 0 / 0.3), 0 32px 80px -12px oklch(0 0 0 / 0.65);
  --inset-highlight: inset 0 1px 0 oklch(1 0 0 / 0.05);
  --btn-primary-highlight: inset 0 1px 0 oklch(1 0 0 / 0.25), inset 0 -1px 0 oklch(0 0 0 / 0.15);

/* =============================================================================
   MONO — neutral interface, with chart colours reserved for data.
   Meaning still comes from the existing status labels and icons.
   ============================================================================= */
[data-palette="mono"] {
  --neutral-c: 0;
  --accent-c: 0;
  --accent: oklch(0.25 0 0);
  --accent-hover: oklch(0.2 0 0);
  --accent-press: oklch(0.15 0 0);
  --accent-text: oklch(0.25 0 0);
  --accent-contrast: oklch(0.995 0 0);
  --accent-soft: oklch(0.25 0 0 / 0.07);
  --accent-soft-2: oklch(0.25 0 0 / 0.12);
  --accent-ring: oklch(0.25 0 0 / 0.42);

  --success: oklch(0.42 0 0);
  --warning: oklch(0.49 0 0);
  --info: oklch(0.45 0 0);
  --danger: oklch(0.32 0 0);
  --danger-hover: oklch(0.25 0 0);
  --danger-contrast: oklch(0.995 0 0);
  --success-text: var(--text-2);
  --warning-text: var(--text-2);
  --info-text: var(--text-2);
  --danger-text: var(--text);
  --success-soft: var(--accent-soft);
  --warning-soft: var(--accent-soft);
  --info-soft: var(--accent-soft);
  --danger-soft: var(--accent-soft-2);
}

[data-theme="dark"][data-palette="mono"] {
  --accent: oklch(0.9 0 0);
  --accent-hover: oklch(0.95 0 0);
  --accent-press: oklch(0.84 0 0);
  --accent-text: oklch(0.9 0 0);
  --accent-contrast: oklch(0.14 0 0);
  --accent-soft: oklch(0.9 0 0 / 0.1);
  --accent-soft-2: oklch(0.9 0 0 / 0.16);
  --accent-ring: oklch(0.9 0 0 / 0.45);
  --success: oklch(0.77 0 0);
  --warning: oklch(0.82 0 0);
  --info: oklch(0.79 0 0);
  --danger: oklch(0.85 0 0);
  --danger-hover: oklch(0.92 0 0);
  --danger-contrast: oklch(0.14 0 0);
}

/* =============================================================================
   ACCESSIBILITY OVERRIDES
   ============================================================================= */
@media (prefers-reduced-motion: reduce) {
  :root:not([data-motion="full"]) { --motion-scale: 0.01; }
}
[data-motion="reduced"] { --motion-scale: 0.01; }
[data-motion="slow"] { --motion-scale: 4; }

[data-radius="sharp"] { --radius-scale: 0.35; }
[data-radius="round"] { --radius-scale: 1.6; }

/* =============================================================================
   SCHEMATIC — BASE: reset, typography, application shell
   ============================================================================= */

@property --accent-h { syntax: "<number>"; inherits: true; initial-value: 168; }
@property --radius-scale { syntax: "<number>"; inherits: true; initial-value: 1; }

/* Re-tuning the brand hue or radius morphs the whole UI instead of snapping */
:root {
  transition: --accent-h calc(500ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1),
              --radius-scale calc(500ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1);
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
body {
  min-height: 100%;
  font-family: var(--font-sans);
  font-size: var(--t-md);
  line-height: var(--lh-md);
  font-weight: var(--w-regular);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv11", "ss01", "ss03";
  overflow: hidden;
}
img, svg, video, canvas { display: block; max-width: 100%; }
svg.ic { display: inline-block; }
input, button, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4 { font-weight: var(--w-semibold); letter-spacing: var(--tracking-tight); text-wrap: balance; }
p { text-wrap: pretty; }
::selection { background: var(--accent-soft-2); color: var(--text); }
[hidden] { display: none !important; }
.skip-link { position:fixed;top:var(--s-3);left:var(--s-3);z-index:100;padding:var(--s-3) var(--s-4);border-radius:var(--r-md);background:var(--surface);color:var(--text);box-shadow:var(--shadow-md);transform:translateY(-200%); }
.skip-link:focus { transform:none; }

/* Focus: a ring that *settles* onto the element rather than blinking on */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent-ring);
  outline-offset: 2px;
  animation: focus-settle var(--d-base) var(--ease-out);
}
@keyframes focus-settle { from { outline-offset: 6px; outline-color: transparent; } }
.page h1[tabindex="-1"]:focus { outline:none;animation:none; }

/* Scrollbars: quiet until needed */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* ------------------------------------------------------------------ type */
.t-display { font-family: var(--font-display); font-size: var(--t-5xl); line-height: var(--lh-5xl); letter-spacing: var(--tracking-display); font-weight: var(--w-semibold); }
.t-h1 { font-family: var(--font-display); font-size: var(--t-4xl); line-height: var(--lh-4xl); letter-spacing: var(--tracking-display); font-weight: var(--w-semibold); }
.t-h2 { font-size: var(--t-2xl); line-height: var(--lh-2xl); letter-spacing: var(--tracking-tight); font-weight: var(--w-semibold); }
.t-h3 { font-size: var(--t-lg); line-height: var(--lh-lg); letter-spacing: -0.011em; font-weight: var(--w-semibold); }

/* ---------------------------------------------------------------- shared keyframes */
@keyframes ic-spin { to { transform: rotate(360deg); } }
@keyframes ic-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes ic-through-x {
  0%   { transform: none; opacity: 1; animation-timing-function: cubic-bezier(0.64, 0, 0.78, 0); }
  42%  { transform: translateX(7px); opacity: 0; }
  43%  { transform: translateX(-7px); opacity: 0; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  100% { transform: none; opacity: 1; }
}
@keyframes ic-through-x-rev {
  0%   { transform: none; opacity: 1; animation-timing-function: cubic-bezier(0.64, 0, 0.78, 0); }
  42%  { transform: translateX(-7px); opacity: 0; }
  43%  { transform: translateX(7px); opacity: 0; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  100% { transform: none; opacity: 1; }
}
@keyframes ic-through-diag {
  0%   { transform: none; opacity: 1; animation-timing-function: cubic-bezier(0.64, 0, 0.78, 0); }
  42%  { transform: translate(6px, -6px); opacity: 0; }
  43%  { transform: translate(-6px, 6px); opacity: 0; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  100% { transform: none; opacity: 1; }
}
@keyframes ic-fly {
  0%   { transform: none; opacity: 1; animation-timing-function: cubic-bezier(0.64, 0, 0.78, 0); }
  40%  { transform: translate(12px, -12px) scale(0.6); opacity: 0; }
  41%  { transform: translate(-10px, 10px) scale(0.6); opacity: 0; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
  100% { transform: none; opacity: 1; }
}
@keyframes ic-nudge-x { 0%, 100% { transform: none; } 40% { transform: translateX(3px); } }
@keyframes ic-nudge-y { 0%, 100% { transform: none; } 40% { transform: translateY(3px); } }
@keyframes ic-nudge-up { 0%, 100% { transform: none; } 40% { transform: translateY(-3px); } }
@keyframes ic-turn-90 { from { transform: rotate(0); } to { transform: rotate(90deg); } }
@keyframes ic-turn-360 { from { transform: rotate(0); } to { transform: rotate(360deg); } }
@keyframes ic-pop {
  0% { transform: scale(1); }
  35% { transform: scale(0.55); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
  100% { transform: scale(1); }
}
@keyframes ic-hop {
  0% { transform: none; }
  30% { transform: translateY(-2.5px); animation-timing-function: cubic-bezier(0.64, 0, 0.78, 0); }
  55% { transform: translateY(0.6px) scale(1.04, 0.95); }
  100% { transform: none; }
}
@keyframes ic-shake {
  0%, 100% { transform: none; }
  15% { transform: translateX(-1.6px) rotate(-4deg); }
  30% { transform: translateX(1.6px) rotate(4deg); }
  45% { transform: translateX(-1.1px) rotate(-2deg); }
  60% { transform: translateX(1px) rotate(1.5deg); }
  75% { transform: translateX(-0.4px); }
}
@keyframes ic-bounce-dot {
  0%, 100% { transform: none; }
  30% { transform: translateY(-2.6px); animation-timing-function: cubic-bezier(0.64, 0, 0.78, 0); }
  60% { transform: translateY(0.4px); }
}
@keyframes ic-grow-y {
  0% { transform: scaleY(1); }
  30% { transform: scaleY(0.25); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
  100% { transform: scaleY(1); }
}
@keyframes ic-fade-late { 0%, 45% { opacity: 0; transform: translate(-2px, 2px); } 100% { opacity: 1; transform: none; } }

/* ---------------------------------------------------------------- per-icon choreography
   D() = duration helper written out: calc(Nms * var(--motion-scale))           */

/* arrows: travel *through* — exit one side, re-enter from the other */
.is-anim[data-i="arrow-right"] .a,
.is-anim[data-i="logout"] .a { animation: ic-through-x calc(520ms * var(--motion-scale)) both; }
.is-anim[data-i="arrow-left"] .a { animation: ic-through-x-rev calc(520ms * var(--motion-scale)) both; }
.is-anim[data-i="arrow-up"] .a { animation: ic-through-up var(--d-slower) both; }
.is-anim[data-i="arrow-down"] .a { animation: ic-through-down var(--d-slower) both; }
@keyframes ic-through-up {
  0% { transform: none; opacity: 1; animation-timing-function: var(--ease-in); }
  42% { transform: translateY(-7px); opacity: 0; }
  43% { transform: translateY(7px); opacity: 0; animation-timing-function: var(--ease-out); }
  100% { transform: none; opacity: 1; }
}
@keyframes ic-through-down {
  0% { transform: none; opacity: 1; animation-timing-function: var(--ease-in); }
  42% { transform: translateY(7px); opacity: 0; }
  43% { transform: translateY(-7px); opacity: 0; animation-timing-function: var(--ease-out); }
  100% { transform: none; opacity: 1; }
}
.is-anim[data-i="arrow-up-right"] .a,
.is-anim[data-i="external"] .a { animation: ic-through-diag calc(520ms * var(--motion-scale)) both; }
.is-anim[data-i="chevron-right"] .a { animation: ic-nudge-x calc(420ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
.is-anim[data-i="chevron-down"] .a { animation: ic-nudge-y calc(420ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
.is-anim[data-i="chevrons-up-down"] .a { animation: ic-nudge-up calc(420ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
.is-anim[data-i="chevrons-up-down"] .b { animation: ic-nudge-y calc(420ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }

/* download / upload: the arrow drops into the tray, the tray absorbs it */
.is-anim[data-i="download"] .a { animation: ic-dl-arrow calc(620ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
.is-anim[data-i="download"] .b,
.is-anim[data-i="upload"] .b { animation: ic-dl-tray calc(620ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 12px 21px; }
.is-anim[data-i="upload"] .a { animation: ic-ul-arrow calc(620ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes ic-dl-arrow { 0% { transform: none; } 35% { transform: translateY(3.5px); } 60% { transform: translateY(-1px); } 100% { transform: none; } }
@keyframes ic-ul-arrow { 0% { transform: none; } 35% { transform: translateY(-3.5px); } 60% { transform: translateY(1px); } 100% { transform: none; } }
@keyframes ic-dl-tray { 0%, 25% { transform: none; } 40% { transform: scale(1.06, 0.82); } 70% { transform: scale(0.98, 1.04); } 100% { transform: none; } }

.is-anim[data-i="refresh"] .a { animation: ic-turn-360 calc(720ms * var(--motion-scale)) cubic-bezier(0.16, 1, 0.3, 1); }

/* actions */
.is-anim[data-i="check"] .draw,
.is-anim[data-i="check-circle"] .draw { animation: ic-draw calc(480ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1) both; }
.is-anim[data-i="check-circle"] .b,
.is-anim[data-i="x-circle"] .b { animation: ic-ring-pulse calc(480ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes ic-ring-pulse { 0% { transform: scale(1); } 30% { transform: scale(0.88); } 100% { transform: scale(1); } }
.is-anim[data-i="x"] .a,
.is-anim[data-i="plus"] .a,
.is-anim[data-i="x-circle"] .a { animation: ic-turn-90 calc(460ms * var(--motion-scale)) cubic-bezier(0.34, 1.56, 0.64, 1); }
.is-anim[data-i="minus"] .a { animation: ic-minus calc(420ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes ic-minus { 0%, 100% { transform: none; } 40% { transform: scaleX(0.55); } }

.is-anim[data-i="search"] .a { animation: ic-scan calc(720ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1); }
@keyframes ic-scan {
  0%, 100% { transform: none; }
  25% { transform: translate(-1.6px, 0.4px); }
  50% { transform: translate(0, -1.6px); }
  75% { transform: translate(1.6px, 0.4px); }
}

.is-anim[data-i="trash"] .a { animation: ic-lid calc(680ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 20px 7px; }
@keyframes ic-lid {
  0% { transform: none; }
  35% { transform: translateY(-2px) rotate(13deg); }
  65% { transform: translateY(-0.5px) rotate(-2deg); }
  100% { transform: none; }
}

.is-anim[data-i="copy"] .a { animation: ic-copy-front calc(520ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
.is-anim[data-i="copy"] .b { animation: ic-copy-back calc(520ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes ic-copy-front { 0%, 100% { transform: none; } 40% { transform: translate(-2.5px, -2.5px); } }
@keyframes ic-copy-back { 0%, 100% { transform: none; } 40% { transform: translate(1px, 1px); opacity: 0.5; } }

.is-anim[data-i="pencil"] .a { animation: ic-scribble calc(640ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1); transform-origin: 4px 20px; }
@keyframes ic-scribble { 0%, 100% { transform: none; } 25% { transform: rotate(-9deg); } 50% { transform: rotate(6deg) translateX(1px); } 75% { transform: rotate(-3deg); } }

.is-anim[data-i="send"] .a { animation: ic-fly calc(820ms * var(--motion-scale)) both; }

.is-anim[data-i="link"] .a { animation: ic-link-a calc(540ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
.is-anim[data-i="link"] .b { animation: ic-link-b calc(540ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes ic-link-a { 0%, 100% { transform: none; } 40% { transform: translate(1.8px, -1.8px); } }
@keyframes ic-link-b { 0%, 100% { transform: none; } 40% { transform: translate(-1.8px, 1.8px); } }

.is-anim[data-i="filter"] .a { animation: ic-funnel calc(560ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 12px 5px; }
@keyframes ic-funnel { 0%, 100% { transform: none; } 30% { transform: scaleY(0.82); } 60% { transform: scaleY(1.05); } }

.is-anim[data-i="sliders"] .k1 { animation: ic-knob-r calc(640ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1); }
.is-anim[data-i="sliders"] .k2 { animation: ic-knob-l calc(640ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1) calc(60ms * var(--motion-scale)); }
@keyframes ic-knob-r { 0%, 100% { transform: none; } 45% { transform: translateX(7px); } }
@keyframes ic-knob-l { 0%, 100% { transform: none; } 45% { transform: translateX(-7px); } }

.is-anim[data-i="play"] .a { animation: ic-play calc(520ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes ic-play { 0%, 100% { transform: none; } 30% { transform: translateX(2.5px) scaleX(0.88); } 60% { transform: translateX(-0.6px); } }
.is-anim[data-i="pause"] .a { animation: ic-grow-y calc(480ms * var(--motion-scale)) both; }
.is-anim[data-i="pause"] .b { animation: ic-grow-y calc(480ms * var(--motion-scale)) calc(70ms * var(--motion-scale)) both; }

.is-anim[data-i="more"] .d1,
.is-anim[data-i="chat"] .d1 { animation: ic-bounce-dot calc(520ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
.is-anim[data-i="more"] .d2,
.is-anim[data-i="chat"] .d2 { animation: ic-bounce-dot calc(520ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1) calc(70ms * var(--motion-scale)); }
.is-anim[data-i="more"] .d3,
.is-anim[data-i="chat"] .d3 { animation: ic-bounce-dot calc(520ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1) calc(140ms * var(--motion-scale)); }

.is-anim[data-i="menu"] .l1 { animation: ic-menu calc(480ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
.is-anim[data-i="menu"] .l2 { animation: ic-menu calc(480ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1) calc(50ms * var(--motion-scale)); }
.is-anim[data-i="menu"] .l3 { animation: ic-menu calc(480ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1) calc(100ms * var(--motion-scale)); }
.ic[data-i="menu"] path { transform-origin: 4px 12px; }
@keyframes ic-menu { 0%, 100% { transform: none; } 40% { transform: scaleX(0.55); } }

.is-anim[data-i="command"] .a { animation: ic-turn-90 calc(600ms * var(--motion-scale)) cubic-bezier(0.34, 1.56, 0.64, 1); }

.is-anim[data-i="cursor"] .a { animation: ic-click calc(520ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 6px 5px; }
.is-anim[data-i="cursor"] .b { animation: ic-click-rays calc(520ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 6px 5px; }
@keyframes ic-click { 0%, 100% { transform: none; } 30% { transform: scale(0.84); } }
@keyframes ic-click-rays { 0%, 25% { opacity: 0; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.15); } }

/* A pin seats, a grip separates into two rails, and a stop absorbs momentum. */
.is-anim[data-i="pin"] > .a { animation: ic-seat-pin var(--d-slower) var(--ease-out); transform-origin: 12px 21px; }
@keyframes ic-seat-pin {
  0%, 100% { transform: none; }
  25% { transform: translateY(-3px) rotate(-8deg); }
  55% { transform: translateY(.8px) rotate(2deg); }
  78% { transform: translateY(-.3px); }
}
.is-anim[data-i="grip"] .a { animation: ic-grip-left var(--d-slow) var(--ease-in-out); }
.is-anim[data-i="grip"] .b { animation: ic-grip-right var(--d-slow) var(--ease-in-out); }
@keyframes ic-grip-left { 0%, 100% { transform: none; } 45% { transform: translateX(-1.5px); } }
@keyframes ic-grip-right { 0%, 100% { transform: none; } 45% { transform: translateX(1.5px); } }
.is-anim[data-i="stop"] .a { animation: ic-brake var(--d-slow) var(--ease-out); }
@keyframes ic-brake {
  0%, 100% { transform: none; }
  25% { transform: scaleX(.78) scaleY(1.08); }
  55% { transform: scaleX(1.05) scaleY(.97); }
}

/* objects */
.is-anim[data-i="bell"] .a { animation: ic-ring calc(820ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 12px 4px; }
.is-anim[data-i="bell"] .b { animation: ic-clapper calc(820ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1) calc(40ms * var(--motion-scale)); }
@keyframes ic-ring {
  0%, 100% { transform: none; }
  12% { transform: rotate(16deg); } 28% { transform: rotate(-13deg); }
  44% { transform: rotate(9deg); } 60% { transform: rotate(-5deg); } 76% { transform: rotate(2deg); }
}
@keyframes ic-clapper {
  0%, 100% { transform: none; }
  14% { transform: translateX(-2px); } 30% { transform: translateX(2px); }
  46% { transform: translateX(-1.2px); } 62% { transform: translateX(0.8px); }
}

.is-anim[data-i="home"] .a { animation: ic-hop calc(560ms * var(--motion-scale)) both; transform-origin: 12px 11px; }

.is-anim[data-i="mail"] .a { animation: ic-flap calc(680ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1); transform-origin: 12px 6.5px; }
@keyframes ic-flap { 0%, 100% { transform: scaleY(1); } 45% { transform: scaleY(-0.55); } }

.is-anim[data-i="lock"] .a { animation: ic-shackle calc(640ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes ic-shackle { 0%, 100% { transform: none; } 35% { transform: translateY(-2.6px); } 65% { transform: translateY(0.4px); } }

.is-anim[data-i="eye"] .a { animation: ic-blink calc(560ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1); }
.is-anim[data-i="eye"] .b { animation: ic-blink calc(560ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1), ic-look calc(900ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1); }
@keyframes ic-blink { 0%, 100% { transform: scaleY(1); } 22% { transform: scaleY(0.08); } 44% { transform: scaleY(1); } }
@keyframes ic-look { 0%, 45%, 100% { translate: 0 0; } 62% { translate: 2px 0; } 82% { translate: -1.5px 0; } }

.is-anim[data-i="heart"] .a { animation: ic-beat calc(720ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 12px 13px; }
@keyframes ic-beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.2); } 30% { transform: scale(0.94); } 46% { transform: scale(1.1); } 70% { transform: scale(0.99); } }

.is-anim[data-i="star"] .a { animation: ic-twinkle calc(680ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes ic-twinkle { 0%, 100% { transform: none; } 35% { transform: rotate(-20deg) scale(0.82); } 70% { transform: rotate(6deg) scale(1.08); } }

.is-anim[data-i="bookmark"] .a { animation: ic-ribbon calc(600ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 12px 3.5px; }
@keyframes ic-ribbon { 0%, 100% { transform: none; } 30% { transform: translateY(-2.5px) scaleY(0.92); } 60% { transform: translateY(0.5px) scaleY(1.06); } }

.is-anim[data-i="calendar"] .a { animation: ic-nudge-up calc(480ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
.is-anim[data-i="calendar"] .b { animation: ic-pop calc(520ms * var(--motion-scale)) calc(80ms * var(--motion-scale)) both; transform-origin: 12px 15.5px; }

.is-anim[data-i="clock"] .a { animation: ic-turn-360 calc(900ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1); }
.is-anim[data-i="clock"] .b { animation: ic-clock-h calc(900ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1); }
@keyframes ic-clock-h { from { transform: rotate(0); } to { transform: rotate(30deg); } }

.is-anim[data-i="document"] .l1 { animation: ic-draw calc(420ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1) both; }
.is-anim[data-i="document"] .l2 { animation: ic-draw calc(420ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1) calc(120ms * var(--motion-scale)) both; }
.is-anim[data-i="file-diff"] .a { animation: ic-diff-add var(--d-slow) var(--ease-out); }
.is-anim[data-i="file-diff"] .b { animation: ic-draw var(--d-slow) var(--ease-out) var(--d-fast) both; }
@keyframes ic-diff-add { 0%, 100% { transform: none; opacity: 1; } 35% { transform: translateY(-1.5px); opacity: .25; } 65% { transform: translateY(.4px); } }
.is-anim[data-i="book-open"] .a { animation: ic-draw var(--d-slow) var(--ease-out) both; }
.is-anim[data-i="book-open"] .b { animation: ic-draw var(--d-slow) var(--ease-out) var(--d-fast) both; }

.is-anim[data-i="folder"] .b { animation: ic-folder calc(560ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 12px 19px; }
@keyframes ic-folder { 0%, 100% { transform: none; } 40% { transform: translateY(2px) scaleX(0.9); opacity: 0.4; } }

.is-anim[data-i="user"] .a { animation: ic-nudge-up calc(480ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); }
.is-anim[data-i="users"] .a { animation: ic-join calc(560ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1) both; }
@keyframes ic-join { 0% { transform: translateX(-4px); opacity: 0; } 100% { transform: none; opacity: 1; } }

.is-anim[data-i="globe"] .a { animation: ic-meridian calc(800ms * var(--motion-scale)) cubic-bezier(0.65, 0, 0.35, 1); }
@keyframes ic-meridian { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.12); } 51% { transform: scaleX(0.12); } }

.is-anim[data-i="gauge"] .a { animation: ic-needle calc(820ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 12px 14px; }
@keyframes ic-needle { 0% { transform: none; } 30% { transform: rotate(-95deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); } 100% { transform: none; } }

.is-anim[data-i="droplet"] .a { animation: ic-drip calc(620ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 12px 20px; }
@keyframes ic-drip { 0%, 100% { transform: none; } 30% { transform: scale(1.08, 0.86); } 60% { transform: scale(0.96, 1.05); } }

.is-anim[data-i="palette"] .d1 { animation: ic-pop calc(480ms * var(--motion-scale)) both; }
.is-anim[data-i="palette"] .d2 { animation: ic-pop calc(480ms * var(--motion-scale)) calc(60ms * var(--motion-scale)) both; }
.is-anim[data-i="palette"] .d3 { animation: ic-pop calc(480ms * var(--motion-scale)) calc(120ms * var(--motion-scale)) both; }
.is-anim[data-i="palette"] .d4 { animation: ic-pop calc(480ms * var(--motion-scale)) calc(180ms * var(--motion-scale)) both; }

.ic[data-i="ruler"] [class^="t"] { transform-box: fill-box; transform-origin: 50% 0; }
.is-anim[data-i="ruler"] .t1 { animation: ic-grow-y calc(460ms * var(--motion-scale)) both; }
.is-anim[data-i="ruler"] .t2 { animation: ic-grow-y calc(460ms * var(--motion-scale)) calc(50ms * var(--motion-scale)) both; }
.is-anim[data-i="ruler"] .t3 { animation: ic-grow-y calc(460ms * var(--motion-scale)) calc(100ms * var(--motion-scale)) both; }

.is-anim[data-i="type"] .a { animation: ic-type calc(520ms * var(--motion-scale)) cubic-bezier(0.22, 1, 0.36, 1); transform-origin: 12px 19px; }

      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x; if (Math.abs(e) < 1e-6) return sy(t); const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1; t = x;
      for (let i = 0; i < 30; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  };
  const fromLinear = (str) => {
    const pts = (str.match(/linear\((.*)\)/)?.[1] || "0, 1").split(",").map((v) => parseFloat(v));
    const n = pts.length - 1;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; const p = x * n, i = Math.floor(p); return pts[i] + (pts[i + 1] - pts[i]) * (p - i); };
  };
  S.curve = {
    out: "cubic-bezier(0.22, 1, 0.36, 1)",
    outExpo: "cubic-bezier(0.16, 1, 0.3, 1)",
    in: "cubic-bezier(0.64, 0, 0.78, 0)",
    inOut: "cubic-bezier(0.65, 0, 0.35, 1)",
    overshoot: "cubic-bezier(0.34, 1.56, 0.64, 1)",
  };
  S.ease = {
    linear: (t) => t,
    out: bezier(0.22, 1, 0.36, 1),
    outExpo: bezier(0.16, 1, 0.3, 1),
    in: bezier(0.64, 0, 0.78, 0),
    inOut: bezier(0.65, 0, 0.35, 1),
    overshoot: bezier(0.34, 1.56, 0.64, 1),
  };
  S.springDur = { smooth: 600, snappy: 470, bouncy: 930 };
  const loadSprings = () => {
    ["smooth", "snappy", "bouncy"].forEach((k) => {
      const v = S.token(`--spring-${k}`);
      S.curve[`spring${k[0].toUpperCase()}${k.slice(1)}`] = v;
      S.ease[`spring${k[0].toUpperCase()}${k.slice(1)}`] = fromLinear(v);
    });
  };

  /* ===================================================================== tween
     S.tween({from, to, duration, ease, delay, onUpdate}) → { cancel, finished }
     from/to may be numbers or equal-length arrays (for path morphing).       */
  S.tween = ({ from = 0, to = 1, duration = 400, ease = S.ease.out, delay = 0, onUpdate, onDone } = {}) => {
    const d = S.dur(duration), dl = S.dur(delay), arr = Array.isArray(from);
    let raf, start = null, dead = false, resolve;
    const finished = new Promise((r) => (resolve = r));
    const step = (now) => {
      if (dead) return;
      if (start === null) start = now + dl;
      if (now < start) { raf = requestAnimationFrame(step); return; }
      const t = d <= 0 ? 1 : S.clamp((now - start) / d, 0, 1), k = ease(t);
      onUpdate?.(arr ? from.map((f, i) => f + (to[i] - f) * k) : from + (to - from) * k, t);
      if (t < 1) raf = requestAnimationFrame(step); else { onDone?.(); resolve(); }
    };
    raf = requestAnimationFrame(step);
    return { cancel() { dead = true; cancelAnimationFrame(raf); resolve(); }, finished };
  };

  /** Animate a number in an element's text. */
  S.countTo = (el, to, { from, duration = 900, format = (v) => Math.round(v).toLocaleString(), ease = S.ease.outExpo } = {}) => {
    el._count?.cancel();
    const start = from ?? el._countVal ?? 0;
    el._countVal = to;
    el._count = S.tween({ from: start, to, duration, ease, onUpdate: (v) => (el.textContent = format(v)) });
    return el._count.finished;
  };

  /* ===================================================================== FLIP
     S.flip(elements, mutate, opts) — record, mutate the DOM, animate the delta.
     New elements (not present before) scale/fade in.                          */
  S.flip = (els, mutate, { duration = S.springDur.snappy, easing, stagger = 0, enter = true } = {}) => {
    const list = [...(typeof els === "function" ? els() : els)];
    // Capture the displayed positions before cancelling an in-flight reorder.
    // Repeated actions then continue from the visible frame instead of jumping
    // back to the preceding layout before starting their next move.
    const first = new Map(list.map((el) => [el, el.getBoundingClientRect()]));
    list.forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
    mutate();
    if (S.reduced()) return Promise.resolve([]);
    const ease = easing || S.curve.springSnappy || S.curve.out;
    const anims = [];
    const after = typeof els === "function" ? els() : list;
    [...after].forEach((el, i) => {
      if (!el.isConnected || el.hidden) return;
      const f = first.get(el), l = el.getBoundingClientRect();
      if (!f) {
        if (enter) anims.push(el.animate([{ opacity: 0, transform: "scale(0.94)" }, { opacity: 1, transform: "none" }], { duration: S.dur(duration), easing: ease, delay: S.dur(i * stagger), fill: "backwards" }));
        return;
      }
      const dx = f.left - l.left, dy = f.top - l.top;
      const sx = l.width ? f.width / l.width : 1, sy = l.height ? f.height / l.height : 1;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(sx - 1) < 0.01 && Math.abs(sy - 1) < 0.01) return;
      anims.push(el.animate(
        [{ transformOrigin: "top left", transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` }, { transformOrigin: "top left", transform: "none" }],
        { duration: S.dur(duration), easing: ease, delay: S.dur(i * stagger) }
      ));
    });
    return Promise.all(anims.map((a) => a.finished.catch(() => {})));
  };

  /* ===================================================================== number roll
     Digits roll on vertical strips (odometer). S.roll(el, "1,284")            */
  S.roll = (el, value, { stagger = 28 } = {}) => {
    const text = String(value), chars = [...text];
    el.classList.add("roll");
    el.setAttribute("aria-label", text);
    const sig = chars.map((c) => (/\d/.test(c) ? "d" : c)).join("");
    if (el._rollSig !== sig) {
      el._rollSig = sig;
      el.innerHTML = chars.map((c) => /\d/.test(c)
        ? `<span class="roll-col" aria-hidden="true"><span class="roll-strip" style="--d:0">${"0123456789".split("").map((n) => `<span>${n}</span>`).join("")}</span></span>`
        : `<span class="roll-sym" aria-hidden="true">${S.esc(c)}</span>`).join("");
      el.offsetWidth; // commit the 0-state so the first roll animates
    }
    const strips = S.$$(".roll-strip", el);
    const digits = chars.filter((c) => /\d/.test(c));
    strips.forEach((strip, i) => {
      strip.style.transitionDelay = `${S.dur((strips.length - 1 - i) * stagger)}ms`; // ones place leads
      strip.style.setProperty("--d", digits[i]);
    });
  };

  /* ===================================================================== spotlight
     Any .btn, .spot or [data-spot] gets --mx/--my = pointer position inside it */
  document.addEventListener("pointermove", (e) => {
    const el = e.target.closest?.(".btn, .spot, [data-spot]");
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", `${e.clientX - r.left}px`);
    el.style.setProperty("--my", `${e.clientY - r.top}px`);
  }, { passive: true });

  /* ===================================================================== glide
     S.glide(container, { items, persist }) — a single hover highlight that
     travels between items. Returns { moveTo(el), hide() }.                    */
  S.glide = (container, { items = "[data-glide-item]", persist = false, className = "" } = {}) => {
    container.setAttribute("data-glide", "");
    const pill = document.createElement("span");
    pill.className = `glide-pill ${className}`.trim();
    pill.setAttribute("aria-hidden", "true");
    container.prepend(pill);
    let on = false, current = null;
    const moveTo = (el, { instant = false } = {}) => {
      if (!el) return;
      current = el;
      const c = container.getBoundingClientRect(), r = el.getBoundingClientRect();
      const x = r.left - c.left + container.scrollLeft, y = r.top - c.top + container.scrollTop;
      const place = () => { pill.style.transform = `translate(${x}px, ${y}px)`; pill.style.width = `${r.width}px`; pill.style.height = `${r.height}px`; };
      if (!on || instant) { pill.classList.add("no-move"); place(); pill.offsetWidth; pill.classList.remove("no-move"); }
      else place();
      pill.classList.add("is-on"); on = true;
    };
    const hide = () => { pill.classList.remove("is-on"); on = false; current = null; };
    container.addEventListener("pointerover", (e) => {
      if (e.pointerType === "touch") return;
      const it = e.target.closest(items);
      if (it && container.contains(it) && it !== current && !it.matches(":disabled,[aria-disabled=true]")) moveTo(it);
    });
    if (!persist) {
      container.addEventListener("pointerleave", hide);
      container.addEventListener("focusin", (e) => { const it = e.target.closest(items); if (it && e.target.matches(":focus-visible")) moveTo(it); });
      container.addEventListener("focusout", (e) => { if (!container.contains(e.relatedTarget)) hide(); });
    }
    return { moveTo, hide, pill, get current() { return current; } };
  };

  /* ===================================================================== segmented
     <div class="seg"><button class="seg-btn" data-value="a">…</button>…</div>
     The thumb springs to the chosen option. S.segmented(el, { value, onChange }) */
  S.segmented = (el, { value, onChange } = {}) => {
    if (!el) return;
    const thumb = document.createElement("span");
    thumb.className = "seg-thumb no-move"; thumb.setAttribute("aria-hidden", "true");
    el.prepend(thumb);
    const btns = S.$$(".seg-btn", el);
    if (!el.hasAttribute("role")) el.setAttribute("role", "group");
    const place = (btn) => {
      thumb.style.transform = `translateX(${btn.offsetLeft}px)`;
      thumb.style.width = `${btn.offsetWidth}px`;
    };
    const set = (v, { silent = false, instant = false } = {}) => {
      const btn = btns.find((b) => b.dataset.value === String(v)) || btns[0];
      btns.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      if (instant) thumb.classList.add("no-move");
      place(btn);
      if (instant) { thumb.offsetWidth; thumb.classList.remove("no-move"); }
      if (!silent) onChange?.(btn.dataset.value, btn);
    };
    btns.forEach((b) => b.addEventListener("click", () => set(b.dataset.value)));
    el.addEventListener("keydown", (e) => {
      const i = btns.indexOf(e.target);
      if (i < 0 || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
      e.preventDefault();
      const next = e.key === "Home" ? 0 : e.key === "End" ? btns.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + btns.length) % btns.length;
      btns[next].focus(); set(btns[next].dataset.value);
    });
    const init = () => { set(value ?? (btns.find((b) => b.getAttribute("aria-pressed") === "true") || btns[0]).dataset.value, { silent: true, instant: true }); };
    if (el.isConnected && el.offsetWidth) init(); else requestAnimationFrame(init);
    new ResizeObserver(() => { const a = btns.find((b) => b.getAttribute("aria-pressed") === "true"); if (a) { thumb.classList.add("no-move"); place(a); thumb.offsetWidth; thumb.classList.remove("no-move"); } }).observe(el);
    return { set, get value() { return btns.find((b) => b.getAttribute("aria-pressed") === "true")?.dataset.value; } };
  };

  /* ===================================================================== popover
     S.popover(trigger, panel) — toggles [data-open], closes on outside click /
     Escape, and sets transform-origin so the panel grows out of its trigger.  */
  S.popover = (trigger, panel, { onOpen, onClose } = {}) => {
    panel.inert = !panel.hasAttribute("data-open");
    const open = () => {
      panel.inert = false;
      panel.setAttribute("data-open", ""); trigger.setAttribute("aria-expanded", "true");
      const t = trigger.getBoundingClientRect(), p = panel.getBoundingClientRect();
      panel.style.setProperty("--pop-origin", `${S.clamp(t.left + t.width / 2 - p.left, 0, p.width)}px ${t.top < p.top ? "0" : "100%"}`);
      onOpen?.();
    };
    const close = () => { panel.removeAttribute("data-open"); panel.inert = true; trigger.setAttribute("aria-expanded", "false"); onClose?.(); };
    const isOpen = () => panel.hasAttribute("data-open");
    trigger.addEventListener("click", (e) => { e.stopPropagation(); isOpen() ? close() : open(); });
    document.addEventListener("pointerdown", (e) => { if (isOpen() && !panel.contains(e.target) && !trigger.contains(e.target)) close(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && isOpen()) { close(); trigger.focus(); } });
    document.addEventListener("schematic:navigate", close);
    return { open, close, isOpen };
  };

  S._loadSprings = loadSprings;
})();

</script>
  <script data-source="js/feedback.js">
/* =============================================================================
   SCHEMATIC — FEEDBACK: tooltips & toasts
   ============================================================================= */
(() => {
  const S = window.Schematic;

  /* ===================================================================== tooltip
     <button data-tip="Copy" data-tip-kbd="⌘C" data-tip-side="bottom">
     · first tooltip waits 450ms (intent), then the group is "warm":
       moving to a neighbour makes the SAME tooltip glide over — no re-fade.
     · hides on press, scroll and Escape.                                     */
  const initTooltip = () => {
    const tip = S.html(`<div class="tooltip" role="tooltip" id="schematic-tip"><div class="tooltip-inner"><span class="tip-text"></span></div></div>`);
    document.body.append(tip);
    const inner = tip.firstElementChild, text = S.$(".tip-text", tip);
    let current = null, describedTarget = null, showT, warmT, warm = false, visible = false;
    const detachDescription = () => {
      if (!describedTarget) return;
      const rest = (describedTarget.getAttribute("aria-describedby") || "").split(/\s+/).filter((id) => id && id !== tip.id);
      rest.length ? describedTarget.setAttribute("aria-describedby", rest.join(" ")) : describedTarget.removeAttribute("aria-describedby");
      describedTarget = null;
    };

    const position = (el) => {
      const r = el.getBoundingClientRect(), tr = inner.getBoundingClientRect();
      let side = el.dataset.tipSide || "top";
      const gap = 8;
      let x, y;
      if (side === "top" && r.top - tr.height - gap < 8) side = "bottom";
      if (side === "bottom" && r.bottom + tr.height + gap > innerHeight - 8) side = "top";
      if (side === "top" || side === "bottom") {
        x = r.left + r.width / 2 - tr.width / 2;
        y = side === "top" ? r.top - tr.height - gap : r.bottom + gap;
      } else {
        y = r.top + r.height / 2 - tr.height / 2;
        x = side === "right" ? r.right + gap : r.left - tr.width - gap;
      }
      x = S.clamp(x, 8, innerWidth - tr.width - 8);
      tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
      inner.style.setProperty("--tip-dy", side === "top" ? "3px" : side === "bottom" ? "-3px" : "0px");
      inner.style.setProperty("--tip-origin", { top: "bottom center", bottom: "top center", left: "center right", right: "center left" }[side]);
    };
    const fill = (el) => {
      const kbd = el.dataset.tipKbd;
      text.innerHTML = S.esc(el.dataset.tip) + (kbd ? ` <span class="kbd-group" style="margin-left:6px">${kbd.split(" ").map((k) => `<kbd class="kbd">${S.esc(k)}</kbd>`).join("")}</span>` : "");
    };
    const show = (el) => {
      clearTimeout(warmT);
      detachDescription();
      const glide = visible && warm;
      fill(el);
      if (glide) {
        tip.classList.add("is-gliding");
        text.classList.remove("is-swap"); text.offsetWidth; text.classList.add("is-swap");
      } else tip.classList.remove("is-gliding");
      position(el);
      tip.classList.add("is-on");
      visible = true; warm = true;
      const described = new Set((el.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean));
      described.add(tip.id); el.setAttribute("aria-describedby", [...described].join(" "));
      describedTarget = el;
    };
    const hide = () => {
      clearTimeout(showT);
      detachDescription();
      tip.classList.remove("is-on");
      visible = false; current = null;
      clearTimeout(warmT);
      warmT = setTimeout(() => (warm = false), 400);
    };

    document.addEventListener("pointerover", (e) => {
      if (e.pointerType === "touch") return;
      const t = e.target.closest?.("[data-tip]");
      if (t === current) return;
      if (!t) { if (current) hide(); return; }
      current = t;
      clearTimeout(showT);
      if (warm) show(t); else showT = setTimeout(() => current === t && show(t), 450);
    });
    document.addEventListener("focusin", (e) => { const t = e.target.closest?.("[data-tip]"); if (t && t.matches(":focus-visible")) { current = t; show(t); } });
    document.addEventListener("focusout", () => current && hide());
    document.addEventListener("pointerdown", () => current && hide(), true);
    document.addEventListener("scroll", () => current && hide(), true);
    document.addEventListener("keydown", (e) => e.key === "Escape" && current && hide());
    S.tooltipRefresh = () => current && visible && (fill(current), position(current));
  };

  /* ===================================================================== toasts
     S.toast({ title, desc, tone, icon, action:{label,onClick}, duration })
     Sonner-style stack: newest in front, older ones tuck behind. Hover to fan
     out, swipe right to dismiss, timers pause while you're reading.          */
  const initToaster = () => {
    const box = S.html(`<section class="toaster" aria-live="polite" aria-label="Notifications"></section>`);
    document.body.append(box);
    let toasts = [], expanded = false;
    const GAP = 10, PEEK = 10, MAX_VISIBLE = 3;
    const toneIcon = { success: "check-circle", danger: "x-circle", warning: "alert", info: "info", neutral: "bell" };

    const layout = () => {
      const live = toasts.filter((t) => !t.leaving);
      const frontH = live[0]?.h || 0;
      let offset = 0;
      live.forEach((t, i) => {
        const el = t.el;
        el.style.zIndex = String(100 - i);
        if (expanded) {
          el.style.transform = `translateY(${-offset}px)`;
          el.style.height = `${t.h}px`;
          el.style.opacity = i < 6 ? "1" : "0";
          el.classList.remove("is-behind");
          offset += t.h + GAP;
        } else {
          const s = 1 - i * 0.05;
          el.style.transform = `translateY(${-i * PEEK}px) scale(${s})`;
          el.style.height = `${i === 0 ? t.h : frontH}px`;
          el.style.opacity = i < MAX_VISIBLE ? "1" : "0";
          el.classList.toggle("is-behind", i > 0);
        }
        el.style.pointerEvents = i < (expanded ? 6 : MAX_VISIBLE) ? "auto" : "none";
        el.inert = expanded ? i >= 6 : i > 0;
      });
      box.style.height = expanded ? `${offset}px` : `${frontH}px`;
    };

    const dismiss = (t, dir = "down") => {
      if (t.leaving) return;
      t.leaving = true; clearTimeout(t.timer);
      const el = t.el;
      el.classList.add("is-leaving");
      const cur = el.style.transform || "";
      el.style.transform = dir === "right" ? `translateX(110%)` : `${cur} translateY(14px) scale(0.96)`;
      el.style.opacity = "0";
      layout();
      setTimeout(() => { el.remove(); toasts = toasts.filter((x) => x !== t); layout(); }, S.dur(240));
    };

    const arm = (t) => {
      clearTimeout(t.timer);
      if (t.duration === Infinity) return;
      t.started = Date.now();
      t.timer = setTimeout(() => dismiss(t), t.remaining);
    };
    const pause = (t) => { if (t.timer) { clearTimeout(t.timer); t.timer = null; t.remaining = Math.max(0, t.remaining - (Date.now() - t.started)); } };

    box.addEventListener("pointerenter", () => { expanded = true; toasts.forEach(pause); layout(); });
    box.addEventListener("pointerleave", () => { expanded = false; toasts.forEach((t) => !t.leaving && arm(t)); layout(); });
    box.addEventListener("focusin", () => { expanded = true; toasts.forEach(pause); layout(); });
    box.addEventListener("focusout", (e) => { if (!box.contains(e.relatedTarget)) { expanded = false; toasts.forEach((t) => !t.leaving && arm(t)); layout(); } });

    S.toast = (opts = {}) => {
      const o = typeof opts === "string" ? { title: opts } : opts;
      const tone = o.tone || "neutral";
      const el = S.html(`
        <div class="toast" role="status" data-tone="${tone}">
          <span class="toast-ic">${S.icon(o.icon || toneIcon[tone] || "bell")}</span>
          <div class="toast-body">
            <div class="toast-title">${S.esc(o.title || "")}</div>
            ${o.desc ? `<div class="toast-desc">${S.esc(o.desc)}</div>` : ""}
          </div>
          <div class="toast-actions">
            ${o.action ? `<button class="btn btn-secondary btn-sm" data-act>${S.esc(o.action.label)}</button>` : ""}
            <button class="btn btn-ghost btn-sm btn-icon" data-close aria-label="Dismiss">${S.icon("x")}</button>
          </div>
        </div>`);
      const t = { el, duration: o.duration ?? 4200, remaining: o.duration ?? 4200, h: 0 };
      box.append(el);
      t.h = el.offsetHeight;
      el.style.height = `${t.h}px`;
      // start below the fold, then spring into the stack
      el.style.transition = "none";
      el.style.transform = `translateY(calc(100% + 32px)) scale(0.98)`;
      el.style.opacity = "0";
      el.offsetWidth;
      el.style.transition = "";
      toasts.unshift(t);
      layout();
      requestAnimationFrame(() => S.playIcon(S.$(".toast-ic .ic", el)));
      if (!expanded) arm(t);

      el.querySelector("[data-close]").addEventListener("click", () => dismiss(t));
      el.querySelector("[data-act]")?.addEventListener("click", () => { o.action.onClick?.(); dismiss(t); });

      // swipe to dismiss
      let x0 = null, dx = 0, t0 = 0;
      el.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button")) return;
        x0 = e.clientX; dx = 0; t0 = performance.now();
        el.setPointerCapture(e.pointerId); el.classList.add("is-dragging");
      });
      el.addEventListener("pointermove", (e) => {
        if (x0 === null) return;
        dx = e.clientX - x0;
        const d = dx < 0 ? dx * 0.2 : dx; // resist leftwards
        el.style.transform = `translateX(${d}px)`;
        el.style.opacity = String(1 - S.clamp(dx / 260, 0, 0.6));
      });
      const end = () => {
        if (x0 === null) return;
        el.classList.remove("is-dragging");
        const v = dx / Math.max(1, performance.now() - t0);
        x0 = null;
        if (dx > 90 || v > 0.6) dismiss(t, "right"); else { el.style.opacity = "1"; layout(); }
      };
      el.addEventListener("pointerup", end);
      el.addEventListener("pointercancel", end);
      return { dismiss: () => dismiss(t) };
    };
  };

  S._initFeedback = () => { initTooltip(); initToaster(); };
})();

</script>
  <script data-source="js/shell.js">
/* =============================================================================
   SCHEMATIC — SHELL: page registry, router, view transitions, prerendering,
   on-this-page rail, command palette, theme + tuning, boot.
   ============================================================================= */
(() => {
  const S = window.Schematic;
  const root = document.documentElement;
  const pages = [];
  const state = { current: null, scroll: {}, built: new Map(), mounted: new Set() };
  S.pages = pages;

  /* ===================================================================== registry */
  /**
   * Register a page.
   * @param {{id:string,title:string,group:string,icon:string,order:number,
   *          description?:string,count?:string|number,
   *          render:()=>string, mount?:(root:HTMLElement)=>void,
   *          enter?:(root:HTMLElement)=>void, leave?:(root:HTMLElement)=>void}} def
   */
  S.page = (def) => { pages.push(def); pages.sort((a, b) => a.order - b.order); };

  /* ===================================================================== markup helpers
     Every page uses these so headers, sections and demos are identical.      */
  S.pageHead = ({ icon, eyebrow, title, lead, meta = [] }) => `
    <header class="page-head reveal">
      <div class="page-head-ic" style="--i:0">${S.icon(icon, { size: 22 })}</div>
      <div class="stack" style="--gap:var(--s-2);--i:1">
        ${eyebrow ? `<span class="t-eyebrow">${eyebrow}</span>` : ""}
        <h1 class="t-h1">${title}</h1>
      </div>
      ${lead ? `<p class="t-lead" style="--i:2">${lead}</p>` : ""}
      ${meta.length ? `<div class="page-meta" style="--i:3">${meta.join("")}</div>` : ""}
    </header>`;

  S.section = ({ id, num, title, desc, body, toc }) => `
    <section class="sec" id="${id}" data-toc="${S.esc(toc || title)}">
      <header class="sec-head">
        ${num ? `<span class="sec-num">${num}</span>` : ""}
        <h2 class="t-h2">${title}</h2>
        ${desc ? `<p>${desc}</p>` : ""}
      </header>
      ${body}
    </section>`;

  S.demo = ({ title, desc, body, specs = [], stage = "", cls = "", attrs = "", replay = false }) => `
    <article class="demo ${cls}" ${attrs}>
      ${replay ? `<button class="btn btn-ghost btn-sm btn-icon demo-replay" data-replay data-tip="Replay" aria-label="Replay ${S.esc(title)}">${S.icon("refresh")}</button>` : ""}
      <div class="demo-stage ${stage}">${body}</div>
      <footer class="demo-foot">
        <div><h3 class="demo-title">${title}</h3>${desc ? `<div class="demo-desc">${desc}</div>` : ""}</div>
        ${specs.length ? `<div class="demo-specs">${specs.map((s) => `<span class="spec">${S.esc(s)}</span>`).join("")}</div>` : ""}
      </footer>
    </article>`;

  /* ===================================================================== router */
  const host = () => S.$("#page-host");
  const viewport = () => S.$("#viewport");
  const byId = (id) => pages.find((p) => p.id === id);
  const routeFromHash = () => { const id = location.hash.match(/^#\/([\w-]+)/)?.[1]; return byId(id) ? id : pages[0]?.id; };

  /** Build (but don't show) a page's DOM. Called on intent and during idle. */
  S.prepare = (id) => {
    const p = byId(id);
    if (!p || state.built.has(id)) return state.built.get(id);
    const el = document.createElement("div");
    el.className = "page"; el.dataset.page = id; el.hidden = true;
    el.innerHTML = p.render();
    host().append(el);
    state.built.set(id, el);
    return el;
  };

  const swap = (id) => {
    document.dispatchEvent(new CustomEvent("schematic:navigate", { detail: { id } }));
    const prev = state.current && byId(state.current);
    const prevEl = state.current && state.built.get(state.current);
    if (prevEl) { state.scroll[state.current] = viewport().scrollTop; prev.leave?.(prevEl); prevEl.hidden = true; }
    const p = byId(id), el = S.prepare(id);
    el.hidden = false;
    document.documentElement.dataset.currentPage = id;
    if (!state.mounted.has(id)) { state.mounted.add(id); p.mount?.(el); }
    state.current = id;
    viewport().scrollTop = state.scroll[id] || 0;
    document.title = `${p.title} — Schematic`;
    S.$("#crumb-current").textContent = p.title;
    S.$("#crumb-group").textContent = p.group;
    updateNav(id);
    buildRail(el);
    return { p, el };
  };

  let navigating = null, navigationVersion = 0;
  S.navigate = async (id, { shared, focus = true } = {}) => {
    if (!byId(id)) return;
    const version = ++navigationVersion;
    if (navigating) {
      navigating.skipTransition();
      await navigating.updateCallbackDone.catch(() => {});
    }
    if (version !== navigationVersion || id === state.current) return;
    const focusContent = focus && !!document.activeElement?.closest("#page-host");
    const from = pages.findIndex((p) => p.id === state.current), to = pages.findIndex((p) => p.id === id);
    root.style.setProperty("--dir", to >= from ? "1" : "-1");
    if (location.hash !== `#/${id}`) history[state.current ? "pushState" : "replaceState"](null, "", `#/${id}`);
    closeMobileNav();

    const finish = ({ p, el }) => requestAnimationFrame(() => {
      if (state.current !== id) return;
      p.enter?.(el);
      if (focusContent) { const h = S.$("h1", el); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
    });
    if (!document.startViewTransition || S.reduced() || !state.current) {
      const r = swap(id);
      if (state.current && !document.startViewTransition && !S.reduced()) { r.el.classList.remove("page-enter"); r.el.offsetWidth; r.el.classList.add("page-enter"); }
      finish(r);
      return;
    }
    navigating?.skipTransition?.();
    if (shared) shared.style.viewTransitionName = "hero-ic";
    let result;
    const transition = document.startViewTransition(() => {
      if (shared) shared.style.viewTransitionName = "";
      result = swap(id);
      if (shared) { const target = S.$(".page-head-ic", result.el); if (target) target.style.viewTransitionName = "hero-ic"; }
    });
    navigating = transition;
    // ready rejects when a newer intent skips this animation; the DOM update
    // still completes. Treat that expected cancellation as a settled outcome.
    transition.ready.catch(() => {});
    transition.updateCallbackDone.then(() => finish(result)).catch((e) => console.error("Navigation failed", e));
    await transition.finished.catch(() => {});
      if (result) { const t = S.$(".page-head-ic", result.el); if (t) t.style.viewTransitionName = ""; }
      if (navigating === transition) navigating = null;
  };

  // Links: <a href="#/icons"> — intercepted so we control the transition.
  document.addEventListener("click", async (e) => {
    const a = e.target.closest?.('a[href^="#/"]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    const id = a.getAttribute("href").slice(2);
    await S.navigate(id, { shared: a.hasAttribute("data-shared") ? S.$(".shared-ic", a) : null, focus: !a.hasAttribute("data-specimen") });
    if (a.hasAttribute("data-specimen") && state.current === id) {
      const index = Number(a.dataset.specimen);
      const specimen = state.built.get(id)?.querySelectorAll(".demo")[index];
      if (specimen) {
        const vp = viewport();
        S.scrollTo(vp.scrollTop + specimen.getBoundingClientRect().top - vp.getBoundingClientRect().top - 32);
        const heading = specimen.querySelector(".demo-title");
        if (heading) { heading.tabIndex = -1; heading.focus({ preventScroll: true }); }
      }
    }
  });
  window.addEventListener("popstate", () => S.navigate(routeFromHash()));
  window.addEventListener("hashchange", () => { if (location.hash.startsWith("#/") && routeFromHash() !== state.current) S.navigate(routeFromHash()); });

  // Intent prerender: hovering, focusing or pressing a route link builds it.
  let intentT;
  const intent = (e) => {
    const a = e.target.closest?.('a[href^="#/"]');
    if (!a) return;
    clearTimeout(intentT);
    const id = a.getAttribute("href").slice(2);
    if (e.type === "pointerover") intentT = setTimeout(() => S.prepare(id), 60); else S.prepare(id);
  };
  document.addEventListener("pointerover", intent, { passive: true });
  document.addEventListener("focusin", intent);
  document.addEventListener("pointerdown", intent, { passive: true });

  /* ===================================================================== sidebar nav */
  const buildNav = () => {
    const nav = S.$("#nav");
    const groups = [...new Set(pages.map((p) => p.group))];
    nav.innerHTML = groups.map((g) => `
      <div class="nav-group">
        <div class="nav-label t-eyebrow">${g}</div>
        ${pages.filter((p) => p.group === g).map((p) => `
          <a class="nav-item" href="#/${p.id}" data-route="${p.id}" data-glide-item>
            ${S.icon(p.icon)}<span>${p.title}</span>${p.count != null ? `<span class="nav-count">${p.count}</span>` : ""}
          </a>`).join("")}
      </div>`).join("") + `<span class="nav-active" id="nav-active" aria-hidden="true"></span>`;
    S.glide(nav, { items: ".nav-item" });
  };
  let navPlaced = false;
  const updateNav = (id) => {
    S.$$(".nav-item").forEach((a) => (a.dataset.route === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    const a = S.$(`.nav-item[data-route="${id}"]`), m = S.$("#nav-active");
    if (!a || !m) return;
    if (!navPlaced) { m.style.transition = "none"; }
    m.style.transform = `translateY(${a.offsetTop}px)`;
    if (!navPlaced) { m.offsetWidth; m.style.transition = ""; navPlaced = true; }
  };

  const closeMobileNav = () => { root.removeAttribute("data-nav-open"); S.$("#menu-btn")?.setAttribute("aria-expanded", "false"); S.$(".sidebar")?.removeAttribute("data-keyboard-open"); };

  /* ===================================================================== on-this-page rail */
  let railObserver;
  const buildRail = (pageEl) => {
    const rail = S.$("#rail");
    railObserver?.disconnect();
    const secs = S.$$("section[data-toc]", pageEl);
    if (!secs.length) { rail.innerHTML = ""; return; }
    rail.innerHTML = `<div class="t-eyebrow">On this page</div><nav class="toc">${secs.map((s) => `<a href="#${s.id}" data-toc-link="${s.id}">${s.dataset.toc}</a>`).join("")}<span class="toc-marker"></span></nav>`;
    const links = S.$$("[data-toc-link]", rail), marker = S.$(".toc-marker", rail);
    const setActive = (id) => {
      const a = links.find((l) => l.dataset.tocLink === id); if (!a) return;
      links.forEach((l) => l.classList.toggle("is-active", l === a));
      marker.style.transform = `translateY(${a.offsetTop}px)`; marker.style.height = `${a.offsetHeight}px`;
    };
    links.forEach((l) => l.addEventListener("click", (e) => {
      e.preventDefault();
      const target = S.$(`#${CSS.escape(l.dataset.tocLink)}`, pageEl);
      const vp = viewport();
      S.scrollTo(vp.scrollTop + target.getBoundingClientRect().top - vp.getBoundingClientRect().top - 24);
      setActive(l.dataset.tocLink);
    }));
    const visible = new Map();
    railObserver = new IntersectionObserver((entries) => {
      entries.forEach((en) => visible.set(en.target.id, en.isIntersecting ? en.intersectionRatio : 0));
      const best = secs.find((s) => (visible.get(s.id) || 0) > 0);
      if (best) setActive(best.id);
    }, { root: viewport(), rootMargin: "-10% 0px -55% 0px", threshold: [0, 0.01, 0.5, 1] });
    secs.forEach((s) => railObserver.observe(s));
    requestAnimationFrame(() => setActive(secs[0].id));
  };

  /** Scroll the viewport with our own curve; distance-aware duration. */
  let scrollTween;
  S.scrollTo = (y) => {
    const vp = viewport(), from = vp.scrollTop, to = S.clamp(y, 0, vp.scrollHeight - vp.clientHeight);
    scrollTween?.cancel();
    const dist = Math.abs(to - from);
    scrollTween = S.tween({ from, to, duration: S.clamp(300 + dist * 0.25, 360, 900), ease: S.ease.inOut, onUpdate: (v) => (vp.scrollTop = v) });
  };

  S._shell = { buildNav, routeFromHash, swap, state, byId, closeMobileNav };
})();

</script>

    "Local files / simulated progress": "upload",
    "A continuous story": "wave",
    "Change the relationship": "chart-bar",
    "Keep your place": "trending",
    "A part of the whole": "pie",
    "Progress that resolves": "gauge",
    "Origin morph": "window",
    "Modal dialog": "window",
    "Destructive confirmation": "trash",
    "Side drawer": "sidebar",

    "Tooltip toolbar": "info",

    "Snippet": "code",
    "Spacing scale": "ruler",
    "Control rhythm": "grid",
  };
  /** Shared with specimen headings; every answer is an actual registry name. */
  S.specimenIcon = (title, page) => {
    const collection = typeof page === "string" ? S.pages.find((entry) => entry.id === page) : page;
    const icon = specimenIcons[title] || collection?.icon;
    return S.iconNames.includes(icon) ? icon : "cube";
  };
  let signature = "",
    entries = [];
  S.catalog = () => {
    const pages = S.pages.filter((page) => page.id !== "overview");
    const next = pages.map((page) => page.id).join("|");
    if (next === signature) return entries;
    signature = next;
    entries = pages.flatMap((page) => {
      const template = document.createElement("template");
      template.innerHTML = page.render();
      return [...template.content.querySelectorAll(".demo")].map(
        (demo, index) => {
          const title = demo.querySelector(".demo-title")?.textContent.trim() || page.title;
          return {
            id: `${page.id}-${index}`,
            page: page.id,
            collection: page.title,
            icon: S.specimenIcon(title, page),
            index,
            title,
            desc:
              demo.querySelector(".demo-desc")?.textContent.trim() ||
              page.description,
            section: demo.closest("section[id]")?.id || "",
            family: page.id === "workspace"
              ? "examples"
              : ["components", "forms", "navigation"].includes(page.id)
                ? "controls"
                : ["primitives", "motion", "icons"].includes(page.id)
                  ? "motion"
                  : page.id === "data"
                    ? "data"
                    : page.id === "overlays"
                      ? "feedback"
                      : "foundations",
          };
        },
      );
    });
    const order = [
      "workspace",
      "primitives",
      "navigation",
      "components",
      "forms",
      "data",
      "overlays",
      "motion",
      "icons",
      "foundations",
    ];
    entries.sort((a, b) => order.indexOf(a.page) - order.indexOf(b.page));
    return entries;
  };
})();
