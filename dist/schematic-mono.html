      ${demo("One action, a few alternatives", "The main button adds a chosen block to this demo. The menu changes what it adds.", `<div class="cp-split-wrap"><div class="cp-split"><button type="button" class="btn btn-primary" data-insert>${icon("plus")} <span data-insert-label>Add note</span></button><button type="button" class="btn btn-primary btn-icon" data-menu-trigger aria-label="Choose a block type" aria-haspopup="menu" aria-controls="cp-insert-menu" aria-expanded="false">${icon("chevron-down")}</button></div><div class="pop cp-menu" id="cp-insert-menu" role="menu" aria-label="Block type" inert>${[["note", "document", "Note", "A thought, captured"], ["task", "check-circle", "Task", "A next step"], ["link", "link", "Link", "A place to return to"]].map(([value, ic, label, sub]) => `<button type="button" role="menuitemradio" aria-checked="${value === "note"}" tabindex="-1" data-insert-choice="${value}">${icon(ic)}<span><strong>${label}</strong><small>${sub}</small></span><span class="cp-menu-check">${icon("check")}</span></button>`).join("")}</div></div><div class="cp-insert-tray" data-insert-tray aria-label="Inserted sample blocks"><span class="cp-empty-tray">Your next idea goes here.</span></div><button type="button" class="btn btn-ghost btn-sm" data-clear-tray>Clear blocks</button>${note("split", "Note selected. Add a note or open the menu for another block.")}`, ["arrows / home / end", "esc / dismiss"], "cp-menu-demo")}
      ${demo("A toolbar that travels with you", "Choose a tool to change the local preview. Hover or focus to reveal each tool’s name.", `<div class="cp-toolbar" data-toolbar role="toolbar" aria-label="Preview tools">${[["cursor", "Select"], ["pencil", "Draw"], ["chat", "Comment"], ["ruler", "Measure"]].map(([ic, label], i) => `<button type="button" class="btn btn-ghost btn-icon" data-tool="${label}" data-tip="${label}" data-tip-side="top" aria-label="${label} tool" aria-pressed="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${icon(ic, 18)}</button>`).join("")}</div><div class="cp-tool-preview" data-tool-preview data-mode="Select" aria-hidden="true"><div class="cp-tool-shape"><span class="cp-tool-mark">${icon("cursor", 20)}</span><span class="cp-tool-comment">Aa</span><span class="cp-tool-dimension">128 × 80</span></div></div>${note("tool", "Select tool. The shape’s selection boundary is visible.")}`, ["one gliding highlight"])}
    </div>` })}

    ${S.section({ id: "cp-settings", num: "04", title: "Settings", body: `<div class="grid cols-2">
      ${demo("Workspace preferences", "Switch, checkbox, mixed selection and radio controls retain their native keyboard behavior.", `<div class="cp-settings"><div class="cp-setting-line"><label class="cp-switch-label" for="cp-guides"><strong>Layout guides</strong><small>Show the construction grid.</small></label><label class="cp-switch"><input type="checkbox" role="switch" id="cp-guides" checked><span class="cp-switch-track" aria-hidden="true"><span></span></span><span class="cp-sr">Layout guides</span></label></div><fieldset class="cp-fieldset"><legend>Visible layers</legend><label class="cp-check cp-check-parent"><input type="checkbox" data-all-layers><span class="cp-check-box" aria-hidden="true">${icon("check", 12)}<span class="cp-mixed-line"></span></span><span>All layers <small data-layer-count>2 of 3 visible</small></span></label>${[["type", "Typography", true], ["shapes", "Shapes", true], ["notes", "Annotations", false]].map(([id, label, checked]) => `<label class="cp-check cp-layer-child"><input type="checkbox" data-layer="${id}" ${checked ? "checked" : ""}><span class="cp-check-box" aria-hidden="true">${icon("check", 12)}</span><span>${label}</span></label>`).join("")}</fieldset><fieldset class="cp-fieldset cp-radio-field"><legend>Preview canvas</legend>${[["paper", "Paper"], ["tinted", "Tinted"]].map(([value, label], i) => `<label class="cp-radio"><input type="radio" name="cp-canvas" value="${value}" ${i === 0 ? "checked" : ""}><span aria-hidden="true"></span>${label}</label>`).join("")}</fieldset></div><div class="cp-workspace-preview" data-workspace-preview data-guides="true" data-canvas="paper" aria-label="Workspace preview"><span class="cp-preview-note" data-preview-layer="notes">Leave room to breathe.</span><div data-preview-layer="type"><span class="t-eyebrow">FIELD NOTES / 001</span><h3>Make space<br>for the idea.</h3></div><div class="cp-preview-shapes" data-preview-layer="shapes" aria-hidden="true"><span></span><span></span><span></span></div></div>${note("settings", "Guides on. 2 of 3 layers visible. Paper canvas.")}`, ["native controls"], "cp-settings-demo")}
      ${demo("Segmented, connected", "Choose a density. The selection moves once; the sample list reorganizes around it.", `<div class="seg cp-density-seg" data-density role="group" aria-label="List density"><span class="seg-thumb" aria-hidden="true"></span>${["Compact", "Comfort", "Roomy"].map((label, i) => `<button type="button" class="seg-btn" data-density-value="${label}" aria-pressed="${i === 1}">${label}</button>`).join("")}</div><div class="cp-density-list" data-density-list data-density="Comfort">${[["document", "Getting started", "8 min read"], ["cube", "Component anatomy", "12 min read"], ["wave", "Motion principles", "6 min read"]].map(([ic, title, sub], i) => `<div class="cp-density-item"><span class="cp-density-num t-mono">0${i + 1}</span><span class="cp-density-ic">${icon(ic)}</span><span><strong>${title}</strong><small>${sub}</small></span><span class="cp-density-end" aria-hidden="true">${icon("check", 14)}</span></div>`).join("")}</div>${note("density", "Comfort density. Balanced spacing for everyday reading.")}`, ["selection / spring", "layout / FLIP"])}
    </div>` })}

    ${S.section({ id: "cp-collections", num: "05", title: "Tabs, chips and avatars", body: `<div class="stack">
      ${demo("Tabs with a sense of direction", "Left and right arrows choose a tab. Home and End jump to the edges. Tab moves into the selected panel.", `<div class="cp-tabs-shell"><div class="cp-tablist" role="tablist" aria-label="Component collection" data-tabs>${[["overview", "Overview", "grid"], ["anatomy", "Anatomy", "layers"], ["behavior", "Behavior", "cursor"]].map(([id, label, ic], i) => `<button type="button" role="tab" id="cp-tab-${id}" aria-controls="cp-panel-${id}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}" data-tab="${id}">${icon(ic)}${label}</button>`).join("")}<span class="cp-tab-underline" aria-hidden="true"></span></div><div class="cp-tab-panels"><div role="tabpanel" id="cp-panel-overview" aria-labelledby="cp-tab-overview" tabindex="0" data-panel="overview"><div class="cp-tab-feature"><div class="cp-tab-drawing" aria-hidden="true"><span class="cp-drawing-button">${icon("plus")} Create something</span><span class="cp-drawing-caption t-mono">intent → action → feedback</span></div><div><span class="t-eyebrow">01 / The whole picture</span><h3>One familiar gesture.<br>A complete response.</h3><p>A control is more than its resting state. It has a focus, a press, a pending moment and a result.</p><span class="badge badge-accent">Made to be used</span></div></div></div><div role="tabpanel" id="cp-panel-anatomy" aria-labelledby="cp-tab-anatomy" tabindex="0" data-panel="anatomy" hidden><div class="cp-anatomy-grid">${[["01", "Container", "A surface defines the target and its emphasis."], ["02", "Label", "A verb explains what pressing will do."], ["03", "Icon", "A visual cue reinforces the label."], ["04", "Feedback", "A visible state confirms what happened."]].map(([n, label, text]) => `<div><span class="cp-anatomy-no t-mono">${n}</span><strong>${label}</strong><p>${text}</p></div>`).join("")}</div></div><div role="tabpanel" id="cp-panel-behavior" aria-labelledby="cp-tab-behavior" tabindex="0" data-panel="behavior" hidden><div class="cp-behavior-flow">${[["cursor", "Focus", "The next action is clear."], ["plus", "Press", "The target acknowledges input."], ["check-circle", "Resolve", "The outcome stays visible."]].map(([ic, label, text]) => `<div><span>${icon(ic, 22)}</span><strong>${label}</strong><p>${text}</p></div>`).join("")}</div><p class="cp-tab-access">Reduced motion keeps each state and its meaning, with no directional travel.</p></div></div></div>`, ["roving focus", "direction / out"])}
      <div class="grid cols-2">
        ${demo("Labels that make room", "Select a chip to include it. Remove one and its neighbors move into the space.", `<div class="cp-chip-list" data-chips role="group" aria-label="Collection labels">${tags.map((tag, i) => `<span class="cp-chip" data-chip="${tag}"><button type="button" data-chip-select aria-pressed="${i < 2}"><span class="cp-chip-dot" aria-hidden="true"></span>${tag}</button><button type="button" data-chip-remove aria-label="Remove ${tag}">${icon("x", 12)}</button></span>`).join("")}</div><div class="cp-chip-tools"><span class="t-caption" data-chip-count>2 labels selected</span><button type="button" class="btn btn-ghost btn-sm" data-reset-chips>${icon("refresh")} Restore labels</button></div>${note("chips", "Interface and Motion are selected.")}`, ["select / remove", "FLIP / snappy"])}
        ${demo("People, with presence", "Initials keep this demo entirely local. Choose a person to see their role and availability.", `<div class="cp-avatars" role="group" aria-label="Collection collaborators">${people.map((p, i) => `<button type="button" class="cp-avatar cp-avatar-${p.tone}" data-person="${i}" aria-label="${p.name}, ${p.status}" aria-pressed="${i === 0}" data-tip="${p.name} · ${p.status}"><span>${p.initials}</span><i class="cp-status-dot" aria-hidden="true"></i></button>`).join("")}</div><div class="cp-person-card" data-person-card><span class="cp-person-initials cp-avatar-success" data-person-initials>AL</span><div><strong data-person-name>Alex Lin</strong><span class="t-caption" data-person-role>Design systems</span></div><span class="cp-presence" data-person-status data-tone="success">Available</span></div><label class="cp-availability-label" for="cp-availability">Your availability</label><select id="cp-availability" class="cp-select" data-availability><option>Available</option><option>Focusing</option><option>Away</option></select>${note("people", "Alex Lin · Design systems · Available.")}`, ["status / text + colour"])}
      </div>
    </div>` })}
  </div>`;

  function mount(root) {
    const page = root.querySelector(".pg-components");
    const $ = (selector) => page.querySelector(selector);
    const $$ = (selector) => [...page.querySelectorAll(selector)];
    const state = { active: false, timers: new Set(), animations: new Set(), async: new Map(), archived: false, hold: null, holdFrame: 0, favourite: false, tab: 0, density: "Comfort", insert: "note", copyVersion: 0, copying: false, people: people.map((person) => ({ ...person })) };
    instances.set(root, state);
    const isVisible = () => state.active && !root.hidden && !document.hidden;
    const say = (key, message) => { $(`[data-note="${key}"]`).textContent = message; };
    const later = (fn, ms) => {
      const id = setTimeout(() => { state.timers.delete(id); if (isVisible()) fn(); }, ms);
      state.timers.add(id);
      return id;
    };
    const animate = (el, frames, duration = 320, easing = S.curve.out) => {
      if (!isVisible() || S.reduced() || !el.animate) return;
      const animation = el.animate(frames, { duration: S.dur(duration), easing });
      state.animations.add(animation);
      animation.finished.catch(() => {}).finally(() => { state.animations.delete(animation); });
      return animation;
    };
    const cancelAnimations = (el) => {
      el.getAnimations?.({ subtree: true }).forEach((a) => a.cancel());
    };
    const flip = (els, mutate) => {
      els.forEach(cancelAnimations);
      if (S.reduced() || !isVisible()) mutate();
      else S.flip(els, mutate, { duration: S.springDur.snappy });
    };

    $$('[data-variant]').forEach((button) => button.addEventListener("click", () => {
      say("variant", button.dataset.explanation);
      if (button.dataset.variant === "danger") {
        button.disabled = true;
        button.querySelector("span").textContent = "Sample removed";
        $("[data-undo-sample]").hidden = false;
        say("variant", "Sample removed from this demo. Undo restores it.");
      }
    }));
    $("[data-undo-sample]").addEventListener("click", () => {
      const button = $('[data-variant="danger"]');
      button.disabled = false;
      button.querySelector("span").textContent = "Remove sample";
      button.focus();
      $("[data-undo-sample]").hidden = true;
      say("variant", "Sample restored.");
    });

    const blockTotal = () => {
      const count = $("[data-composition]").children.length;
      $("[data-block-total]").textContent = `${count} of 8 blocks`;
      $$("[data-add-block]").forEach((b) => { b.disabled = count >= 8; });
    };
    $$("[data-add-block]").forEach((button) => button.addEventListener("click", () => {
      const composition = $("[data-composition]");
      if (composition.children.length >= 8) return;
      const block = document.createElement("span");
      block.className = "cp-block";
      block.dataset.size = button.dataset.addBlock;
      block.textContent = button.dataset.addBlock;
      flip([...composition.children], () => composition.append(block));
      animate(block, [{ opacity: 0, transform: "scale(.85)" }, { opacity: 1, transform: "none" }]);
      blockTotal();
      say("size", `${button.dataset.addBlock} block added. ${composition.children.length} of 8 blocks.`);
    }));
    $("[data-reset-blocks]").addEventListener("click", () => {
      flip([...$("[data-composition]").children], () => {
        $("[data-composition]").innerHTML = '<span class="cp-block" data-size="M">M</span><span class="cp-block" data-size="L">L</span><span class="cp-block" data-size="S">S</span>';
      });
      blockTotal();
      say("size", "Composition reset to three blocks.");
    });

    const asyncLabels = { save: ["document", "Save sample"], retry: ["refresh", "Test recovery"] };
    $$("[data-async]").forEach((button) => button.addEventListener("click", () => {
      const key = button.dataset.async;
      if (state.async.has(key) || !isVisible()) return;
      const recovering = button.dataset.result === "error";
      const shouldFail = key === "retry" && !recovering;
      state.async.set(key, button);
      button.setAttribute("aria-disabled", "true");
      button.setAttribute("aria-busy", "true");
      button.dataset.result = "pending";
      button.innerHTML = `${icon("loader")} ${recovering ? "Retrying…" : "Working…"}`;
      say("async", `${key === "save" ? "Save" : "Recovery"} simulation in progress.`);
      later(() => {
        state.async.delete(key);
        button.removeAttribute("aria-disabled");
        button.removeAttribute("aria-busy");
        button.dataset.result = shouldFail ? "error" : "success";
        button.innerHTML = shouldFail ? `${icon("alert")} Retry sample` : `${icon("check")} ${key === "save" ? "Saved · run again" : "Recovered · test again"}`;
        say("async", shouldFail ? "Simulated failure. Your sample is safe. Retry sample will succeed." : `${key === "save" ? "Sample saved in this demo." : "Retry succeeded in this demo."} You can run it again.`);
        S.playIcon(button.querySelector(".ic"));
      }, 1050); // Simulated operation time, not animation time.
    }));

    $("[data-copy]").addEventListener("click", async () => {
      if (state.copying || !isVisible()) return;
      const button = $("[data-copy]");
      const version = ++state.copyVersion;
      state.copying = true;
      button.setAttribute("aria-busy", "true");
      button.setAttribute("aria-disabled", "true");
      button.dataset.result = "pending";
      button.innerHTML = `${icon("loader")} Copying…`;
      let copied = false;
      try { copied = typeof S.copy === "function" && await S.copy(COPY_TEXT) === true; } catch { copied = false; }
      if (version !== state.copyVersion || !isVisible()) return;
      state.copying = false;
      button.removeAttribute("aria-busy");
      button.removeAttribute("aria-disabled");
      button.innerHTML = copied ? `${icon("check")} Copied · copy again` : `${icon("copy")} Try copy again`;
      button.dataset.result = copied ? "success" : "error";
      say("copy", copied ? "Copied to your clipboard." : "Clipboard unavailable or permission denied. Select and copy the sample text manually.");
    });

    const hold = $("[data-hold]");
    const progress = $("[data-hold-progress]");
    const setProgress = (value) => {
      hold.style.setProperty("--hold-progress", String(value / 100));
      progress.value = value;
    };
    const cancelHold = (message = "Hold cancelled. The folder is still active.") => {
      if (!state.hold) return;
      const pointer = state.hold.pointer;
      state.hold = null;
      cancelAnimationFrame(state.holdFrame);
      state.holdFrame = 0;
      hold.classList.remove("is-holding");
      setProgress(0);
      if (pointer !== undefined && hold.hasPointerCapture?.(pointer)) hold.releasePointerCapture(pointer);
      say("hold", message);
    };
    const completeHold = () => {
      if (!state.hold) return;
      const pointer = state.hold.pointer;
      state.hold = null;
      state.holdFrame = 0;
      state.archived = true;
      hold.classList.remove("is-holding");
      setProgress(100);
      hold.setAttribute("aria-disabled", "true");
      hold.classList.add("is-complete");
      $("[data-hold-label]").textContent = "Folder archived";
      $("[data-folder-state]").textContent = "Archived";
      $("[data-restore-folder]").hidden = false;
      if (pointer !== undefined && hold.hasPointerCapture?.(pointer)) hold.releasePointerCapture(pointer);
      say("hold", "Explorations archived in this demo. Restore folder reverses it.");
    };
    const startHold = (source) => {
      if (state.hold || state.archived || !isVisible()) return;
      state.hold = { started: performance.now(), ...source };
      hold.classList.add("is-holding");
      say("hold", "Keep holding. Release to cancel.");
      const tick = (now) => {
        if (!state.hold) return;
        if (!isVisible()) { cancelHold(); return; }
        const value = Math.min(100, (now - state.hold.started) / HOLD_MS * 100);
        setProgress(value);
        if (value >= 100) completeHold();
        else state.holdFrame = requestAnimationFrame(tick);
      };
      state.holdFrame = requestAnimationFrame(tick);
    };
    hold.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || event.isPrimary === false || state.archived) return;
      if (state.hold) return;
      hold.focus({ preventScroll: true });
      hold.setPointerCapture?.(event.pointerId);
      startHold({ pointer: event.pointerId });
    });
    hold.addEventListener("pointermove", (event) => {
      if (state.hold?.pointer !== event.pointerId) return;
      const rect = hold.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) cancelHold();
    });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach((type) => hold.addEventListener(type, (event) => {
      if (state.hold?.pointer === event.pointerId) cancelHold();
    }));
    hold.addEventListener("keydown", (event) => {
      if (event.key === "Escape") { cancelHold(); return; }
      if (![" ", "Enter"].includes(event.key)) return;
      event.preventDefault();
      if (!event.repeat) startHold({ key: event.key });
    });
    hold.addEventListener("keyup", (event) => {
      if (![" ", "Enter"].includes(event.key)) return;
      event.preventDefault();
      if (state.hold?.key === event.key) cancelHold();
    });
    hold.addEventListener("click", (event) => {
      event.preventDefault();
      if (!state.archived && !state.hold) say("hold", "Hold for 1.5 seconds with a pointer, Space or Enter to archive. A quick press does not confirm.");
    });
    hold.addEventListener("blur", () => cancelHold());
    $("[data-restore-folder]").addEventListener("click", () => {
      state.archived = false;
      hold.removeAttribute("aria-disabled");
      hold.classList.remove("is-complete");
      setProgress(0);
      $("[data-hold-label]").textContent = "Hold to archive";
      $("[data-folder-state]").textContent = "Active";
      hold.focus();
      $("[data-restore-folder]").hidden = true;
      say("hold", "Folder restored. A new confirmation still requires the full 1.5-second hold.");
    });

    $("[data-favourite]").addEventListener("click", () => {
      const button = $("[data-favourite]");
      state.favourite = !state.favourite;
      button.setAttribute("aria-pressed", String(state.favourite));
      $("[data-favourite-word]").textContent = state.favourite ? "Favourited" : "Favourite";
      const count = $("[data-favourite-count]");
      S.roll(count, state.favourite ? "129" : "128");
      say("favourite", state.favourite ? "129 favourites. Yours is included." : "128 favourites. Your favourite was removed.");
      const particles = $("[data-particles]");
      particles.replaceChildren();
      if (!state.favourite || S.reduced()) return;
      for (let i = 0; i < 9; i++) {
        const particle = document.createElement("span");
        particle.className = "cp-particle";
        particles.append(particle);
        const angle = Math.PI * 2 * i / 9;
        const radius = parseFloat(getComputedStyle(page).getPropertyValue("--s-12")) || 48;
        const animation = animate(particle, [{ transform: "translate(0, 0) scale(1)", opacity: 1 }, { transform: `translate(${Math.cos(angle) * radius}px, ${Math.sin(angle) * radius}px) scale(.2)`, opacity: 0 }], 650);
        animation?.finished.catch(() => {}).finally(() => particle.remove());
      }
    });

    const trigger = $("[data-menu-trigger]");
    const menu = $("#cp-insert-menu");
    const menuItems = [...menu.querySelectorAll('[role="menuitemradio"]')];
    const menuAPI = S.popover(trigger, menu, { onOpen: () => {
      menu.inert = false;
      (menuItems.find((item) => item.getAttribute("aria-checked") === "true") || menuItems[0]).focus();
    }, onClose: () => { menu.inert = true; } });
    trigger.addEventListener("keydown", (event) => {
      if (!["ArrowDown", "ArrowUp"].includes(event.key)) return;
      event.preventDefault();
      menuAPI.open();
      (event.key === "ArrowUp" ? menuItems.at(-1) : menuItems[0]).focus();
    });
    menu.addEventListener("keydown", (event) => {
      const index = menuItems.indexOf(document.activeElement);
      let next;
      if (event.key === "ArrowDown") next = (index + 1) % menuItems.length;
      if (event.key === "ArrowUp") next = (index - 1 + menuItems.length) % menuItems.length;
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = menuItems.length - 1;
      if (next !== undefined) { event.preventDefault(); menuItems[next].focus(); }
      if (event.key === "Tab") {
        // Return to the trigger before the browser performs its normal Tab step.
        trigger.focus();
        menuAPI.close();
      }
    });
    menuItems.forEach((button) => button.addEventListener("click", () => {
      state.insert = button.dataset.insertChoice;
      menuItems.forEach((item) => item.setAttribute("aria-checked", String(item === button)));
      $("[data-insert-label]").textContent = `Add ${state.insert}`;
      menuAPI.close();
      trigger.focus();
      say("split", `${state.insert[0].toUpperCase() + state.insert.slice(1)} selected. The main button now adds this block.`);
    }));
    $("[data-insert]").addEventListener("click", () => {
      const tray = $("[data-insert-tray]");
      if (tray.querySelectorAll(".cp-inserted-block").length >= 4) { say("split", "Four sample blocks added. Clear blocks to start again."); return; }
      tray.querySelector(".cp-empty-tray")?.remove();
      const block = document.createElement("span");
      block.className = "cp-inserted-block";
      block.innerHTML = `${icon({ note: "document", task: "check-circle", link: "link" }[state.insert])} ${S.esc(state.insert)}`;
      tray.append(block);
      animate(block, [{ transform: "translateY(8px)", opacity: 0 }, { transform: "none", opacity: 1 }]);
      say("split", `${state.insert[0].toUpperCase() + state.insert.slice(1)} added. ${tray.children.length} of 4 blocks.`);
    });
    $("[data-clear-tray]").addEventListener("click", () => {
      $("[data-insert-tray]").innerHTML = '<span class="cp-empty-tray">Your next idea goes here.</span>';
      say("split", "Sample blocks cleared.");
    });

    const toolbar = $("[data-toolbar]");
    const glide = S.glide(toolbar, { items: "[data-tool]" });
    const toolButtons = $$("[data-tool]");
    const toolDescriptions = { Select: "The shape’s selection boundary is visible.", Draw: "A drawn path crosses the shape.", Comment: "An annotation appears on the shape.", Measure: "The shape’s dimensions are shown." };
    toolButtons.forEach((button) => button.addEventListener("click", () => {
      toolButtons.forEach((item) => { item.setAttribute("aria-pressed", String(item === button)); item.tabIndex = item === button ? 0 : -1; });
      const mode = button.dataset.tool;
      $("[data-tool-preview]").dataset.mode = mode;
      $(".cp-tool-mark").innerHTML = icon({ Select: "cursor", Draw: "pencil", Comment: "chat", Measure: "ruler" }[mode], 20);
      say("tool", `${mode} tool. ${toolDescriptions[mode]}`);
      glide.moveTo(button);
    }));
    const rove = (event, buttons, activate) => {
      const index = buttons.indexOf(document.activeElement);
      if (index < 0) return;
      let next;
      if (event.key === "ArrowRight") next = (index + 1) % buttons.length;
      if (event.key === "ArrowLeft") next = (index - 1 + buttons.length) % buttons.length;
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = buttons.length - 1;
      if (next === undefined) return;
      event.preventDefault();
      buttons[next].focus();
      if (activate) buttons[next].click();
      else buttons.forEach((button, i) => { button.tabIndex = i === next ? 0 : -1; });
    };
    toolbar.addEventListener("keydown", (event) => rove(event, toolButtons, false));

    const allLayers = $("[data-all-layers]");
    const layers = $$("[data-layer]");
    const updateSettings = () => {
      const count = layers.filter((input) => input.checked).length;
      allLayers.checked = count === layers.length;
      allLayers.indeterminate = count > 0 && count < layers.length;
      $("[data-layer-count]").textContent = `${count} of 3 visible`;
      layers.forEach((input) => { $(`[data-preview-layer="${input.dataset.layer}"]`).hidden = !input.checked; });
      const guides = $("#cp-guides").checked;
      const canvas = $('input[name="cp-canvas"]:checked').value;
      $("[data-workspace-preview]").dataset.guides = String(guides);
      $("[data-workspace-preview]").dataset.canvas = canvas;
      say("settings", `Guides ${guides ? "on" : "off"}. ${count} of 3 layers visible. ${canvas === "paper" ? "Paper" : "Tinted"} canvas.`);
    };
    allLayers.addEventListener("change", () => { layers.forEach((input) => { input.checked = allLayers.checked; }); updateSettings(); });
    [...layers, $("#cp-guides"), ...$$('input[name="cp-canvas"]')].forEach((input) => input.addEventListener("change", updateSettings));
    allLayers.indeterminate = true;
    $("[data-preview-layer=notes]").hidden = true;

    const densityButtons = $$("[data-density-value]");
    const densityThumb = $("[data-density] .seg-thumb");
    const tabButtons = $$("[data-tab]");
    const tabLine = $(".cp-tab-underline");
    const placeSelection = () => {
      if (!isVisible()) return;
      const tab = tabButtons[state.tab];
      tabLine.style.transform = `translateX(${tab.offsetLeft}px) scaleX(${tab.offsetWidth})`;
      const density = densityButtons.find((b) => b.dataset.densityValue === state.density);
      densityThumb.style.width = `${density.offsetWidth}px`;
      densityThumb.style.transform = `translateX(${density.offsetLeft}px)`;
    };
    densityButtons.forEach((button) => button.addEventListener("click", () => {
      state.density = button.dataset.densityValue;
      densityButtons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
      flip($$(".cp-density-item"), () => { $("[data-density-list]").dataset.density = state.density; });
      placeSelection();
      say("density", `${state.density} density. ${{ Compact: "More information in less space.", Comfort: "Balanced spacing for everyday reading.", Roomy: "Extra space for focused reading." }[state.density]}`);
    }));
    $("[data-density]").addEventListener("keydown", (event) => rove(event, densityButtons, true));
    tabButtons.forEach((button, index) => button.addEventListener("click", () => {
      if (state.tab === index) return;
      const direction = index > state.tab ? 1 : -1;
      state.tab = index;
      tabButtons.forEach((item, i) => { item.setAttribute("aria-selected", String(i === index)); item.tabIndex = i === index ? 0 : -1; });
      $$("[data-panel]").forEach((panel) => {
        cancelAnimations(panel);
        panel.hidden = panel.dataset.panel !== button.dataset.tab;
        if (!panel.hidden) {
          const distance = parseFloat(getComputedStyle(page).getPropertyValue("--s-3")) || 12;
          animate(panel, [{ opacity: 0, transform: `translateX(${direction * distance}px)` }, { opacity: 1, transform: "none" }], 320, S.curve.out);
        }
      });
      placeSelection();
    }));
    $("[data-tabs]").addEventListener("keydown", (event) => rove(event, tabButtons, true));

    const updateChips = () => {
      const selected = $$("[data-chip-select]").filter((button) => button.getAttribute("aria-pressed") === "true");
      $("[data-chip-count]").textContent = `${selected.length} label${selected.length === 1 ? "" : "s"} selected`;
      return selected.map((button) => button.closest("[data-chip]").dataset.chip);
    };
    $("[data-chips]").addEventListener("click", (event) => {
      const select = event.target.closest("[data-chip-select]");
      const remove = event.target.closest("[data-chip-remove]");
      if (select) {
        select.setAttribute("aria-pressed", String(select.getAttribute("aria-pressed") !== "true"));
        const selected = updateChips();
        say("chips", selected.length ? `Selected: ${selected.join(", ")}.` : "No labels selected.");
      }
      if (remove) {
        const chip = remove.closest("[data-chip]");
        const next = chip.nextElementSibling?.querySelector("[data-chip-select]") || chip.previousElementSibling?.querySelector("[data-chip-select]") || $("[data-reset-chips]");
        const name = chip.dataset.chip;
        flip($$("[data-chip]"), () => chip.remove());
        next.focus();
        updateChips();
        say("chips", `${name} removed. Restore labels brings all five back.`);
      }
    });
    $("[data-reset-chips]").addEventListener("click", () => {
      const list = $("[data-chips]");
      flip($$("[data-chip]"), () => {
        // Reuse existing nodes so surviving labels have real FLIP positions.
        tags.forEach((tag, i) => {
          let chip = [...list.children].find((el) => el.dataset.chip === tag);
          if (!chip) {
            chip = document.createElement("span");
            chip.className = "cp-chip";
            chip.dataset.chip = tag;
            chip.innerHTML = `<button type="button" data-chip-select aria-pressed="false"><span class="cp-chip-dot" aria-hidden="true"></span>${S.esc(tag)}</button><button type="button" data-chip-remove aria-label="Remove ${S.esc(tag)}">${icon("x", 12)}</button>`;
          }
          chip.querySelector("[data-chip-select]").setAttribute("aria-pressed", String(i < 2));
          list.append(chip);
        });
      });
      updateChips();
      say("chips", "All five labels restored. Interface and Motion selected.");
    });

    const showPerson = (index) => {
      const person = state.people[index];
      $("[data-person-initials]").textContent = person.initials;
      $("[data-person-initials]").className = `cp-person-initials cp-avatar-${person.tone}`;
      $("[data-person-name]").textContent = person.name;
      $("[data-person-role]").textContent = person.role;
      $("[data-person-status]").textContent = person.status;
      $("[data-person-status]").dataset.tone = person.tone;
      $$("[data-person]").forEach((button) => button.setAttribute("aria-pressed", String(Number(button.dataset.person) === index)));
      say("people", `${person.name} · ${person.role} · ${person.status}.`);
      animate($("[data-person-card]"), [{ opacity: .45 }, { opacity: 1 }], 220);
    };
    $$("[data-person]").forEach((button) => button.addEventListener("click", () => showPerson(Number(button.dataset.person))));
    $("[data-availability]").addEventListener("change", (event) => {
      // Alex represents the current visitor; this state belongs to this mount.
      const self = state.people[0];
      self.status = event.target.value;
      self.tone = { Available: "success", Focusing: "warning", Away: "neutral" }[self.status];
      const button = $('[data-person="0"]');
      button.className = `cp-avatar cp-avatar-${self.tone}`;
      button.setAttribute("aria-label", `${self.name}, ${self.status}`);
      button.dataset.tip = `${self.name} · ${self.status}`;
      showPerson(0);
      say("people", `Your availability is now ${self.status.toLowerCase()}.`);
    });

    const observer = new ResizeObserver(placeSelection);
    state.resume = () => {
      if (!state.active || document.hidden || root.hidden) return;
      page.classList.remove("cp-paused");
      observer.observe($("[data-tabs]"));
      observer.observe($("[data-density]"));
      placeSelection();
    };
    state.stop = () => {
      page.classList.add("cp-paused");
      cancelHold("Hold cancelled because this page is no longer active.");
      observer.disconnect();
      state.timers.forEach(clearTimeout);
      state.timers.clear();
      state.animations.forEach((animation) => animation.cancel());
      state.animations.clear();
      cancelAnimations(page);
      $("[data-particles]").replaceChildren();
      state.async.forEach((button, key) => {
        button.removeAttribute("aria-busy");
        button.removeAttribute("aria-disabled");
        delete button.dataset.result;
        button.innerHTML = `${icon(asyncLabels[key][0])} ${asyncLabels[key][1]}`;
      });
      if (state.async.size) say("async", "Pending simulations cancelled when the page became inactive. Ready to run again.");
      state.async.clear();
      if (state.copying) {
        ++state.copyVersion;
        state.copying = false;
        $("[data-copy]").removeAttribute("aria-busy");
        $("[data-copy]").removeAttribute("aria-disabled");
        delete $("[data-copy]").dataset.result;
        $("[data-copy]").innerHTML = `${icon("copy")} Copy text`;
        say("copy", "Clipboard confirmation interrupted. Copy again to verify the result.");
      }
      menuAPI.close();
      glide.hide();
    };
    document.addEventListener("visibilitychange", () => { if (document.hidden) state.stop(); else if (state.active) state.resume(); });
    window.addEventListener("blur", () => cancelHold("Hold cancelled because the window lost focus."));
  }

  S.page({
    id: "components", title: "Components", group: "Build", icon: "cube", order: 40,
    description: "Buttons, settings, tabs and small interactions with a complete response.",
    render, mount,
    enter(root) { const state = instances.get(root); if (state) { state.active = true; state.resume(); } },
    leave(root) { const state = instances.get(root); if (state) { state.active = false; state.stop(); } },
  });
})();

</script>
  <script data-source="pages/primitives.js">
(() => {
  "use strict";
  const S = window.Schematic;
  const instances = new WeakMap();
  const icon = (name, size = 18) => S.icon(name, { size });
  const check = () => S.icon("check", { size: 20, cls: "pr-check" });
  const pin = () => icon("pin", 16);
  const arrow = (up) => icon(up ? "arrow-up" : "arrow-down", 16);
  const grip = title => `<button type="button" class="btn btn-ghost btn-icon btn-sm pr-grip" data-pr-grip aria-label="Reorder ${title}">${icon("grip", 16)}</button>`;
  const note = (key, text) =>
    `<p class="pr-note" data-pr-status="${key}" role="status" aria-live="polite" aria-atomic="true">${text}</p>`;
  const demo = (key, title, desc, body, specs) =>
    S.demo({
      title,
      desc,
      body,
      specs,
      stage: "is-col is-plain",
      attrs: `data-pr-specimen="${key}"`,
    });
  const documents = [
    ["brief", "Release brief", "Project requirements", "document"],
    ["tokens", "Token inventory", "CSS variables", "palette"],
    ["motion", "Motion studies", "Timing & transitions", "wave"],
    ["review", "Review notes", "Review checklist", "pencil"],
  ];
  const tasks = [
    ["audit", "Interface audit", "Find the gaps"],
    ["structure", "Layout & rhythm", "Spacing and alignment"],
    ["motion", "Motion review", "Transitions and focus"],
    ["handoff", "Final handoff", "Release documentation"],
  ];
  const phrases = ["Queued", "Running", "Complete"];
  const pinRow = ([id, title, desc, ic], pinned = false) =>
    `<li class="pr-list-row" data-pr-pin-row="${id}" data-pr-pinned="${pinned}">${grip(title)}<span class="pr-row-icon">${icon(ic)}</span><span class="pr-row-copy"><strong>${title}</strong><small>${desc}</small></span><button type="button" class="btn btn-ghost btn-icon pr-pin-button" data-pr-pin="${id}" aria-pressed="${pinned}" aria-label="${pinned ? "Unpin" : "Pin"} ${title}">${pin()}</button></li>`;
  const sortRow = ([id, title, desc], index) =>
    `<li class="pr-list-row" data-pr-sort-row="${id}">${grip(title)}<span class="pr-position" data-pr-position aria-hidden="true">0${index + 1}</span><span class="pr-row-copy"><strong>${title}</strong><small>${desc}</small></span><span class="pr-move-controls"><button type="button" class="btn btn-ghost btn-icon btn-sm" data-pr-move="up" aria-label="Move ${title} up" ${index === 0 ? "disabled" : ""}>${arrow(true)}</button><button type="button" class="btn btn-ghost btn-icon btn-sm" data-pr-move="down" aria-label="Move ${title} down" ${index === tasks.length - 1 ? "disabled" : ""}>${arrow(false)}</button></span></li>`;
  const digits = () =>
    [..."128"]
      .map(
        (n) =>
          `<span class="pr-digit"><span class="pr-digit-strip" data-pr-digit style="--pr-digit:${n}">${[..."0123456789"].map((d) => `<span>${d}</span>`).join("")}</span></span>`,
      )
      .join("");

  const render = () => `<div class="pg-primitives" data-pr-motion="off">
    ${S.pageHead({ icon: "layers", eyebrow: "Build / The moving parts", title: "Primitives", lead: "Disclosure, lists, text, counters and cards.", meta: [] })}

    ${S.section({
      id: "pr-disclosure",
      num: "01",
      title: "Disclosure",
      body: `<div class="grid cols-2 pr-disclosure-grid">
      ${demo(
        "accordion",
        "Accordion",
        "Open one panel at a time. Up/Down, Home and End move focus.",
        `<div class="pr-accordion" data-pr-accordion><div class="pr-label-line"><span class="t-eyebrow">Help</span><span class="pr-mini-meta">03 topics</span></div>${[
          [
            "Installation",
            "Download the HTML file and open it locally. No server is required.",
            "Offline HTML",
          ],
          [
            "Motion settings",
            "Open Tune tokens to select Full, Slow-mo or Reduced. System reduced motion also applies.",
            "Full / Slow-mo / Reduced",
          ],
          [
            "Source files",
            "Tokens are in prototype/css/tokens.css. Examples are in prototype/pages/.",
            "HTML / CSS / JavaScript",
          ],
        ]
          .map(
            ([title, desc, tag], i) =>
              `<div class="pr-accordion-item" data-pr-accordion-item data-pr-open="${i === 0}"><h3><button type="button" class="pr-accordion-trigger" id="pr-accordion-trigger-${i}" data-pr-accordion-trigger="${i}" aria-expanded="${i === 0}" aria-controls="pr-accordion-panel-${i}"><span class="pr-ordinal" aria-hidden="true">0${i + 1}</span><span>${title}</span><span class="pr-disclosure-mark" aria-hidden="true">${icon("plus", 16)}</span></button></h3><div class="pr-grid-reveal" id="pr-accordion-panel-${i}" data-pr-accordion-panel role="region" aria-labelledby="pr-accordion-trigger-${i}" aria-hidden="${i !== 0}" ${i !== 0 ? "inert" : ""}><div class="pr-grid-clip"><div class="pr-accordion-copy"><p>${desc}</p><span class="pr-inline-label">${tag}</span></div></div></div></div>`,
          )
          .join(
            "",
          )}</div>${note("accordion", "Installation is open.")}`,
        ["single / reversible", "grid height"],
      )}
      ${demo("collapsible", "Collapsible", "Expand the checklist and add review notes.", `<div class="pr-packet" data-pr-collapsible data-pr-open="false"><div class="pr-label-line"><span class="t-eyebrow">Release packet</span><span class="badge badge-accent">Ready</span></div><h3 class="pr-card-title">Release checklist</h3><dl class="pr-facts"><div><dt>Owner</dt><dd>Interface team</dd></div><div><dt>Scope</dt><dd>8 primitives</dd></div></dl><button type="button" class="pr-inline-trigger" data-pr-collapse aria-expanded="false" aria-controls="pr-checklist-panel"><span data-pr-collapse-label>Show checklist</span>${icon("chevron-down", 16)}</button><div class="pr-measured-panel" id="pr-checklist-panel" data-pr-collapse-panel aria-hidden="true" inert><div class="pr-panel-inset"><ul class="pr-checklist"><li>${check()}<span>Four appearances checked</span></li><li>${check()}<span>Keyboard paths reviewed</span></li><li>${check()}<span>Motion can change its mind</span></li></ul><button type="button" class="btn btn-ghost btn-sm pr-notes-button" data-pr-detail-toggle aria-expanded="false" aria-controls="pr-review-notes">Include review notes ${icon("plus", 14)}</button><div class="pr-review-notes" id="pr-review-notes" data-pr-detail-notes hidden><span class="t-eyebrow">Review notes</span><p>Check keyboard focus, reduced motion and layout before publishing.</p></div></div></div></div>${note("collapsible", "Checklist collapsed. Review notes are optional.")}`, ["measured height", "variable content"])}
    </div>`,
    })}

    ${S.section({
      id: "pr-layout",
      num: "02",
      title: "Lists",
      body: `<div class="grid cols-2 pr-layout-grid">
      ${demo(
        "pinned-list",
        "Pinned list",
        "Drag files between groups, or use the pin button.",
        `<div class="pr-pin-board" data-pr-pinned-list><div class="pr-list-label"><span>${pin()} Pinned</span><span class="pr-mini-meta" data-pr-pin-count>01</span></div><ul class="pr-document-list" data-pr-pin-zone="pinned" aria-label="Pinned documents">${pinRow(documents[0], true)}</ul><div class="pr-list-label pr-list-label-secondary"><span>All other documents</span><span class="pr-mini-meta" data-pr-unpin-count>03</span></div><ul class="pr-document-list" data-pr-pin-zone="unpinned" aria-label="Unpinned documents">${documents
          .slice(1)
          .map((d) => pinRow(d))
          .join(
            "",
          )}</ul></div>${note("pinned-list", "1 pinned document. Pin another to keep it at the top.")}`,
        ["real DOM movement", "FLIP / 460ms"],
      )}
      ${demo("sortable-list", "Sortable list", "Drag a handle or use the arrow buttons.", `<div class="pr-sort-board" data-pr-sortable-list><div class="pr-label-line"><span class="t-eyebrow">Tasks</span><span class="pr-mini-meta">04 steps</span></div><ol class="pr-task-list" data-pr-sort-list aria-label="Project plan">${tasks.map(sortRow).join("")}</ol><div class="pr-list-bottom"><span class="pr-mini-meta">Your order, kept locally on this page.</span><button type="button" class="btn btn-ghost btn-sm" data-pr-sort-reset>${icon("refresh", 14)} Reset</button></div></div>${note("sortable-list", "Interface audit is first. Use each row’s up and down buttons to reorder.")}`, ["keyboard controls", "FLIP / 460ms"])}
    </div>`,
    })}

    ${S.section({
      id: "pr-type",
      num: "03",
      title: "Text and numbers",
      body: `<div class="grid cols-2 pr-type-grid">
      ${demo("text-swap", "Text swap", "Switch between build states.", `<div class="pr-text-card" data-pr-text-swap><span class="t-eyebrow">Build status</span><p class="pr-text-sentence" data-pr-whole-text><span class="pr-sr" data-pr-swap-accessible>Status: Queued</span><span class="pr-text-prefix" aria-hidden="true">Status:</span><span class="pr-word-window" data-pr-word-window aria-hidden="true"><span class="pr-word" data-pr-word-value="0">Queued</span></span></p><div class="pr-text-rule" aria-hidden="true"><span></span><span></span><span></span></div><div class="pr-message-options" role="group" aria-label="Choose a message">${["Queued", "Running", "Complete"].map((label, i) => `<button type="button" class="pr-message-option" data-pr-swap="${i}" aria-pressed="${i === 0}"><span class="pr-option-dot" aria-hidden="true"></span>${label}</button>`).join("")}</div></div>${note("text-swap", "Status: Queued Queued selected.")}`, ["directional / 460ms", "no autoplay"])}
      ${demo("counter", "Animated counter", "Increase, decrease or reset the count.", `<div class="pr-counter-card" data-pr-counter-card><div class="pr-label-line"><span class="t-eyebrow">Your local tally</span><span class="pr-mini-meta">000–999</span></div><output class="pr-counter" data-pr-counter data-value="128"><span class="pr-sr" data-pr-counter-accessible>128 items</span><span class="pr-digits" aria-hidden="true">${digits()}</span><span class="pr-counter-unit" aria-hidden="true">items</span></output><div class="pr-counter-controls"><button type="button" class="btn btn-secondary btn-icon" data-pr-count="-1" aria-label="Decrease count by one">${icon("minus")}</button><button type="button" class="btn btn-primary" data-pr-count="1">${icon("plus", 16)} Add one</button><button type="button" class="btn btn-ghost btn-sm" data-pr-counter-reset>${icon("refresh", 14)} Reset</button></div><p class="pr-counter-hint">Try the carry from 129 to 130.</p></div>${note("counter", "128 items. This sample tally stays on this page.")}`, ["stable digit columns", "reversible roll"])}
    </div>`,
    })}

    ${S.section({
      id: "pr-surfaces",
      num: "04",
      title: "Cards",
      body: `<div class="grid cols-2 pr-surfaces-grid">
      ${demo("flip-card", "Flip card", "Flip the card to view its details.", `<div class="pr-flip-specimen"><div class="pr-flip-card" data-pr-flip-card data-pr-flipped="false"><div class="pr-flip-rotor"><div class="pr-flip-face pr-flip-front" data-pr-face="front" aria-hidden="false"><div class="pr-label-line"><span class="t-eyebrow">Release / 0.3</span>${icon("layers", 20)}</div><div class="pr-flip-art" aria-hidden="true"><span></span><span></span><span></span></div><h3>Release notes</h3><p>Updates for version 0.3.</p><button type="button" class="pr-face-action" data-pr-flip-action="save" aria-pressed="false">${icon("plus", 16)}<span data-pr-save-label>Save to reading list</span></button></div><div class="pr-flip-face pr-flip-back" data-pr-face="back" aria-hidden="true" inert><div class="pr-label-line"><span class="t-eyebrow">Details</span><span class="pr-mini-meta">02 / 02</span></div><h3>Release details</h3><dl class="pr-flip-facts"><div><dt>Status</dt><dd>Draft</dd></div><div><dt>Owner</dt><dd>Design team</dd></div><div><dt>Updated</dt><dd>Today</dd></div></dl><button type="button" class="pr-face-action" data-pr-flip-action="review" aria-pressed="false">${check()}<span data-pr-flip-review-label>Mark as reviewed</span></button></div></div></div><button type="button" class="btn btn-secondary pr-flip-control" data-pr-flip aria-pressed="false">${icon("refresh", 16)}<span data-pr-flip-label>Show reverse</span></button></div>${note("flip-card", "Front of card. Not saved to the reading list.")}`, ["explicit control", "inert hidden face"])}
      ${demo("expandable-surface", "Expandable surface", "Expand project details and complete the review.", `<div class="pr-context-card" data-pr-expandable data-pr-open="false" data-pr-reviewed="false"><button type="button" class="pr-context-trigger" data-pr-expand aria-expanded="false" aria-controls="pr-context-panel"><span class="pr-project-mark" aria-hidden="true">fn.</span><span class="pr-context-heading"><span class="pr-mini-meta">Project / 008</span><strong>Field notes</strong><span class="pr-context-subtitle">Website release</span></span><span class="pr-context-arrow" aria-hidden="true">${icon("chevron-down", 18)}</span></button><div class="pr-context-summary"><span class="pr-review-state">${check()}<span data-pr-review-state>Ready for review</span></span><span class="pr-mini-meta">3 contributors</span></div><div class="pr-measured-panel" id="pr-context-panel" data-pr-expand-panel aria-hidden="true" inert><div class="pr-context-detail"><p>Review navigation changes before publishing.</p><dl class="pr-context-facts"><div><dt>Next milestone</dt><dd>Editorial handoff</dd></div><div><dt>What changed</dt><dd>Navigation and forms</dd></div><div><dt>Review window</dt><dd>Today, 14:00–16:00</dd></div></dl><button type="button" class="pr-review-button" data-pr-review aria-pressed="false"><span class="pr-review-check">${check()}</span><span data-pr-review-label>Mark review complete</span></button></div></div><div class="pr-context-bottom"><span data-pr-context-hint>Open to see the next step</span><span aria-hidden="true">${icon("arrow-up-right", 14)}</span></div></div>${note("expandable-surface", "Project context closed. Review pending.")}`, ["measured expansion", "drawn confirmation"])}
    </div>`,
    })}
  </div>`;

  const $ = (state, selector) => state.root.querySelector(selector);
  const $$ = (state, selector) => [...state.root.querySelectorAll(selector)];
  const announce = (state, key, text) => {
    $(state, `[data-pr-status="${key}"]`).textContent = text;
  };
  const canMove = (state) => state.active && !document.hidden && !S.reduced();
  const cancel = (state, el) => {
    state.animations.get(el)?.cancel();
    state.animations.delete(el);
  };
  const animate = (
    state,
    el,
    frames,
    duration = 460,
    easing = S.curve.inOut,
    done,
  ) => {
    cancel(state, el);
    if (!canMove(state)) {
      done?.();
      return;
    }
    const animation = el.animate(frames, { duration: S.dur(duration), easing });
    state.animations.set(el, animation);
    animation.finished.then(
      () => {
        if (state.animations.get(el) !== animation) return;
        state.animations.delete(el);
        animation.cancel();
        done?.();
      },
      () => {},
    );
  };

  // Read the displayed height before cancellation: reversing never starts from
  // an obsolete endpoint. The natural height returns once the new state settles.
  const resizePanel = (state, panel, open, mutate = () => {}) => {
    const before = panel.getBoundingClientRect().height;
    cancel(state, panel);
    mutate();
    panel.inert = !open;
    panel.setAttribute("aria-hidden", String(!open));
    panel.dataset.prOpen = String(open);
    panel.style.height = open ? "auto" : "0px";
    const after = panel.getBoundingClientRect().height;
    if (Math.abs(before - after) < 0.5 || !canMove(state)) return;
    panel.style.height = `${after}px`;
    animate(
      state,
      panel,
      [{ height: `${before}px` }, { height: `${after}px` }],
      460,
      S.curve.out,
      () => {
        panel.style.height = panel.dataset.prOpen === "true" ? "auto" : "0px";
      },
    );
  };

  const accordion = (state, index) => {
    state.accordion = state.accordion === index ? -1 : index;
    $$(state, "[data-pr-accordion-item]").forEach((item, i) => {
      const open = i === state.accordion,
        trigger = item.querySelector("[data-pr-accordion-trigger]"),
        panel = item.querySelector("[data-pr-accordion-panel]");
      if (!open && panel.contains(document.activeElement))
        trigger.focus({ preventScroll: true });
      item.dataset.prOpen = String(open);
      trigger.setAttribute("aria-expanded", String(open));
      panel.inert = !open;
      panel.setAttribute("aria-hidden", String(!open));
    });
    const title =
      state.accordion < 0
        ? "All topics are closed."
        : `${$(state, `[data-pr-accordion-trigger="${state.accordion}"]`).children[1].textContent} is open.`;
    announce(state, "accordion", title);
  };

  const updatePinned = (state) => {
    state.pinned = new Set([...$(state, '[data-pr-pin-zone="pinned"]').children].map(row => row.dataset.prPinRow));
    $$(state, "[data-pr-pin-row]").forEach(row => {
      const pinned = state.pinned.has(row.dataset.prPinRow), button = row.querySelector("[data-pr-pin]");
      row.dataset.prPinned = String(pinned);
      button.setAttribute("aria-pressed", String(pinned));
      button.setAttribute("aria-label", `${pinned ? "Unpin" : "Pin"} ${row.querySelector("strong").textContent}`);
    });
    $(state, "[data-pr-pin-count]").textContent = String(state.pinned.size).padStart(2, "0");
    $(state, "[data-pr-unpin-count]").textContent = String(documents.length - state.pinned.size).padStart(2, "0");
  };
  const pinDocument = (state, button) => {
    state.pinSort.cancel();
    const id = button.dataset.prPin,
      row = button.closest("[data-pr-pin-row]"),
      isPinned = !state.pinned.has(id);
    const focused = document.activeElement === button;
    const zone = $(state, `[data-pr-pin-zone="${isPinned ? "pinned" : "unpinned"}"]`);
    const order = documents.findIndex(d => d[0] === id);
    const next = !isPinned && [...zone.children].find(el => documents.findIndex(d => d[0] === el.dataset.prPinRow) > order);
    state.pinSort.move(row, zone, next ? [...zone.children].indexOf(next) : zone.children.length);
    if (focused) button.focus({ preventScroll: true });
    announce(
      state,
      "pinned-list",
      `${row.querySelector("strong").textContent} ${isPinned ? "pinned" : "unpinned"}. ${state.pinned.size} pinned ${state.pinned.size === 1 ? "document" : "documents"}.`,
    );
  };
  const updateSort = (state) => {
    $$(state, "[data-pr-sort-row]").forEach((row, i, rows) => {
      row.querySelector("[data-pr-position]").textContent = String(
        i + 1,
      ).padStart(2, "0");
      row.querySelector('[data-pr-move="up"]').disabled = i === 0;
      row.querySelector('[data-pr-move="down"]').disabled =
        i === rows.length - 1;
    });
  };
  const sortTask = (state, button) => {
    state.taskSort.cancel();
    const row = button.closest("[data-pr-sort-row]"),
      up = button.dataset.prMove === "up",
      next = up ? row.previousElementSibling : row.nextElementSibling;
    if (!next) return;
    const focused = document.activeElement === button;
    state.taskSort.move(row, row.parentElement, [...row.parentElement.children].indexOf(row) + (up ? -1 : 1));
    if (focused)
      (button.disabled
        ? row.querySelector(`[data-pr-move="${up ? "down" : "up"}"]`)
        : button
      ).focus({ preventScroll: true });
    const position = [...row.parentElement.children].indexOf(row) + 1;
    announce(
      state,
      "sortable-list",
      `${row.querySelector("strong").textContent} moved to position ${position} of ${tasks.length}.`,
    );
  };

  const settleWords = (state) => {
    $$(state, "[data-pr-word-value]").forEach((el) => {
      if (Number(el.dataset.prWordValue) !== state.word) el.remove();
      else {
        el.style.opacity = "1";
        el.style.transform = "none";
      }
    });
  };
  const swapText = (state, index) => {
    if (index === state.word) return;
    const direction = index > state.word ? 1 : -1,
      window = $(state, "[data-pr-word-window]");
    const current = [...window.children];
    // Capture all visible layers first, so a rapid reversal continues from the
    // actual composite, including the word that was on its way out.
    const visible = new Map(
      current.map((el) => {
        const css = getComputedStyle(el);
        return [el, { opacity: css.opacity, transform: css.transform }];
      }),
    );
    current.forEach((el) => cancel(state, el));
    state.word = index;
    $$(state, "[data-pr-swap]").forEach((button) =>
      button.setAttribute(
        "aria-pressed",
        String(Number(button.dataset.prSwap) === index),
      ),
    );
    $(state, "[data-pr-swap-accessible]").textContent =
      `Status: ${phrases[index]}`;
    announce(
      state,
      "text-swap",
      `Status: ${phrases[index]} ${["Queued", "Running", "Complete"][index]} selected.`,
    );
    let target = current.find((el) => Number(el.dataset.prWordValue) === index);
    if (!target) {
      target = document.createElement("span");
      target.className = "pr-word";
      target.dataset.prWordValue = String(index);
      target.textContent = phrases[index];
      window.append(target);
      visible.set(target, {
        opacity: "0",
        transform: `translateY(${direction * 90}%)`,
      });
    }
    if (!canMove(state)) {
      settleWords(state);
      return;
    }
    [...window.children].forEach((el) => {
      const chosen = el === target,
        end = {
          opacity: chosen ? "1" : "0",
          transform: chosen
            ? "translateY(0%)"
            : `translateY(${direction * -90}%)`,
        };
      Object.assign(el.style, end);
      animate(state, el, [visible.get(el), end], 460, S.curve.inOut, () => {
        if (Number(el.dataset.prWordValue) !== state.word) el.remove();
      });
    });
  };

  const count = (state, value, reset = false) => {
    state.count = S.clamp(value, 0, 999);
    const digits = String(state.count).padStart(3, "0");
    $$(state, "[data-pr-digit]").forEach((strip, i) =>
      strip.style.setProperty("--pr-digit", digits[i]),
    );
    $(state, "[data-pr-counter]").dataset.value = String(state.count);
    $(state, "[data-pr-counter-accessible]").textContent =
      `${state.count} ${state.count === 1 ? "item" : "items"}`;
    $(state, '[data-pr-count="-1"]').disabled = state.count === 0;
    $(state, '[data-pr-count="1"]').disabled = state.count === 999;
    announce(
      state,
      "counter",
      `${state.count} ${state.count === 1 ? "item" : "items"}.${reset ? " Tally reset." : ""}`,
    );
  };
  const turnCard = (state) => {
    const button = $(state, "[data-pr-flip]"),
      oldFace = $(
        state,
        `[data-pr-face="${state.flipped ? "back" : "front"}"]`,
      );
    if (oldFace.contains(document.activeElement))
      button.focus({ preventScroll: true });
    state.flipped = !state.flipped;
    $(state, "[data-pr-flip-card]").dataset.prFlipped = String(state.flipped);
    button.setAttribute("aria-pressed", String(state.flipped));
    $(state, "[data-pr-flip-label]").textContent = state.flipped
      ? "Show front"
      : "Show reverse";
    $$(state, "[data-pr-face]").forEach((face) => {
      const hidden = (face.dataset.prFace === "back") !== state.flipped;
      face.inert = hidden;
      face.setAttribute("aria-hidden", String(hidden));
    });
    announce(
      state,
      "flip-card",
      state.flipped
        ? `Reverse of card. ${state.flipReviewed ? "Reviewed." : "Not reviewed yet."}`
        : `Front of card. ${state.saved ? "Saved to" : "Not saved to"} the reading list.`,
    );
  };
  const contextStatus = (state) =>
    announce(
      state,
      "expandable-surface",
      `Project context ${state.expanded ? "open" : "closed"}. Review ${state.reviewed ? "complete" : "pending"}.`,
    );

  const settle = (state) => {
    state.pinSort?.settle();
    state.taskSort?.settle();
    state.root.dataset.prMotion = "off";
    state.animations.forEach((animation) => animation.cancel());
    state.animations.clear();
    state.root
      .getAnimations({ subtree: true })
      .forEach((animation) => animation.cancel());
    $$(state, ".pr-measured-panel").forEach((panel) => {
      panel.style.height = panel.dataset.prOpen === "true" ? "auto" : "0px";
    });
    settleWords(state);
  };
  const syncMotion = (state) => {
    if (document.hidden) {
      state.pinSort?.cancel();
      state.taskSort?.cancel();
    }
    if (!canMove(state)) settle(state);
    else state.root.dataset.prMotion = "on";
  };

  const mount = (pageRoot) => {
    const state = {
      root: pageRoot.querySelector(".pg-primitives"),
      active: false,
      animations: new Map(),
      accordion: 0,
      pinned: new Set(["brief"]),
      word: 0,
      count: 128,
      flipped: false,
      saved: false,
      flipReviewed: false,
      expanded: false,
      reviewed: false,
      collapsed: true,
      notes: false,
    };
    instances.set(pageRoot, state);
    state.pinSort = S.sortable($(state, "[data-pr-pinned-list]"), {
      items: "[data-pr-pin-row]", handle: "[data-pr-grip]", groups: "[data-pr-pin-zone]",
      onChange: () => updatePinned(state),
      announce: text => announce(state, "pinned-list", text),
    });
    state.taskSort = S.sortable($(state, "[data-pr-sort-list]"), {
      items: "[data-pr-sort-row]", handle: "[data-pr-grip]",
      onChange: () => updateSort(state),
      announce: text => announce(state, "sortable-list", text),
    });
    state.pinSort.setEnabled(false);
    state.taskSort.setEnabled(false);
    state.root.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button || !state.root.contains(button) || button.disabled) return;
      if (button.matches("[data-pr-accordion-trigger]"))
        accordion(state, Number(button.dataset.prAccordionTrigger));
      else if (button.matches("[data-pr-collapse]")) {
        state.collapsed = !state.collapsed;
        const open = !state.collapsed,
          card = $(state, "[data-pr-collapsible]");
        if (
          !open &&
          $(state, "[data-pr-collapse-panel]").contains(document.activeElement)
        )
          button.focus({ preventScroll: true });
        card.dataset.prOpen = String(open);
        button.setAttribute("aria-expanded", String(open));
        $(state, "[data-pr-collapse-label]").textContent = open
          ? "Hide checklist"
          : "Show checklist";
        resizePanel(state, $(state, "[data-pr-collapse-panel]"), open);
        announce(
          state,
          "collapsible",
          `Checklist ${open ? "expanded" : "collapsed"}.${open ? " Three handoff checks complete." : ""}`,
        );
      } else if (button.matches("[data-pr-detail-toggle]")) {
        state.notes = !state.notes;
        button.setAttribute("aria-expanded", String(state.notes));
        resizePanel(state, $(state, "[data-pr-collapse-panel]"), true, () => {
          $(state, "[data-pr-detail-notes]").hidden = !state.notes;
          button.innerHTML = `${state.notes ? "Hide review notes" : "Include review notes"} ${icon(state.notes ? "minus" : "plus", 14)}`;
        });
        announce(
          state,
          "collapsible",
          `Checklist expanded. Review notes ${state.notes ? "included" : "hidden"}.`,
        );
      } else if (button.matches("[data-pr-pin]")) pinDocument(state, button);
      else if (button.matches("[data-pr-move]")) sortTask(state, button);
      else if (button.matches("[data-pr-sort-reset]")) {
        state.taskSort.mutate(() => {
          tasks.forEach(([id]) =>
            $(state, "[data-pr-sort-list]").append(
              $(state, `[data-pr-sort-row="${id}"]`),
            ),
          );
        });
        announce(
          state,
          "sortable-list",
          "Original order restored. Interface audit is first.",
        );
      } else if (button.matches("[data-pr-swap]"))
        swapText(state, Number(button.dataset.prSwap));
      else if (button.matches("[data-pr-count]"))
        count(state, state.count + Number(button.dataset.prCount));
      else if (button.matches("[data-pr-counter-reset]"))
        count(state, 128, true);
      else if (button.matches("[data-pr-flip]")) turnCard(state);
      else if (button.matches('[data-pr-flip-action="save"]')) {
        state.saved = !state.saved;
        button.setAttribute("aria-pressed", String(state.saved));
        $(state, "[data-pr-save-label]").textContent = state.saved
          ? "Saved to reading list"
          : "Save to reading list";
        announce(
          state,
          "flip-card",
          state.saved
            ? "Saved to the local reading list."
            : "Removed from the local reading list.",
        );
      } else if (button.matches('[data-pr-flip-action="review"]')) {
        state.flipReviewed = !state.flipReviewed;
        button.setAttribute("aria-pressed", String(state.flipReviewed));
        $(state, "[data-pr-flip-review-label]").textContent = state.flipReviewed
          ? "Reviewed"
          : "Mark as reviewed";
        announce(
          state,
          "flip-card",
          state.flipReviewed
            ? "Idea marked as reviewed."
            : "Idea review cleared.",
        );
      } else if (button.matches("[data-pr-expand]")) {
        state.expanded = !state.expanded;
        const panel = $(state, "[data-pr-expand-panel]");
        if (!state.expanded && panel.contains(document.activeElement))
          button.focus({ preventScroll: true });
        $(state, "[data-pr-expandable]").dataset.prOpen = String(
          state.expanded,
        );
        button.setAttribute("aria-expanded", String(state.expanded));
        resizePanel(state, panel, state.expanded);
        $(state, "[data-pr-context-hint]").textContent = state.expanded
          ? "All the context, in one place"
          : "Open to see the next step";
        contextStatus(state);
      } else if (button.matches("[data-pr-review]")) {
        state.reviewed = !state.reviewed;
        button.setAttribute("aria-pressed", String(state.reviewed));
        $(state, "[data-pr-expandable]").dataset.prReviewed = String(
          state.reviewed,
        );
        $(state, "[data-pr-review-label]").textContent = state.reviewed
          ? "Review complete · Undo"
          : "Mark review complete";
        $(state, "[data-pr-review-state]").textContent = state.reviewed
          ? "Reviewed"
          : "Ready for review";
        contextStatus(state);
      }
    });
    state.root.addEventListener("keydown", (event) => {
      const accordionButton = event.target.closest(
          "[data-pr-accordion-trigger]",
        ),
        swapButton = event.target.closest("[data-pr-swap]");
      const keys = accordionButton
        ? ["ArrowDown", "ArrowUp", "Home", "End"]
        : ["ArrowRight", "ArrowLeft", "Home", "End"];
      if ((!accordionButton && !swapButton) || !keys.includes(event.key))
        return;
      event.preventDefault();
      const buttons = $$(
        state,
        accordionButton ? "[data-pr-accordion-trigger]" : "[data-pr-swap]",
      );
      const current = buttons.indexOf(accordionButton || swapButton);
      const index =
        event.key === "Home"
          ? 0
          : event.key === "End"
            ? buttons.length - 1
            : (current +
                (["ArrowDown", "ArrowRight"].includes(event.key) ? 1 : -1) +
                buttons.length) %
              buttons.length;
      buttons[index].focus({ preventScroll: true });
      if (swapButton) swapText(state, index);
    });
    document.addEventListener("visibilitychange", () => syncMotion(state));
    const motionObserver = new MutationObserver(() => syncMotion(state));
    motionObserver.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-motion"],
    });
    matchMedia("(prefers-reduced-motion: reduce)").addEventListener(
      "change",
      () => syncMotion(state),
    );
    syncMotion(state);
  };

  S.page({
    id: "primitives",
    title: "Primitives",
    group: "Build",
    icon: "layers",
    order: 45,
    count: 8,
    description:
      "Eight animated building blocks for disclosure, layout, type and surfaces.",
    render,
    mount,
    enter(pageRoot) {
      const state = instances.get(pageRoot);
      if (state) {
        state.active = true;
        state.pinSort.setEnabled(true);
        state.taskSort.setEnabled(true);
        syncMotion(state);
      }
    },
    leave(pageRoot) {
      const state = instances.get(pageRoot);
      if (state) {
        state.active = false;
        state.pinSort.setEnabled(false);
        state.taskSort.setEnabled(false);
        settle(state);
      }
    },
  });
})();

            f === nameInput ? "[data-nv-name-error]" : "[data-nv-email-error]",
          ).textContent = "";
        }
      }),
    );
    const carousel = $("[data-nv-carousel]");
    const showSlide = (next, direction) => {
      next = (next + directions.length) % directions.length;
      const old = state.slide;
      if (next === old) return;
      state.slide = next;
      showPane(
        $("[data-nv-carousel-stack]"),
        next,
        direction ?? (next > old ? 1 : -1),
      );
      $$("[data-nv-slide]").forEach((b, i) =>
        b.setAttribute("aria-pressed", String(i === next)),
      );
      $("[data-nv-slide-count]").textContent = `0${next + 1} / 03`;
      say(
        "carousel",
        `Direction ${next + 1} of 3. ${directions[next].name}: ${directions[next].subtitle}`,
      );
    };
    carousel.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.hasAttribute("data-nv-slide")) showSlide(Number(b.dataset.nvSlide));
      else if (b.hasAttribute("data-nv-slide-prev"))
        showSlide(state.slide - 1, -1);
      else if (b.hasAttribute("data-nv-slide-next"))
        showSlide(state.slide + 1, 1);
      else if (b.hasAttribute("data-nv-use-direction"))
        say(
          "carousel",
          `${directions[state.slide].name} selected for your project. ${directions[state.slide].desc}`,
        );
    });
    carousel.addEventListener("keydown", (e) => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
      e.preventDefault();
      showSlide(
        e.key === "Home"
          ? 0
          : e.key === "End"
            ? 2
            : state.slide + (e.key === "ArrowRight" ? 1 : -1),
        e.key === "ArrowLeft" || e.key === "Home" ? -1 : 1,
      );
    });
    const positionMarkers = () => {
      if (!state.visible) return;
      moveMarker(
        $("[data-nv-dock-bar]"),
        $("[data-nv-dock-marker]"),
        dockButtons[state.dock],
        false,
      );
      const index = Math.max(0, state.menu);
      moveMarker(
        $("[data-nv-menu-bar]"),
        $("[data-nv-menu-marker]"),
        menuButtons[index],
        false,
      );
      const r = menu.getBoundingClientRect(),
        b = menuButtons[index].getBoundingClientRect();
      menuViewport.style.setProperty(
        "--nv-pointer",
        `${b.left + b.width / 2 - r.left}px`,
      );
    };
    const resize = new ResizeObserver(positionMarkers);
    const stop = () => {
      menuClose(false, false);
      comboToggle(false);
      root.getAnimations({ subtree: true }).forEach((a) => {
        try {
          a.finish();
        } catch {}
        a.cancel();
      });
      animations.forEach((a) => a.cancel());
      animations.clear();
      $$("[data-nv-pane]").forEach((el) => (el.style.visibility = ""));
    };
    const motionRoot = $(".pg-navigation") || root;
    const syncReduced = () => {
      motionRoot.dataset.nvReduced = String(S.reduced());
      if (S.reduced()) {
        root.getAnimations({ subtree: true }).forEach((a) => {
          try {
            a.finish();
          } catch {}
          a.cancel();
        });
        animations.clear();
        $$("[data-nv-pane]").forEach((el) => (el.style.visibility = ""));
      }
    };
    const motionChanges = new MutationObserver(syncReduced);
    const systemMotion = matchMedia("(prefers-reduced-motion: reduce)");
    systemMotion.addEventListener("change", () => {
      if (state.visible) syncReduced();
    });
    document.addEventListener("visibilitychange", () => {
      if (state.visible && document.hidden) stop();
    });
    instances.set(root, {
      enter() {
        state.visible = true;
        syncReduced();
        motionChanges.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-motion"],
        });
        resize.observe($("[data-nv-dock-bar]"));
        resize.observe($("[data-nv-menu-bar]"));
        positionMarkers();
      },
      leave() {
        state.visible = false;
        motionChanges.disconnect();
        resize.disconnect();
        stop();
      },
    });
  }
  S.page({
    id: "navigation",
    title: "Navigation",
    group: "Build",
    icon: pageIcon,
    order: 47,
    count: 8,
    description:
      "Eight working paths: travelling menus, search, breadcrumbs, pagination, file tree, dock, wizard and carousel.",
    render,
    mount,
    enter: (root) => instances.get(root)?.enter(),
    leave: (root) => instances.get(root)?.leave(),
  });
})();

</script>

          ${field("profile-role", 'Role <span class="forms-required">Required</span>', '<select class="forms-input forms-select" id="forms-profile-role" name="role" required aria-describedby="forms-profile-role-error"><option value="">Choose a role</option><option value="Designer" selected>Designer</option><option value="Engineer">Engineer</option><option value="Product manager">Product manager</option><option value="Researcher">Researcher</option><option value="Other">Other</option></select><p class="forms-message" id="forms-profile-role-error" aria-live="polite"></p>')}

        <fieldset class="forms-fieldset forms-visibility"><legend>Profile visibility</legend><div class="forms-radio-options"><label class="forms-radio-card"><input type="radio" name="visibility" value="team" checked><span><strong>Team only</strong><small>Preview for your workspace.</small></span>${icon("users")}</label><label class="forms-radio-card"><input type="radio" name="visibility" value="public"><span><strong>Public</strong><small>Preview a public profile.</small></span>${icon("globe")}</label></div><p class="forms-hint">Changes the local preview only. Nothing is published.</p></fieldset>
        <label class="forms-checkbox-row" for="forms-profile-updates"><input id="forms-profile-updates" name="updates" type="checkbox" checked><span><strong>Weekly product updates</strong><small>Demo preference only. This does not subscribe you.</small></span></label>

        </form><aside class="forms-preview" aria-label="Local profile preview"><span class="forms-eyebrow">Live / local preview</span><div class="forms-avatar" id="forms-preview-avatar" aria-hidden="true">AM</div><h3 id="forms-preview-name">Alex Morgan</h3><p class="forms-preview-handle" id="forms-preview-handle">@alexmorgan</p><span class="badge badge-accent" id="forms-preview-role">Designer</span><p class="forms-preview-bio" id="forms-preview-bio">Making thoughtful tools for people who care about the details.</p><div class="forms-preview-foot">${icon("users")}<span id="forms-preview-visibility">Team only · local preview</span></div><p class="forms-hint">A preview, not a published profile. Reloading clears demo saves.</p></aside></div></div>` })}
    </div>`;
  }

  function mount(root) {
    const page = root.querySelector(".pg-forms");
    const $ = (id) => page.querySelector(`#forms-${id}`);

    let active = false;
    let simulation = null;
    let progress = 0;
    let files = [];
    const animations = new Set();
    const flash = (el, error = false) => {

    $("email-demo").addEventListener("submit", (e) => {
      e.preventDefault();

    function grow(el) {

      const value = e.target.value;

      $("strength").setAttribute("aria-valuetext", `${score} of 4 demo rules met`);
      $("strength").dataset.score = String(score);
      $$('[data-strength-segment]').forEach((el, i) => el.dataset.on = String(i < score));
      $$('[data-requirement]').forEach((el, i) => { el.dataset.met = String(checks[i]); el.querySelector(".forms-req-status").textContent = checks[i] ? "Met" : "Needed"; });
      $("strength-text").textContent = `${value ? ["Needs work", "A start", "Getting there", "Almost there", "Meets the demo rules"][score] : "Not started"} · ${score} of 4 demo rules met`;
    });

    const digits = $$("[data-otp]");
    const otpEditing = () => {
      digits.forEach(el => el.removeAttribute("aria-invalid"));

      status($("otp-status"), digits.every(el => el.value) ? "Six digits entered. Choose Verify demo code." : "Enter the six-digit demo code. Use 123456.");
    };
    const distribute = (text, start) => {
      const clean = text.replace(/[\s-]/g, "");
      if (!/^\d{1,6}$/.test(clean)) { status($("otp-status"), "Paste up to six digits. The demo code is 123456.", "error"); return; }
      const offset = clean.length === 6 ? 0 : start;
      [...clean].slice(0, 6 - offset).forEach((v, i) => digits[offset + i].value = v);
      otpEditing();
      digits[Math.min(5, offset + clean.length)].focus();
    };
    digits.forEach((el, i) => {
      el.addEventListener("focus", () => el.select());
      el.addEventListener("paste", (e) => { e.preventDefault(); distribute(e.clipboardData.getData("text"), i); });
      el.addEventListener("input", () => {
        const value = el.value;
        if (value.length > 1) { distribute(value, i); return; }
        el.value = value.replace(/\D/g, "");

        if (el.value && i < 5) digits[i + 1].focus();
      });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !el.value && i > 0) { e.preventDefault(); digits[i - 1].value = ""; digits[i - 1].focus(); otpEditing(); }
        if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); digits[S.clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, 5)].focus(); }
      });

    $("otp-demo").addEventListener("submit", (e) => {
      e.preventDefault();
      const code = digits.map(el => el.value).join("");

      digits.forEach(el => el.setAttribute("aria-invalid", String(!success)));

      status($("otp-status"), success ? "Demo code matches 123456. No account was verified." : code.length < 6 ? "Enter all six digits before checking the demo code." : "That code does not match. Try 123456 for this local demo.", success ? "success" : "error");
      if (!success) (digits.find(el => !el.value) || digits[0]).focus();
      flash($("otp-slots"), !success);
    });

    $("timezone").addEventListener("change", (e) => { $("timezone-value").textContent = e.target.value; status($("timezone-status"), `Local selection: ${e.target.selectedOptions[0].textContent}. No system setting changed.`); flash($("timezone-value")); });
    let seats = 4;
    const setSeats = (n, announce = true) => {
      seats = S.clamp(Math.round(n), 1, 25);
      $("seats").value = String(seats);
      $("seats").removeAttribute("aria-invalid");
      status($("seats-error"), "");
