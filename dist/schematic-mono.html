  <script data-source="js/feedback.js">
/* =============================================================================
   SCHEMATIC — FEEDBACK: tooltips & toasts
   ============================================================================= */
(() => {
  const S = window.Schematic;

  /* ===================================================================== tooltip
     <button data-tip="Copy" data-tip-kbd="⌘C" data-tip-side="bottom">
     · first tooltip waits 450ms (intent), then the group is "warm":
       moving to a neighbour makes the SAME tooltip glide over — no re-fade.
     · hides on press, scroll and Escape.                                     */
  const initTooltip = () => {
    const tip = S.html(`<div class="tooltip" role="tooltip" id="schematic-tip"><div class="tooltip-inner"><span class="tip-text"></span></div></div>`);
    document.body.append(tip);
    const inner = tip.firstElementChild, text = S.$(".tip-text", tip);
    let current = null, describedTarget = null, showT, warmT, warm = false, visible = false;
    const detachDescription = () => {
      if (!describedTarget) return;
      const rest = (describedTarget.getAttribute("aria-describedby") || "").split(/\s+/).filter((id) => id && id !== tip.id);
      rest.length ? describedTarget.setAttribute("aria-describedby", rest.join(" ")) : describedTarget.removeAttribute("aria-describedby");
      describedTarget = null;
    };

    const position = (el) => {
      const r = el.getBoundingClientRect(), tr = inner.getBoundingClientRect();
      let side = el.dataset.tipSide || "top";
      const gap = 8;
      let x, y;
      if (side === "top" && r.top - tr.height - gap < 8) side = "bottom";
      if (side === "bottom" && r.bottom + tr.height + gap > innerHeight - 8) side = "top";
      if (side === "top" || side === "bottom") {
        x = r.left + r.width / 2 - tr.width / 2;
        y = side === "top" ? r.top - tr.height - gap : r.bottom + gap;
      } else {
        y = r.top + r.height / 2 - tr.height / 2;
        x = side === "right" ? r.right + gap : r.left - tr.width - gap;
      }
      x = S.clamp(x, 8, innerWidth - tr.width - 8);
      tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
      inner.style.setProperty("--tip-dy", side === "top" ? "3px" : side === "bottom" ? "-3px" : "0px");
      inner.style.setProperty("--tip-origin", { top: "bottom center", bottom: "top center", left: "center right", right: "center left" }[side]);
    };
    const fill = (el) => {
      const kbd = el.dataset.tipKbd;
      text.innerHTML = S.esc(el.dataset.tip) + (kbd ? ` <span class="kbd-group" style="margin-left:6px">${kbd.split(" ").map((k) => `<kbd class="kbd">${S.esc(k)}</kbd>`).join("")}</span>` : "");
    };
    const show = (el) => {
      clearTimeout(warmT);
      detachDescription();
      const glide = visible && warm;
      fill(el);
      if (glide) {
        tip.classList.add("is-gliding");
        text.classList.remove("is-swap"); text.offsetWidth; text.classList.add("is-swap");
      } else tip.classList.remove("is-gliding");
      position(el);
      tip.classList.add("is-on");
      visible = true; warm = true;
      const described = new Set((el.getAttribute("aria-describedby") || "").split(/\s+/).filter(Boolean));
      described.add(tip.id); el.setAttribute("aria-describedby", [...described].join(" "));
      describedTarget = el;
    };
    const hide = () => {
      clearTimeout(showT);
      detachDescription();
      tip.classList.remove("is-on");
      visible = false; current = null;
      clearTimeout(warmT);
      warmT = setTimeout(() => (warm = false), 400);
    };

    document.addEventListener("pointerover", (e) => {
      if (e.pointerType === "touch") return;
      const t = e.target.closest?.("[data-tip]");
      if (t === current) return;
      if (!t) { if (current) hide(); return; }
      current = t;
      clearTimeout(showT);
      if (warm) show(t); else showT = setTimeout(() => current === t && show(t), 450);
    });
    document.addEventListener("focusin", (e) => { const t = e.target.closest?.("[data-tip]"); if (t && t.matches(":focus-visible")) { current = t; show(t); } });
    document.addEventListener("focusout", () => current && hide());
    document.addEventListener("pointerdown", () => current && hide(), true);
    document.addEventListener("scroll", () => current && hide(), true);
    document.addEventListener("keydown", (e) => e.key === "Escape" && current && hide());
    S.tooltipRefresh = () => current && visible && (fill(current), position(current));
  };

  /* ===================================================================== toasts
     S.toast({ title, desc, tone, icon, action:{label,onClick}, duration })
     Sonner-style stack: newest in front, older ones tuck behind. Hover to fan
     out, swipe right to dismiss, timers pause while you're reading.          */
  const initToaster = () => {
    const box = S.html(`<section class="toaster" aria-live="polite" aria-label="Notifications"></section>`);
    document.body.append(box);
    let toasts = [], expanded = false;
    const GAP = 10, PEEK = 10, MAX_VISIBLE = 3;
    const toneIcon = { success: "check-circle", danger: "x-circle", warning: "alert", info: "info", neutral: "bell" };

    const layout = () => {
      const live = toasts.filter((t) => !t.leaving);
      const frontH = live[0]?.h || 0;
      let offset = 0;
      live.forEach((t, i) => {
        const el = t.el;
        el.style.zIndex = String(100 - i);
        if (expanded) {
          el.style.transform = `translateY(${-offset}px)`;
          el.style.height = `${t.h}px`;
          el.style.opacity = i < 6 ? "1" : "0";
          el.classList.remove("is-behind");
          offset += t.h + GAP;
        } else {
          const s = 1 - i * 0.05;
          el.style.transform = `translateY(${-i * PEEK}px) scale(${s})`;
          el.style.height = `${i === 0 ? t.h : frontH}px`;
          el.style.opacity = i < MAX_VISIBLE ? "1" : "0";
          el.classList.toggle("is-behind", i > 0);
        }
        el.style.pointerEvents = i < (expanded ? 6 : MAX_VISIBLE) ? "auto" : "none";
        el.inert = expanded ? i >= 6 : i > 0;
      });
      box.style.height = expanded ? `${offset}px` : `${frontH}px`;
    };

    const dismiss = (t, dir = "down") => {
      if (t.leaving) return;
      t.leaving = true; clearTimeout(t.timer);
      const el = t.el;
      el.classList.add("is-leaving");
      const cur = el.style.transform || "";
      el.style.transform = dir === "right" ? `translateX(110%)` : `${cur} translateY(14px) scale(0.96)`;
      el.style.opacity = "0";
      layout();
      setTimeout(() => { el.remove(); toasts = toasts.filter((x) => x !== t); layout(); }, S.dur(240));
    };

    const arm = (t) => {
      clearTimeout(t.timer);
      if (t.duration === Infinity) return;
      t.started = Date.now();
      t.timer = setTimeout(() => dismiss(t), t.remaining);
    };
    const pause = (t) => { if (t.timer) { clearTimeout(t.timer); t.timer = null; t.remaining = Math.max(0, t.remaining - (Date.now() - t.started)); } };

    box.addEventListener("pointerenter", () => { expanded = true; toasts.forEach(pause); layout(); });
    box.addEventListener("pointerleave", () => { expanded = false; toasts.forEach((t) => !t.leaving && arm(t)); layout(); });
    box.addEventListener("focusin", () => { expanded = true; toasts.forEach(pause); layout(); });
    box.addEventListener("focusout", (e) => { if (!box.contains(e.relatedTarget)) { expanded = false; toasts.forEach((t) => !t.leaving && arm(t)); layout(); } });

    S.toast = (opts = {}) => {
      const o = typeof opts === "string" ? { title: opts } : opts;
      const tone = o.tone || "neutral";
      const el = S.html(`
        <div class="toast" role="status" data-tone="${tone}">
          <span class="toast-ic">${S.icon(o.icon || toneIcon[tone] || "bell")}</span>
          <div class="toast-body">
            <div class="toast-title">${S.esc(o.title || "")}</div>
            ${o.desc ? `<div class="toast-desc">${S.esc(o.desc)}</div>` : ""}
          </div>
          <div class="toast-actions">
            ${o.action ? `<button class="btn btn-secondary btn-sm" data-act>${S.esc(o.action.label)}</button>` : ""}
            <button class="btn btn-ghost btn-sm btn-icon" data-close aria-label="Dismiss">${S.icon("x")}</button>
          </div>
        </div>`);
      const t = { el, duration: o.duration ?? 4200, remaining: o.duration ?? 4200, h: 0 };
      box.append(el);
      t.h = el.offsetHeight;
      el.style.height = `${t.h}px`;
      // start below the fold, then spring into the stack
      el.style.transition = "none";
      el.style.transform = `translateY(calc(100% + 32px)) scale(0.98)`;
      el.style.opacity = "0";
      el.offsetWidth;
      el.style.transition = "";
      toasts.unshift(t);
      layout();
      requestAnimationFrame(() => S.playIcon(S.$(".toast-ic .ic", el)));
      if (!expanded) arm(t);

      el.querySelector("[data-close]").addEventListener("click", () => dismiss(t));
      el.querySelector("[data-act]")?.addEventListener("click", () => { o.action.onClick?.(); dismiss(t); });

      // swipe to dismiss
      let x0 = null, dx = 0, t0 = 0;
      el.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button")) return;
        x0 = e.clientX; dx = 0; t0 = performance.now();
        el.setPointerCapture(e.pointerId); el.classList.add("is-dragging");
      });
      el.addEventListener("pointermove", (e) => {
        if (x0 === null) return;
        dx = e.clientX - x0;
        const d = dx < 0 ? dx * 0.2 : dx; // resist leftwards
        el.style.transform = `translateX(${d}px)`;
        el.style.opacity = String(1 - S.clamp(dx / 260, 0, 0.6));
      });
      const end = () => {
        if (x0 === null) return;
        el.classList.remove("is-dragging");
        const v = dx / Math.max(1, performance.now() - t0);
        x0 = null;
        if (dx > 90 || v > 0.6) dismiss(t, "right"); else { el.style.opacity = "1"; layout(); }
      };
      el.addEventListener("pointerup", end);
      el.addEventListener("pointercancel", end);
      return { dismiss: () => dismiss(t) };
    };
  };

  S._initFeedback = () => { initTooltip(); initToaster(); };
})();

</script>
  <script data-source="js/shell.js">
/* =============================================================================
   SCHEMATIC — SHELL: page registry, router, view transitions, prerendering,
   on-this-page rail, command palette, theme + tuning, boot.
   ============================================================================= */
(() => {
  const S = window.Schematic;
  const root = document.documentElement;
  const pages = [];
  const state = { current: null, scroll: {}, built: new Map(), mounted: new Set() };
  S.pages = pages;

  /* ===================================================================== registry */
  /**
   * Register a page.
   * @param {{id:string,title:string,group:string,icon:string,order:number,
   *          description?:string,count?:string|number,
   *          render:()=>string, mount?:(root:HTMLElement)=>void,
   *          enter?:(root:HTMLElement)=>void, leave?:(root:HTMLElement)=>void}} def
   */
  S.page = (def) => { pages.push(def); pages.sort((a, b) => a.order - b.order); };

  /* ===================================================================== markup helpers
     Every page uses these so headers, sections and demos are identical.      */
  S.pageHead = ({ icon, eyebrow, title, lead, meta = [] }) => `
    <header class="page-head reveal">
      <div class="page-head-ic" style="--i:0">${S.icon(icon, { size: 22 })}</div>
      <div class="stack" style="--gap:var(--s-2);--i:1">
        ${eyebrow ? `<span class="t-eyebrow">${eyebrow}</span>` : ""}
        <h1 class="t-h1">${title}</h1>
      </div>
      ${lead ? `<p class="t-lead" style="--i:2">${lead}</p>` : ""}
      ${meta.length ? `<div class="page-meta" style="--i:3">${meta.join("")}</div>` : ""}
    </header>`;

  S.section = ({ id, num, title, desc, body, toc }) => `
    <section class="sec" id="${id}" data-toc="${S.esc(toc || title)}">
      <header class="sec-head">
        ${num ? `<span class="sec-num">${num}</span>` : ""}
        <h2 class="t-h2">${title}</h2>
        ${desc ? `<p>${desc}</p>` : ""}
      </header>
      ${body}
    </section>`;

  S.demo = ({ title, desc, body, specs = [], stage = "", cls = "", attrs = "", replay = false }) => `
    <article class="demo ${cls}" ${attrs}>
      ${replay ? `<button class="btn btn-ghost btn-sm btn-icon demo-replay" data-replay data-tip="Replay" aria-label="Replay ${S.esc(title)}">${S.icon("refresh")}</button>` : ""}
      <div class="demo-stage ${stage}">${body}</div>
      <footer class="demo-foot">
        <div><div class="demo-title">${title}</div>${desc ? `<div class="demo-desc">${desc}</div>` : ""}</div>
        ${specs.length ? `<div class="demo-specs">${specs.map((s) => `<span class="spec">${S.esc(s)}</span>`).join("")}</div>` : ""}
      </footer>
    </article>`;

  /* ===================================================================== router */
  const host = () => S.$("#page-host");
  const viewport = () => S.$("#viewport");
  const byId = (id) => pages.find((p) => p.id === id);
  const routeFromHash = () => { const id = location.hash.match(/^#\/([\w-]+)/)?.[1]; return byId(id) ? id : pages[0]?.id; };

  /** Build (but don't show) a page's DOM. Called on intent and during idle. */
  S.prepare = (id) => {
    const p = byId(id);
    if (!p || state.built.has(id)) return state.built.get(id);
    const el = document.createElement("div");
    el.className = "page"; el.dataset.page = id; el.hidden = true;
    el.innerHTML = p.render();
    host().append(el);
    state.built.set(id, el);
    return el;
  };

  const swap = (id) => {
    document.dispatchEvent(new CustomEvent("schematic:navigate", { detail: { id } }));
    const prev = state.current && byId(state.current);
    const prevEl = state.current && state.built.get(state.current);
    if (prevEl) { state.scroll[state.current] = viewport().scrollTop; prev.leave?.(prevEl); prevEl.hidden = true; }
    const p = byId(id), el = S.prepare(id);
    el.hidden = false;
    if (!state.mounted.has(id)) { state.mounted.add(id); p.mount?.(el); }
    state.current = id;
    viewport().scrollTop = state.scroll[id] || 0;
    document.title = `${p.title} — Schematic`;
    S.$("#crumb-current").textContent = p.title;
    S.$("#crumb-group").textContent = p.group;
    updateNav(id);
    buildRail(el);
    return { p, el };
  };

  let navigating = null, navigationVersion = 0;
  S.navigate = async (id, { shared } = {}) => {
    if (!byId(id)) return;
    const version = ++navigationVersion;
    if (navigating) {
      navigating.skipTransition();
      await navigating.updateCallbackDone.catch(() => {});
    }
    if (version !== navigationVersion || id === state.current) return;
    const focusContent = !!document.activeElement?.closest("#page-host");
    const from = pages.findIndex((p) => p.id === state.current), to = pages.findIndex((p) => p.id === id);
    root.style.setProperty("--dir", to >= from ? "1" : "-1");
    if (location.hash !== `#/${id}`) history[state.current ? "pushState" : "replaceState"](null, "", `#/${id}`);
    closeMobileNav();

    const finish = ({ p, el }) => requestAnimationFrame(() => {
      if (state.current !== id) return;
      p.enter?.(el);
      if (focusContent) { const h = S.$("h1", el); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
    });
    if (!document.startViewTransition || S.reduced() || !state.current) {
      const r = swap(id);
      if (state.current && !document.startViewTransition && !S.reduced()) { r.el.classList.remove("page-enter"); r.el.offsetWidth; r.el.classList.add("page-enter"); }
      finish(r);
      return;
    }
    navigating?.skipTransition?.();
    if (shared) shared.style.viewTransitionName = "hero-ic";
    let result;
    const transition = document.startViewTransition(() => {
      if (shared) shared.style.viewTransitionName = "";
      result = swap(id);
      if (shared) { const target = S.$(".page-head-ic", result.el); if (target) target.style.viewTransitionName = "hero-ic"; }
    });
    navigating = transition;
    // ready rejects when a newer intent skips this animation; the DOM update
    // still completes. Treat that expected cancellation as a settled outcome.
    transition.ready.catch(() => {});
    transition.updateCallbackDone.then(() => finish(result)).catch((e) => console.error("Navigation failed", e));
    await transition.finished.catch(() => {});
      if (result) { const t = S.$(".page-head-ic", result.el); if (t) t.style.viewTransitionName = ""; }
      if (navigating === transition) navigating = null;
  };

  // Links: <a href="#/icons"> — intercepted so we control the transition.
  document.addEventListener("click", (e) => {
    const a = e.target.closest?.('a[href^="#/"]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    const id = a.getAttribute("href").slice(2);
    S.navigate(id, { shared: a.hasAttribute("data-shared") ? S.$(".shared-ic", a) : null });
  });
  window.addEventListener("popstate", () => S.navigate(routeFromHash()));
  window.addEventListener("hashchange", () => { if (location.hash.startsWith("#/") && routeFromHash() !== state.current) S.navigate(routeFromHash()); });

  // Intent prerender: hovering, focusing or pressing a route link builds it.
  let intentT;
  const intent = (e) => {
    const a = e.target.closest?.('a[href^="#/"]');
    if (!a) return;
    clearTimeout(intentT);
    const id = a.getAttribute("href").slice(2);
    if (e.type === "pointerover") intentT = setTimeout(() => S.prepare(id), 60); else S.prepare(id);
  };
  document.addEventListener("pointerover", intent, { passive: true });
  document.addEventListener("focusin", intent);
  document.addEventListener("pointerdown", intent, { passive: true });

  /* ===================================================================== sidebar nav */
  const buildNav = () => {
    const nav = S.$("#nav");
    const groups = [...new Set(pages.map((p) => p.group))];
    nav.innerHTML = groups.map((g) => `
      <div class="nav-group">
        <div class="nav-label t-eyebrow">${g}</div>
        ${pages.filter((p) => p.group === g).map((p) => `
          <a class="nav-item" href="#/${p.id}" data-route="${p.id}" data-glide-item>
            ${S.icon(p.icon)}<span>${p.title}</span>${p.count != null ? `<span class="nav-count">${p.count}</span>` : ""}
          </a>`).join("")}
      </div>`).join("") + `<span class="nav-active" id="nav-active" aria-hidden="true"></span>`;
    S.glide(nav, { items: ".nav-item" });
  };
  let navPlaced = false;
  const updateNav = (id) => {
    S.$$(".nav-item").forEach((a) => (a.dataset.route === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    const a = S.$(`.nav-item[data-route="${id}"]`), m = S.$("#nav-active");
    if (!a || !m) return;
    if (!navPlaced) { m.style.transition = "none"; }
    m.style.transform = `translateY(${a.offsetTop}px)`;
    if (!navPlaced) { m.offsetWidth; m.style.transition = ""; navPlaced = true; }
  };

  const closeMobileNav = () => { root.removeAttribute("data-nav-open"); S.$("#menu-btn")?.setAttribute("aria-expanded", "false"); S.$(".sidebar")?.removeAttribute("data-keyboard-open"); };

  /* ===================================================================== on-this-page rail */
  let railObserver;
  const buildRail = (pageEl) => {
    const rail = S.$("#rail");
    railObserver?.disconnect();
    const secs = S.$$("section[data-toc]", pageEl);
    if (!secs.length) { rail.innerHTML = ""; return; }
    rail.innerHTML = `<div class="t-eyebrow">On this page</div><nav class="toc">${secs.map((s) => `<a href="#${s.id}" data-toc-link="${s.id}">${s.dataset.toc}</a>`).join("")}<span class="toc-marker"></span></nav>`;
    const links = S.$$("[data-toc-link]", rail), marker = S.$(".toc-marker", rail);
    const setActive = (id) => {
      const a = links.find((l) => l.dataset.tocLink === id); if (!a) return;
      links.forEach((l) => l.classList.toggle("is-active", l === a));
      marker.style.transform = `translateY(${a.offsetTop}px)`; marker.style.height = `${a.offsetHeight}px`;
    };
    links.forEach((l) => l.addEventListener("click", (e) => {
      e.preventDefault();
      const target = S.$(`#${CSS.escape(l.dataset.tocLink)}`, pageEl);
      const vp = viewport();
      S.scrollTo(vp.scrollTop + target.getBoundingClientRect().top - vp.getBoundingClientRect().top - 24);
      setActive(l.dataset.tocLink);
    }));
    const visible = new Map();
    railObserver = new IntersectionObserver((entries) => {
      entries.forEach((en) => visible.set(en.target.id, en.isIntersecting ? en.intersectionRatio : 0));
      const best = secs.find((s) => (visible.get(s.id) || 0) > 0);
      if (best) setActive(best.id);
    }, { root: viewport(), rootMargin: "-10% 0px -55% 0px", threshold: [0, 0.01, 0.5, 1] });
    secs.forEach((s) => railObserver.observe(s));
    requestAnimationFrame(() => setActive(secs[0].id));
  };

  /** Scroll the viewport with our own curve; distance-aware duration. */
  let scrollTween;
  S.scrollTo = (y) => {
    const vp = viewport(), from = vp.scrollTop, to = S.clamp(y, 0, vp.scrollHeight - vp.clientHeight);
    scrollTween?.cancel();
    const dist = Math.abs(to - from);
    scrollTween = S.tween({ from, to, duration: S.clamp(300 + dist * 0.25, 360, 900), ease: S.ease.inOut, onUpdate: (v) => (vp.scrollTop = v) });
  };

  S._shell = { buildNav, routeFromHash, swap, state, byId, closeMobileNav };
})();

</script>
  <script data-source="js/app.js">
/* =============================================================================
   SCHEMATIC — APP: command palette, theme, tuning panel, boot
   ============================================================================= */
(() => {
  const S = window.Schematic;
  const root = document.documentElement;
  const store = {
    get: (k, d) => { try { return localStorage.getItem(`schematic:${k}`) ?? d; } catch { return d; } },
    set: (k, v) => { try { localStorage.setItem(`schematic:${k}`, v); } catch {} },
  };
  S.store = store;

  /* ===================================================================== theme
     The new theme grows as a circle out of whatever triggered it.           */
  let themeTransition = null, themeTarget = null, themeVersion = 0;
  S.setTheme = async (theme, origin) => {
    const version = ++themeVersion;
    themeTarget = theme;
    // A skipped transition still runs its update callback. Drain that update
    // before taking another snapshot; stale callbacks must not apply a theme.
    const previous = themeTransition;
    if (previous) {
      previous.skipTransition();
      await previous.updateCallbackDone.catch(() => {});
    }
    if (version !== themeVersion) return;
    const finish = () => {
      if (version !== themeVersion) return;
      themeTransition = null;
      themeTarget = null;
      root.classList.remove("vt-theme");
    };
    if (theme === root.dataset.theme) { finish(); return; }
    const apply = () => { root.dataset.theme = theme; store.set("theme", theme); };
    if (!document.startViewTransition || S.reduced()) { apply(); finish(); return; }
    const r = origin?.getBoundingClientRect();
    const x = r ? r.left + r.width / 2 : innerWidth / 2, y = r ? r.top + r.height / 2 : 0;
    root.style.setProperty("--vt-x", `${x}px`);
    root.style.setProperty("--vt-y", `${y}px`);
    root.style.setProperty("--vt-r", `${Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y))}px`);
    root.classList.add("vt-theme");
    let vt;
    try {
      vt = document.startViewTransition(() => { if (version === themeVersion) apply(); });
    } catch {
      apply(); finish(); return;
    }
    themeTransition = vt;
    // Cancellation can reject ready/finished; callers may safely await this API.
    vt.ready.catch(() => {});
    vt.updateCallbackDone.catch(() => {});
    await vt.finished.catch(() => {});
    finish();
  };
  S.toggleTheme = (origin) => S.setTheme((themeTarget ?? root.dataset.theme) === "dark" ? "light" : "dark", origin);

  /* ===================================================================== tuning */
  const HUES = [168, 195, 55, 18, 235, 290, 330, 0];
  S.setHue = (h) => { root.style.setProperty("--accent-h", h); store.set("hue", h); syncTune(); };
  S.setRadius = (v) => { v === "default" ? delete root.dataset.radius : (root.dataset.radius = v); store.set("radius", v); };
  S.setMotion = (v) => { v === "full" ? (root.dataset.motion = "full") : (root.dataset.motion = v); store.set("motion", v); requestAnimationFrame(S._loadSprings); };

  let syncTune = () => {};
  const initTune = () => {
    const btn = S.$("#tune-btn"), panel = S.$("#tune-pop");
    const hue = () => { const n = parseFloat(getComputedStyle(root).getPropertyValue("--accent-h")); return Number.isFinite(n) ? n : 168; };
    panel.innerHTML = `
      <div class="pop-section">
        <div class="pop-label"><span>Accent</span><span class="faint t-mono" id="hue-val"></span></div>
        <div class="swatches">${HUES.map((h) => `<button class="swatch" style="--h:${h}" data-hue="${h}" aria-label="Hue ${h}" data-tip="Hue ${h}°"></button>`).join("")}</div>
        <input class="range is-hue" id="hue-range" type="range" min="0" max="359" step="1" aria-label="Accent hue">
      </div>
      <div class="pop-section">
        <div class="pop-label">Corner radius</div>
        <div class="seg seg-block" id="radius-seg">
          <button class="seg-btn" data-value="sharp">Sharp</button>
          <button class="seg-btn" data-value="default">Default</button>
          <button class="seg-btn" data-value="round">Round</button>
        </div>
      </div>
      <div class="pop-section">
        <div class="pop-label">Motion</div>
        <div class="seg seg-block" id="motion-seg">
          <button class="seg-btn" data-value="full">Full</button>
          <button class="seg-btn" data-value="slow">Slow-mo ×4</button>
          <button class="seg-btn" data-value="reduced">Reduced</button>
        </div>
      </div>`;
    const range = S.$("#hue-range", panel), val = S.$("#hue-val", panel);
    syncTune = () => {
      const n = parseFloat(root.style.getPropertyValue("--accent-h"));
      const h = Math.round(Number.isFinite(n) ? n : hue());
      range.value = h; range.style.setProperty("--p", `${(h / 359) * 100}%`); val.textContent = `${h}°`;
      S.$$(".swatch", panel).forEach((s) => s.setAttribute("aria-pressed", String(+s.dataset.hue === h)));
    };
    S.$$(".swatch", panel).forEach((s) => s.addEventListener("click", () => S.setHue(+s.dataset.hue)));
    range.addEventListener("input", () => S.setHue(+range.value));
    let segs;
    S.popover(btn, panel, {
      onOpen: () => {
        syncTune();
        if (!segs) segs = [
          S.segmented(S.$("#radius-seg", panel), { value: store.get("radius", "default"), onChange: S.setRadius }),
          S.segmented(S.$("#motion-seg", panel), { value: store.get("motion", "full"), onChange: S.setMotion }),
        ];
      },
    });
  };

  /* ===================================================================== command palette */
  const fuzzy = (q, s) => {
    if (!q) return { score: 1, html: S.esc(s) };
    const lq = q.toLowerCase(), ls = s.toLowerCase();
    let qi = 0, score = 0, last = -2, out = "";
    for (let i = 0; i < s.length; i++) {
      if (qi < lq.length && ls[i] === lq[qi]) { score += i === last + 1 ? 3 : 1; if (i === 0 || s[i - 1] === " ") score += 2; last = i; qi++; out += `<mark>${S.esc(s[i])}</mark>`; }
      else out += S.esc(s[i]);
    }
    return qi === lq.length ? { score, html: out } : null;
  };

  const initCmdk = () => {
    const dlg = S.html(`
      <dialog class="cmdk" aria-label="Command palette">
        <div class="cmdk-panel">
          <div class="cmdk-input-row">${S.icon("search", { size: 20 })}<input class="cmdk-input" role="combobox" aria-controls="command-results" aria-autocomplete="list" aria-expanded="true" placeholder="Search pages, actions, settings…" aria-label="Search" autocomplete="off" spellcheck="false"><kbd class="kbd">esc</kbd></div>
          <div class="cmdk-list-wrap"><div class="cmdk-list" id="command-results" role="listbox" aria-label="Commands"></div></div>
          <div class="cmdk-foot"><span><kbd class="kbd">↑</kbd><kbd class="kbd">↓</kbd> navigate</span><span><kbd class="kbd">↵</kbd> open</span><span style="margin-left:auto">Schematic</span></div>
        </div>
      </dialog>`);
    document.body.append(dlg);
    const input = S.$(".cmdk-input", dlg), list = S.$(".cmdk-list", dlg), wrap = S.$(".cmdk-list-wrap", dlg);
    const glide = S.glide(list, { items: ".cmdk-item", persist: true, className: "cmdk-sel" });
    let items = [], sel = 0, closing = false;

    const commands = () => [
      ...S.pages.map((p) => ({ group: "Pages", label: p.title, icon: p.icon, hint: p.group, run: () => S.navigate(p.id) })),
      { group: "Actions", label: "Toggle theme", icon: "moon", hint: "⇧⌘L", run: () => S.toggleTheme(S.$("#theme-btn")) },
      { group: "Actions", label: "Show a toast", icon: "bell", run: () => S.toast({ title: "Hello from the palette", desc: "Toasts stack, fan out on hover and swipe away.", tone: "success" }) },
      { group: "Actions", label: "Slow-motion mode", icon: "clock", run: () => S.setMotion("slow") },
      { group: "Actions", label: "Full motion", icon: "bolt", run: () => S.setMotion("full") },
      ...[["Forest", 168], ["Teal", 195], ["Ochre", 55], ["Clay", 18], ["Blue", 235], ["Violet", 290], ["Rose", 330], ["Red", 0]]
        .map(([n, h]) => ({ group: "Accent", label: `Accent: ${n}`, icon: "droplet", run: () => S.setHue(h) })),
    ];

    const render = (fresh = false) => {
      const q = input.value.trim();
      items = commands().map((c) => ({ ...c, m: fuzzy(q, c.label) })).filter((c) => c.m).sort((a, b) => (q ? b.m.score - a.m.score : 0));
      sel = 0;
      const groups = q ? [["Results", items]] : [...new Set(items.map((i) => i.group))].map((g) => [g, items.filter((i) => i.group === g)]);
      const flat = groups.flatMap(([, arr]) => arr);
      items = flat;
      const before = wrap.offsetHeight;
      list.querySelectorAll(".cmdk-group-label, .cmdk-item, .cmdk-empty").forEach((n) => n.remove());
      let i = 0;
      list.insertAdjacentHTML("beforeend", flat.length ? groups.map(([g, arr]) => `<div class="cmdk-group-label t-eyebrow">${g}</div>` +
        arr.map((c) => `<div class="cmdk-item ${fresh || q ? "is-new" : ""}" id="command-option-${i}" role="option" data-idx="${i}" style="--i:${Math.min(i++, 12)}">${S.icon(c.icon)}<span>${c.m.html}</span>${c.hint ? `<span class="cmdk-item-hint">${c.hint}</span>` : ""}</div>`).join("")).join("")
        : `<div class="cmdk-empty">No results for “${S.esc(q)}”</div>`);
      // animate the list height between result sets
      wrap.style.height = "auto";
      const after = wrap.offsetHeight;
      if (before && before !== after) { wrap.style.height = `${before}px`; wrap.offsetHeight; wrap.style.height = `${after}px`; }
      select(0, true);
    };
    const select = (i, instant = false) => {
      const els = S.$$(".cmdk-item", list);
      if (!els.length) { glide.hide(); input.removeAttribute("aria-activedescendant"); return; }
      sel = (i + els.length) % els.length;
      els.forEach((el, k) => el.setAttribute("aria-selected", String(k === sel)));
      input.setAttribute("aria-activedescendant", els[sel].id);
      glide.moveTo(els[sel], { instant });
      els[sel].scrollIntoView({ block: "nearest" });
    };
    const run = async (i) => {
      const c = items[i]; if (!c) return;
      await close();
      c.run();
    };
    const open = () => { if (dlg.open) return; input.value = ""; dlg.showModal(); render(true); input.focus(); };
    const close = () => new Promise((res) => {
      if (!dlg.open || closing) return res();
      closing = true; dlg.classList.add("is-closing");
      setTimeout(() => { dlg.classList.remove("is-closing"); dlg.close(); closing = false; res(); }, S.dur(140));
    });
    S.cmdk = { open, close };

    input.addEventListener("input", () => render());
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); select(sel + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); select(sel - 1); }
      else if (e.key === "Enter") { e.preventDefault(); run(sel); }
    });
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); close(); });
    dlg.addEventListener("click", (e) => { if (e.target === dlg) close(); });
    list.addEventListener("pointermove", (e) => { const it = e.target.closest(".cmdk-item"); if (it && +it.dataset.idx !== sel) select(+it.dataset.idx); });
    list.addEventListener("click", (e) => { const it = e.target.closest(".cmdk-item"); if (it) run(+it.dataset.idx); });

    document.addEventListener("keydown", (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); dlg.open ? close() : open(); }
      if (mod && e.shiftKey && e.key.toLowerCase() === "l") { e.preventDefault(); S.toggleTheme(S.$("#theme-btn")); }
    });
  };

  /* ===================================================================== boot */
  const boot = () => {
    S._loadSprings();
    const shell = S._shell;
    shell.buildNav();
    S._initFeedback();
    initCmdk();
    initTune();

    S.$("#theme-btn").addEventListener("click", (e) => S.toggleTheme(e.currentTarget));
    S.$$("[data-open-cmdk]").forEach((b) => b.addEventListener("click", () => S.cmdk.open()));
    const menu = S.$("#menu-btn"), sidebar = S.$(".sidebar"), mobile = matchMedia("(max-width: 900px)");
    const syncSidebar = () => { sidebar.inert = mobile.matches && !root.hasAttribute("data-nav-open"); };
    menu?.addEventListener("click", () => {
      const open = root.toggleAttribute("data-nav-open"); menu.setAttribute("aria-expanded", String(open)); syncSidebar();
      if (open) { sidebar.setAttribute("data-keyboard-open", ""); sidebar.querySelector("a")?.focus(); }
    });
    const navObserver = new MutationObserver(syncSidebar); navObserver.observe(root, { attributes: true, attributeFilter: ["data-nav-open"] });
    mobile.addEventListener("change", syncSidebar); syncSidebar();
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && root.hasAttribute("data-nav-open")) { shell.closeMobileNav(); menu.focus(); }
      if (e.key === "Tab" && mobile.matches && root.hasAttribute("data-nav-open")) {
        const nodes = S.$$("a[href],button:not(:disabled),input:not(:disabled)", sidebar).filter((el) => el.offsetParent !== null);
        const first = nodes[0], last = nodes[nodes.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    document.addEventListener("pointerdown", (e) => { if (mobile.matches && !sidebar.contains(e.target) && !menu.contains(e.target)) shell.closeMobileNav(); });
    S.$("#viewport").addEventListener("pointerdown", () => shell.closeMobileNav());

    const vp = S.$("#viewport"), bar = S.$("#topbar");
    vp.addEventListener("scroll", () => bar.classList.toggle("is-scrolled", vp.scrollTop > 4), { passive: true });

    // Replay buttons inside demos re-run the page's enter() choreography for that demo
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-replay]"); if (!b) return;
      b.closest(".demo")?.dispatchEvent(new CustomEvent("replay", { bubbles: true }));
    });

    S.navigate(shell.routeFromHash());
    // Prerender every other page in idle time so navigation is always instant.
    const queue = S.pages.map((p) => p.id);
    const pump = () => { const id = queue.shift(); if (!id) return; S.prepare(id); S.idle(pump); };
    S.idle(pump);
    requestAnimationFrame(() => root.classList.add("is-ready"));
  };
  // All scripts are `defer`red, so every page has registered before this fires.
  document.addEventListener("DOMContentLoaded", boot);
})();

</script>
  <script data-source="js/palette.js">
/* Palette preferences extend the app without replacing its theme or hue logic. */
(() => {
  const S = window.Schematic;
  const root = document.documentElement;
  const current = () => root.dataset.palette === "mono" ? "mono" : "color";
  let control;

  S.setPalette = (palette) => {
    if (palette !== "color" && palette !== "mono") return;
    const changed = root.dataset.palette !== palette;
    root.dataset.palette = palette;
    S.store.set("palette", palette);
    control?.set(palette, { silent: true });
    if (changed) root.dispatchEvent(new CustomEvent("rootattr", {
      bubbles: true,
      detail: { attributeName: "data-palette", value: palette },
    }));
  };

  // Swatches, the hue slider and commands all keep the original implementation.
  // Choosing a hue is an explicit return to the Color interface.
  const setHue = S.setHue;
  S.setHue = function (...args) {
    S.setPalette("color");
    return setHue.apply(this, args);
  };

  // app.js registered boot first, so #tune-pop is populated before we extend it.
  document.addEventListener("DOMContentLoaded", () => {
    const panel = document.querySelector("#tune-pop");
    if (!panel) return;
    const section = document.createElement("div");
    section.className = "pop-section";
    section.innerHTML = `
      <div class="pop-label" id="palette-label">Interface palette</div>
      <div class="seg seg-block" id="palette-seg" role="group" aria-labelledby="palette-label" aria-describedby="palette-help">
        <button type="button" class="seg-btn" data-value="color">Color</button>
        <button type="button" class="seg-btn" data-value="mono">Mono</button>
      </div>
      <p class="t-caption" id="palette-help">Mono keeps chart series in color.</p>`;
    panel.prepend(section);
    const accent = panel.querySelector(".swatches")?.closest(".pop-section");
    if (accent) {
      accent.dataset.accentOptions = "";
      const inner = document.createElement("div"); inner.className = "palette-accent-inner";
      while (accent.firstChild) inner.append(accent.firstChild);
      accent.append(inner);
    }
    control = S.segmented(section.querySelector("#palette-seg"), {
      value: current(),
      onChange: S.setPalette,
    });
    // Keep external setter calls (and direct root-attribute changes) in sync.
    const sync = () => { control.set(current(), { silent: true }); if (accent) { accent.inert = current() === "mono"; accent.setAttribute("aria-hidden", String(accent.inert)); } };
    new MutationObserver(sync)
      .observe(root, { attributes: true, attributeFilter: ["data-palette"] });
    sync();
  });
})();

</script>
  <script data-source="js/onboarding.js">
/* Optional, local-only quick guide. App and palette boot before this listener. */
(() => {
  const S = window.Schematic;
  const root = document.documentElement;
  const completedKey = "guide-completed";
  const labels = ["Explore", "Palette", "Motion", "Reuse"];
  const panels = [];
  let dialog, launch, title, content, progress, back, next, palette;
  let step = 0, returnTo = null, exit = null, entrance = null, closing = null;

  const steps = [
    {
      title: "A working reference. Yours to explore.",
      desc: "Schematic brings spacing, type, components and purposeful motion into one place. Every example runs locally.",
      body: () => `
        <div class="onboarding-map">
          <div><span class="onboarding-map-num">01</span><div><strong>Find your foundation</strong><p>Tokens, type and color in Foundations.</p></div></div>
          <div><span class="onboarding-map-num">02</span><div><strong>Try the real interactions</strong><p>Components, forms, charts and overlays.</p></div></div>
          <div><span class="onboarding-map-num">03</span><div><strong>Jump straight there</strong><p>Use the sidebar, or search with <kbd class="kbd">Cmd / Ctrl K</kbd>.</p></div></div>
        </div>`,
    },
    {
      title: "One system. Two palettes.",
      desc: "Color pairs warm paper with a forest accent. Mono keeps the interface grayscale. Try either: this changes the whole app.",
      body: () => `
        <div class="seg seg-block onboarding-palette" role="group" aria-label="Interface palette" aria-describedby="onboarding-palette-help">
          <button type="button" class="seg-btn" data-value="color">Color</button>
          <button type="button" class="seg-btn" data-value="mono">Mono</button>
        </div>
        <div class="onboarding-preview" aria-hidden="true">
          <div class="onboarding-preview-top"><span class="badge badge-accent">Your workspace</span><span class="onboarding-swatches"><i></i><i></i><i></i></span></div>
          <strong>Make room for good work.</strong>
          <span>Quiet surfaces. Clear actions.</span>
          <div class="onboarding-preview-line"><span></span><span></span></div>
        </div>
        <p class="t-caption" id="onboarding-palette-help">Your choice is saved. Charts keep their own colors. Change it anytime in Tune tokens; the theme button switches light / dark.</p>`,
    },
    {
      title: "Motion with a reason to move.",
      desc: "A selection should travel to its new home. Try the sample, then use Motion Lab to inspect curves and springs.",
      body: () => `
        <div class="onboarding-motion">
          <div class="onboarding-motion-track" aria-hidden="true"><span class="onboarding-motion-marker">${S.icon("check", { size: 18 })}</span></div>
          <div class="onboarding-motion-labels" aria-hidden="true"><span>Ready</span><span>Selected</span></div>
        </div>
        <div class="onboarding-try"><button type="button" class="btn btn-secondary" data-guide-motion aria-pressed="false">Try motion ${S.icon("arrow-right", { size: 16 })}</button><span class="t-caption" data-guide-motion-status role="status">Ready to move.</span></div>
        <p class="t-caption" data-guide-motion-help></p>`,
    },
    {
      title: "Take the language into your project.",
      desc: "Start with the CSS tokens and shared styles, then reuse the JavaScript helpers and SVG icons your interface needs.",
      body: () => `
        <pre class="onboarding-code"><code>/* prototype/css/tokens.css */
.your-surface {
  background: var(--surface);
  color: var(--text);
  padding: var(--s-4);
  border-radius: var(--r-lg);
}</code></pre>
        <p class="t-small muted">HTML, CSS and JavaScript are the working reference. React / Next.js, SwiftUI and Rust adapters are planned.</p>
        <p class="t-caption">In the source download: docs/QUICKSTART.md explains reuse; prototype/CONTRACT.md explains page lifecycles.</p>`,
    },
  ];

  const paletteValue = () => root.dataset.palette === "mono" ? "mono" : "color";
  const syncNudge = () => {
    const fresh = S.store.get(completedKey, null) !== "1";
    launch.toggleAttribute("data-guide-new", fresh);
    launch.setAttribute("aria-label", fresh ? "Guide: take a quick tour of Schematic" : "Open Schematic guide");
  };
  const reduced = () => S.reduced() || (matchMedia("(prefers-reduced-motion: reduce)").matches && root.dataset.motion !== "full");
  const syncMotion = () => {
    const help = content.querySelector("[data-guide-motion-help]");
    if (help) help.textContent = reduced()
      ? "Reduced motion is on. The sample changes position instantly. Tune tokens offers motion settings."
      : "Tune tokens offers Full, Slow-mo and Reduced. Your browser's reduced-motion preference is respected unless you select Full.";
  };

  const render = ({ focus = true } = {}) => {
    entrance?.cancel();
    const current = steps[step];
    title.textContent = current.title;
    dialog.querySelector("#onboarding-desc").textContent = current.desc;
    dialog.querySelector("[data-guide-count]").textContent = `${step + 1} / ${steps.length}`;
    progress.querySelectorAll("li").forEach((item, i) => {
      if (i === step) item.setAttribute("aria-current", "step"); else item.removeAttribute("aria-current");
      item.toggleAttribute("data-past", i < step);
    });
    // Reuse each panel so its control listeners and ResizeObserver stay bounded.
    panels[step] ||= S.html(`<div class="onboarding-step">${current.body()}</div>`);
    content.replaceChildren(panels[step]);
    back.disabled = step === 0;
    next.textContent = step === steps.length - 1 ? "Finish guide" : "Next";
    if (step === 1) {
      if (!palette) palette = S.segmented(content.querySelector(".onboarding-palette"), { value: paletteValue(), onChange: S.setPalette });
      else palette.set(paletteValue(), { silent: true, instant: true });
    }
    if (step === 2) {
      content.querySelector("[data-guide-motion]").setAttribute("aria-pressed", "false");
      content.querySelector(".onboarding-motion-track").removeAttribute("data-selected");
      content.querySelector("[data-guide-motion-status]").textContent = "Ready to move.";
    }
    syncMotion();
    dialog.querySelector(".onboarding-body").scrollTop = 0;
    if (focus) title.focus({ preventScroll: true });
    if (!reduced()) entrance = content.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: S.dur(320), easing: S.curve.outExpo });
  };

  const restoreFocus = () => {
    const target = returnTo?.isConnected && !returnTo.closest("[inert]") && returnTo.getClientRects().length ? returnTo : launch;
    target?.focus({ preventScroll: true });
    returnTo = null;
  };
  const cleanup = () => {
    entrance?.cancel();
    exit?.cancel();
    exit = entrance = null;
    closing = null;
    launch.setAttribute("aria-expanded", "false");
    restoreFocus();
  };

  const close = () => {
    if (!dialog?.open) return Promise.resolve();
    if (closing) return closing;
    entrance?.cancel();
    // A reduced-motion dismissal is immediate; slow-mo scales the exit too.
    if (reduced()) { dialog.close(); cleanup(); return Promise.resolve(); }
    const animation = exit = dialog.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(8px)" }], { duration: S.dur(220), easing: S.curve.in, fill: "forwards" });
    closing = animation.finished.catch(() => {}).then(() => {
      // Reopening interrupts the exit instead of closing a newly opened guide.
      if (exit !== animation) return;
      dialog.close(); cleanup();
    });
    return closing;
  };
  const open = () => {
    if (!dialog) return false;
    if (dialog.open && !closing) return true;
    if (!dialog.open) {
      // Keep existing modal workflows independent; never stack on top of one.
      if (document.querySelector("dialog[open]")) return false;
      returnTo = document.activeElement instanceof HTMLElement && document.activeElement !== document.body ? document.activeElement : launch;
      dialog.showModal();
    }
    exit?.cancel(); exit = null; closing = null;
    step = 0;
    render();
    launch.setAttribute("aria-expanded", "true");
    return true;
  };
  S.onboarding = { open, close };

  document.addEventListener("DOMContentLoaded", () => {
    launch = document.querySelector("#guide-btn");
    if (!launch) return;
    dialog = S.html(`
      <dialog class="onboarding-dialog" id="schematic-guide" aria-labelledby="onboarding-title" aria-describedby="onboarding-desc">
        <div class="onboarding-head"><span class="t-eyebrow">Schematic / Quick guide</span><button type="button" class="btn btn-ghost btn-sm" data-guide-close>Close guide ${S.icon("x", { size: 14 })}</button></div>
        <div class="onboarding-progress-head"><span class="t-caption">A minute to make it yours</span><span class="t-caption t-mono" data-guide-count>1 / 4</span></div>
        <ol class="onboarding-progress" aria-label="Guide steps">${labels.map((label, i) => `<li${i === 0 ? ' aria-current="step"' : ""}><span>${label}</span></li>`).join("")}</ol>
        <div class="onboarding-body"><h2 class="t-h2" id="onboarding-title" tabindex="-1"></h2><p class="onboarding-desc" id="onboarding-desc"></p><div class="onboarding-content"></div></div>
        <div class="onboarding-foot"><p class="t-caption">Close anytime. Reopen from Guide.</p><div class="onboarding-actions"><button type="button" class="btn btn-secondary" data-guide-back>Back</button><button type="button" class="btn btn-primary" data-guide-next>Next</button></div></div>
      </dialog>`);
    document.body.append(dialog);
    title = dialog.querySelector("#onboarding-title");
    content = dialog.querySelector(".onboarding-content");
    progress = dialog.querySelector(".onboarding-progress");
    back = dialog.querySelector("[data-guide-back]");
    next = dialog.querySelector("[data-guide-next]");
    const nudge = document.createElement("span");
    nudge.className = "onboarding-nudge";
    nudge.textContent = "Start here";
    launch.append(nudge);
    launch.setAttribute("aria-expanded", "false");
    syncNudge();
    launch.addEventListener("click", open);
    dialog.querySelector("[data-guide-close]").addEventListener("click", close);
    back.addEventListener("click", () => { if (!closing && step > 0) { step--; render(); } });
    next.addEventListener("click", () => {
      if (closing) return;
      if (step < steps.length - 1) { step++; render(); }
      else { S.store.set(completedKey, "1"); syncNudge(); close(); }
    });
    content.addEventListener("click", (e) => {
      const button = e.target.closest("[data-guide-motion]");
      if (!button || closing) return;
      const selected = button.getAttribute("aria-pressed") !== "true";
      button.setAttribute("aria-pressed", String(selected));
      content.querySelector(".onboarding-motion-track").toggleAttribute("data-selected", selected);
      content.querySelector("[data-guide-motion-status]").textContent = selected ? "Selected. Try again to return." : "Ready. Try again to select.";
    });
    dialog.addEventListener("cancel", (e) => { e.preventDefault(); close(); });
    dialog.addEventListener("close", () => { if (!dialog.open && returnTo) cleanup(); });
    // Keep app shortcuts local. Explicitly wrap Tab at the two boundaries;
    // some browsers otherwise visit their chrome before cycling a native dialog.
    dialog.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") e.preventDefault();
      if (e.key === "Tab") {
        const controls = [...dialog.querySelectorAll("button:not(:disabled), [href], input:not(:disabled), [tabindex='0']")].filter((el) => el.getClientRects().length && !el.closest("[inert]"));
        const first = controls[0], last = controls[controls.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
      }
    });
    const preferences = new MutationObserver(() => {
      if (!dialog.open) return;
      palette?.set(paletteValue(), { silent: true });
      syncMotion();
    });
    preferences.observe(root, { attributes: true, attributeFilter: ["data-palette", "data-motion"] });
    matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", syncMotion);
    window.addEventListener("storage", (e) => { if (e.key === null || e.key === `schematic:${completedKey}`) syncNudge(); });
  });
})();

</script>
