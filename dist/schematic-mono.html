  <script data-source="pages/motion.js">
(() => {
  const S = window.Schematic;
  const curves = [["out", "Respond", "--ease-out"], ["outExpo", "Enter", "--ease-out-expo"], ["in", "Exit", "--ease-in"], ["inOut", "Travel", "--ease-in-out"], ["overshoot", "Confirm", "--ease-overshoot"], ["springSmooth", "Smooth spring", "--spring-smooth"], ["springSnappy", "Snappy spring", "--spring-snappy"], ["springBouncy", "Bouncy spring", "--spring-bouncy"], ["linear", "Linear reference", "linear"]];
  const graph = (fn) => Array.from({ length: 121 }, (_, i) => `${i ? "L" : "M"}${30 + i * 2.5},${180 - fn(i / 120) * 140}`).join(" ");
  const simulate = (k, damping, mass) => {
    const dt = 1 / 240, samples = [[0, 0]]; let x = 0, v = 0, t = 0;
    while (t < 4) { v += (-k * (x - 1) - damping * v) / mass * dt; x += v * dt; t += dt; samples.push([t, x]); if (t > .2 && Math.abs(x - 1) < .001 && Math.abs(v) < .01) break; }
    const values = Array.from({ length: 81 }, (_, i) => i === 80 ? 1 : samples[Math.min(samples.length - 1, Math.round(i / 80 * (samples.length - 1)))][1]);
    return { duration: Math.round(t * 1000), values, css: `linear(${values.map((v) => +v.toFixed(4)).join(", ")})` };
  };
  S.page({
    id: "motion", title: "Motion Lab", group: "Foundations", icon: "wave", order: 20,
    description: "Inspect curves, tune physical springs and replay purposeful choreography.",
    render: () => `<div class="pg-motion">
      ${S.pageHead({ icon: "wave", eyebrow: "Foundations / 02", title: "Make change feel natural.", lead: "Compare easing curves and tune spring parameters.", meta: ['<span class="badge badge-accent">Interruptible by design</span>', '<span class="badge">Reduced-motion aware</span>'] })}
      ${S.section({ id: "motion-curves", num: "01", title: "Easing curves", body: S.demo({ title: "Easing workbench", desc: "An out-curve responds quickly and settles gently. A spring carries momentum through the destination.", replay: true, stage: "is-plain is-col", specs: ["transform", "requestAnimationFrame"], body: `<div class="ml-workbench"><div class="ml-graph"><svg viewBox="0 0 360 220" role="img" aria-label="Easing curve: time left to right, progress bottom to top"><path class="ml-grid" d="M30 40H330M30 110H330M30 180H330M30 40V180M180 40V180M330 40V180"/><path class="ml-reference" d="M30 180L330 40"/><path class="ml-path" id="motion-path"/><circle class="ml-point" id="motion-point" r="5" cx="30" cy="180"/><text x="30" y="205">0</text><text x="300" y="205">time →</text><text x="8" y="44">1</text><text x="8" y="184">0</text></svg></div><div class="stack ml-settings"><label class="stack" for="motion-curve"><span class="t-small">Curve</span><select id="motion-curve">${curves.map(([key, label]) => `<option value="${key}">${label}</option>`).join("")}</select></label><label class="stack" for="motion-duration"><span class="row-between t-small">Duration <output id="motion-duration-val">600ms</output></span><input class="range" type="range" id="motion-duration" min="150" max="1400" step="50" value="600"></label><button class="btn btn-primary" id="motion-play">${S.icon("play")} Replay curve</button><code class="ml-token" id="motion-token">--ease-out</code></div></div><div class="ml-track" aria-hidden="true"><span class="ml-ghost"></span><span class="ml-traveller" id="motion-traveller">${S.icon("cube", { size: 20 })}</span></div><div class="ml-scrub"><label for="motion-scrub" class="t-caption">Scrub time</label><input class="range" type="range" id="motion-scrub" min="0" max="1000" value="0"><output class="t-mono t-caption" id="motion-readout">0% → 0%</output></div>` }) })}
      ${S.section({ id: "motion-springs", num: "02", title: "Springs", body: S.demo({ title: "Spring bench", desc: "An original mass–spring simulation. Change a parameter and watch it settle; click Copy to take the curve.", stage: "is-plain is-col", replay: true, specs: ["mass / stiffness / damping"], body: `<div class="ml-spring-stage"><span class="ml-spring-line"></span><span class="ml-spring-object" id="motion-spring-object">${S.icon("layers", { size: 28 })}</span><span class="ml-spring-goal"></span></div><div class="grid cols-3 ml-spring-controls">${[["stiffness", "Stiffness", 80, 600, 300, 10], ["damping", "Damping", 8, 60, 26, 1], ["mass", "Mass", .5, 2.5, 1, .1]].map(([id, label, min, max, val, step]) => `<label class="stack" for="motion-${id}"><span class="row-between t-small">${label}<output id="motion-${id}-val">${val}</output></span><input class="range" type="range" id="motion-${id}" min="${min}" max="${max}" value="${val}" step="${step}"></label>`).join("")}</div><div class="row-between ml-spring-actions"><span class="t-caption" id="motion-spring-time">Settles in 600ms</span><div class="row"><button class="btn btn-secondary" id="motion-spring-replay">${S.icon("refresh")} Replay</button><button class="btn btn-soft" id="motion-spring-copy">${S.icon("copy")} Copy curve</button></div></div>` }) })}
      ${S.section({ id: "motion-choreography", num: "03", title: "Sequences", body: `<div class="grid cols-2">${S.demo({ title: "Staggered arrival", desc: "Replay the staggered list.", replay: true, specs: ["32ms stagger", "ease-out-expo"], body: `<div class="ml-list" id="motion-list">${[["document", "Read the brief", "Requirements aligned"], ["droplet", "Apply the language", "Tokens connected"], ["check-circle", "Review the details", "Ready to build"]].map(([ic, t, d], i) => `<div class="ml-list-row" style="--i:${i}"><span class="ml-list-icon">${S.icon(ic)}</span><div><strong>${t}</strong><div class="t-caption">${d}</div></div><span class="badge badge-success">0${i + 1}</span></div>`).join("")}</div>` })}${S.demo({ title: "State continuity", desc: "A moving indicator and directional content keep the relationship visible.", specs: ["spring-snappy", "direction-aware"], body: `<div class="ml-continuity"><div class="seg" id="motion-state">${["Design", "Build", "Review"].map((s, i) => `<button class="seg-btn" data-value="${i}">${s}</button>`).join("")}</div><div class="ml-state-content" id="motion-state-content" role="status"><span class="ml-state-icon">${S.icon("droplet", { size: 28 })}</span><strong>Start with a shared language.</strong><p class="t-caption">Decisions become reusable tokens.</p></div></div>` })}</div>` })}
      ${S.section({ id: "motion-performance", num: "04", title: "Performance", body: `<div class="card stack ml-performance"><div class="row-between"><span class="t-h3">Local page cache</span><button class="btn btn-secondary btn-sm" id="motion-cache-refresh">${S.icon("refresh")} Inspect</button></div><div id="motion-cache" class="ml-cache"></div><p class="t-caption">These are real local cache states. No server request or speculative network prefetch is required for this prototype.</p></div><div class="grid cols-3">${[["arrow-right", "Enter with out", "Let the first frame acknowledge intent. Use out or out-expo, and keep distance short."], ["logout", "Exit with in", "An exit should clear the way. Use an in-curve and roughly 30% less time."], ["eye", "Respect the preference", "Use the tune panel to inspect slow motion or reduce spatial motion. User action timings stay usable."]].map(([ic, t, d]) => `<div class="card stack"><span class="accent-text">${S.icon(ic)}</span><h3 class="t-h3">${t}</h3><p class="t-small muted">${d}</p></div>`).join("")}</div>` })}
    </div>`,
    mount(root) {
      const q = (s) => S.$(s, root), state = root._motion = { curve: "out", progress: 0, tween: null, spring: null, animations: [] };
      const curve = q("#motion-curve"), duration = q("#motion-duration"), scrub = q("#motion-scrub"), traveller = q("#motion-traveller");
      const position = (t) => { const v = S.ease[state.curve](t); state.progress = t; q("#motion-point").setAttribute("cx", 30 + t * 300); q("#motion-point").setAttribute("cy", 180 - v * 140); traveller.style.transform = `translateX(${Math.max(0, q(".ml-track").clientWidth - 48) * v}px)`; scrub.value = Math.round(t * 1000); q("#motion-readout").textContent = `${Math.round(t * 100)}% → ${Math.round(v * 100)}%`; };
      const updateCurve = () => { state.curve = curve.value; q("#motion-path").setAttribute("d", graph(S.ease[state.curve])); q("#motion-token").textContent = curves.find(([k]) => k === state.curve)[2]; };
      state.play = () => { state.tween?.cancel(); updateCurve(); state.tween = S.tween({ from: 0, to: 1, duration: +duration.value, ease: S.ease.linear, onUpdate: position }); };
      q("#motion-play").addEventListener("click", state.play); curve.addEventListener("change", state.play);
      duration.addEventListener("input", () => { q("#motion-duration-val").textContent = `${duration.value}ms`; }); duration.addEventListener("change", state.play);
      scrub.addEventListener("input", () => { state.tween?.cancel(); position(+scrub.value / 1000); });
      new ResizeObserver(() => position(state.progress)).observe(q(".ml-track"));
      let physical;
      state.playSpring = () => {
        physical = simulate(+q("#motion-stiffness").value, +q("#motion-damping").value, +q("#motion-mass").value);
        q("#motion-spring-time").textContent = `Simulation: ${physical.duration}ms${S.reduced() ? " / reduced motion" : ""}`;
        state.spring?.cancel();
        const distance = q(".ml-spring-stage").clientWidth - 80;
        state.spring = q("#motion-spring-object").animate([{ transform: "translateX(0)" }, { transform: `translateX(${distance}px)` }], { duration: S.dur(physical.duration), easing: physical.css, fill: "forwards" });
      };
      ["stiffness", "damping", "mass"].forEach((id) => q(`#motion-${id}`).addEventListener("input", () => { q(`#motion-${id}-val`).textContent = q(`#motion-${id}`).value; state.playSpring(); }));
      q("#motion-spring-replay").addEventListener("click", state.playSpring);
      q("#motion-spring-copy").addEventListener("click", async () => { physical ||= simulate(300, 26, 1); const ok = await S.copy(`transition: transform ${physical.duration}ms ${physical.css};\n/* Multiply duration by your motion preference; suppress spatial motion when reduced. */`); S.toast({ title: ok ? "Spring curve copied" : "Clipboard unavailable", tone: ok ? "success" : "warning" }); });
      state.choreograph = () => { state.animations.forEach((a) => a.cancel()); state.animations = S.$$(".ml-list-row", root).map((el, i) => el.animate([{ opacity: 0, transform: S.reduced() ? "none" : "translateY(12px)" }, { opacity: 1, transform: "none" }], { duration: S.dur(460), delay: S.dur(i * 32), easing: S.curve.outExpo, fill: "backwards" })); };
      let previous = 0, contentAnimation;
      const copy = [["droplet", "Start with a shared language.", "Decisions become reusable tokens."], ["cube", "Compose familiar parts.", "Components carry the same behaviour."], ["check-circle", "Check the whole experience.", "Keyboard, motion and responsive layouts."]];
      S.segmented(q("#motion-state"), { value: "0", onChange: (v) => { const index = +v, [ic, title, desc] = copy[index], el = q("#motion-state-content"); contentAnimation?.cancel(); el.innerHTML = `<span class="ml-state-icon">${S.icon(ic, { size: 28 })}</span><strong>${title}</strong><p class="t-caption">${desc}</p>`; contentAnimation = el.animate([{ opacity: 0, transform: `translateX(${S.reduced() ? 0 : index >= previous ? 12 : -12}px)` }, { opacity: 1, transform: "none" }], { duration: S.dur(320), easing: S.curve.out }); previous = index; } });
      state.cache = () => { q("#motion-cache").innerHTML = S.pages.map((p) => `<div class="ml-cache-row"><span>${S.icon(p.icon, { size: 14 })} ${S.esc(p.title)}</span><span class="badge ${S._shell.state.mounted.has(p.id) ? "badge-success" : "badge-accent"}">${S._shell.state.mounted.has(p.id) ? "Mounted" : S._shell.state.built.has(p.id) ? "Prepared" : "On intent"}</span></div>`).join(""); };
      q("#motion-cache-refresh").addEventListener("click", state.cache);
      root.addEventListener("replay", (e) => { if (e.target.contains(q("#motion-play"))) state.play(); else if (e.target.contains(q("#motion-spring-object"))) state.playSpring(); else state.choreograph(); });
      updateCurve(); position(0); state.cache();
    },
    enter(root) { root._motion.play(); root._motion.playSpring(); root._motion.choreograph(); root._motion.cache(); },
    leave(root) { const s = root._motion; s.tween?.cancel(); s.spring?.cancel(); s.animations.forEach((a) => a.cancel()); },
  });
})();

</script>
  <script data-source="pages/icons.js">
(() => {
  const S = window.Schematic;

  const CATS = {
    Arrows: ["arrow-right", "arrow-left", "arrow-up-right", "chevron-right", "chevron-down", "chevrons-up-down", "download", "upload", "refresh", "logout", "external"],
    Actions: ["check", "x", "plus", "minus", "search", "trash", "copy", "pencil", "send", "link", "filter", "sliders", "play", "pause", "more", "menu", "command", "cursor"],
    Objects: ["bell", "home", "mail", "lock", "eye", "heart", "star", "bookmark", "calendar", "clock", "document", "folder", "chat", "user", "users", "globe", "gauge", "droplet", "palette", "ruler", "type", "cube", "layers", "window", "input", "sidebar", "code", "grid"],
    Data: ["chart-bar", "trending", "wave", "pie"],
    Status: ["info", "alert", "check-circle", "x-circle", "bolt", "sparkles", "sun", "moon", "loader"],
  };
  const catOf = (n) => Object.keys(CATS).find((c) => CATS[c].includes(n)) || "Other";

  const VERBS = [
    ["bell", "Rings", "The body swings from its hook while the clapper lags behind it — secondary motion makes it feel weighted."],
    ["trash", "Lid lifts", "Hinged on the right edge, the lid tilts open and settles with a tiny counter-swing."],
    ["send", "Flies off", "Exits up-right on an in-curve, re-enters from the opposite corner on an out-curve: motion that loops through."],
    ["download", "Drops in", "The arrow falls into the tray, the tray squashes to absorb it. Cause, then effect."],
    ["copy", "Duplicates", "Front sheet slides off the back one — literally showing a copy being made."],
    ["eye", "Blinks", "A blink, then the pupil glances around. Used on 'reveal password' toggles."],
  ];

  S.page({
    id: "icons",
    title: "Icons",
    group: "Foundations",
    icon: "sparkles",
    order: 30,
    count: S.iconNames.length,
    description: `${S.iconNames.length} hand-built icons on one grid, each with its own meaningful animation.`,
    render: () => `
      <div class="pg-icons">
        ${S.pageHead({
          icon: "sparkles", eyebrow: "Foundations", title: "Icons that act",
          lead: "Search icons. Click one to copy its markup.",
          meta: [`<span class="badge">${S.iconNames.length} icons</span>`, `<span class="badge">24 × 24 grid</span>`, `<span class="badge">stroke var(--ic-stroke)</span>`],
        })}

        ${S.section({
          id: "ic-gallery", num: "01", title: "Gallery",
          body: `
            <div class="ic-toolbar">
              <label class="ic-search">${S.icon("search", { size: 16 })}<input id="icons-q" type="search" placeholder="Search icons…" autocomplete="off" aria-label="Search icons"><span class="ic-count t-mono" id="icons-count">${S.iconNames.length}</span></label>
              <div class="seg" id="icons-size" aria-label="Icon size">
                ${[16, 20, 24, 32].map((s) => `<button class="seg-btn" data-value="${s}" ${s === 24 ? 'aria-pressed="true"' : ""}>${s}</button>`).join("")}
              </div>
              <label class="ic-stroke"><span class="t-caption">Stroke</span><input class="range" id="icons-stroke" type="range" min="1" max="2.4" step="0.1" value="1.6" aria-label="Stroke width"><span class="t-mono t-caption" id="icons-stroke-val">1.6</span></label>
              <button class="btn btn-secondary btn-sm" id="icons-wave">${S.icon("play")} Play all</button>
            </div>
            <div class="ic-grid" id="icons-grid" style="--ic-size:24px">
              ${S.iconNames.map((n) => `
                <button class="ic-tile" data-name="${n}" data-cat="${catOf(n)}" aria-label="Copy ${n}">
                  ${S.icon(n, { size: 24 })}
                  <span class="ic-name">${n}</span>
                </button>`).join("")}
            </div>
            <div class="ic-empty" id="icons-empty" hidden>${S.icon("search", { size: 20 })}<span>No icon matches “<b id="icons-empty-q"></b>”</span></div>`,
        })}

        ${S.section({
          id: "ic-verbs", num: "02", title: "Motion is the meaning",
          body: `<div class="grid cols-3">${VERBS.map(([n, t, d]) => `
            <div class="card ic-verb" data-ic-trigger tabindex="0">
              <div class="ic-verb-stage">${S.icon(n, { size: 40 })}</div>
              <div class="t-h3">${t}</div>
              <p class="t-small muted">${d}</p>
              <span class="spec">${n}</span>
            </div>`).join("")}</div>`,
        })}

        ${S.section({
          id: "ic-usage", num: "03", title: "Usage",
          body: `<div class="grid cols-2">
            ${S.demo({
              title: "Inside controls", desc: "Any button, link, label or [data-ic-trigger] plays its icons on hover, focus and touch.",
              specs: ["auto-trigger", "plays to end"],
              body: `<button class="btn btn-primary">${S.icon("send")} Send</button><button class="btn btn-secondary">${S.icon("download")} Export</button><button class="btn btn-ghost btn-icon" data-tip="Notifications">${S.icon("bell")}</button><button class="btn btn-ghost btn-icon" data-tip="Delete">${S.icon("trash")}</button>`,
            })}
            ${S.demo({
              title: "Snippet", desc: "The SVG reference can inform React, SwiftUI and Rust adapters. Framework ports are planned.",
              specs: ["S.icon(name, {size})"], stage: "is-plain",
              body: `<pre class="ic-code"><code><span class="faint">// vanilla</span>
el.innerHTML = S.icon(<span class="accent-text">"bell"</span>, { size: 18 });

<span class="faint">// programmatic play</span>
S.playIcon(el.querySelector(<span class="accent-text">".ic"</span>));</code></pre>`,
            })}
          </div>`,
        })}
      </div>`,

    mount: (root) => {
      const grid = S.$("#icons-grid", root), tiles = S.$$(".ic-tile", grid);
      const q = S.$("#icons-q", root), count = S.$("#icons-count", root), empty = S.$("#icons-empty", root);

      // Search with FLIP: tiles slide into place, leavers fade out first.
      let last = "";
      q.addEventListener("input", () => {
        const term = q.value.trim().toLowerCase();
        if (term === last) return; last = term;
        const match = (t) => !term || t.dataset.name.includes(term) || t.dataset.cat.toLowerCase().includes(term);
        const visibleBefore = tiles.filter((t) => !t.hidden);
        S.flip(visibleBefore, () => tiles.forEach((t) => (t.hidden = !match(t))), { stagger: 0 });
        const n = tiles.filter((t) => !t.hidden).length;
        S.roll(count, String(n));
        empty.hidden = n > 0;
        S.$("#icons-empty-q", root).textContent = q.value;
      });

      S.segmented(S.$("#icons-size", root), {
        onChange: (v) => S.flip(tiles.filter((t) => !t.hidden), () => {
          grid.style.setProperty("--ic-size", `${v}px`);
          S.$$(".ic", grid).forEach((s) => { s.setAttribute("width", v); s.setAttribute("height", v); });
        }),
      });

      const stroke = S.$("#icons-stroke", root), sv = S.$("#icons-stroke-val", root);
      const setStroke = () => { grid.style.setProperty("--ic-stroke", stroke.value); sv.textContent = (+stroke.value).toFixed(1); stroke.style.setProperty("--p", `${((stroke.value - 1) / 1.4) * 100}%`); };
      stroke.addEventListener("input", setStroke); setStroke();

      // Play all: a diagonal wave across the grid
      S.$("#icons-wave", root).addEventListener("click", () => {
        const vis = tiles.filter((t) => !t.hidden), g = grid.getBoundingClientRect();
        vis.forEach((t) => {
          const r = t.getBoundingClientRect();
          const d = (r.left - g.left) * 0.6 + (r.top - g.top) * 0.9;
          setTimeout(() => S.playIcon(S.$(".ic", t)), S.dur(d));
        });
      });

      grid.addEventListener("click", async (e) => {
        const t = e.target.closest(".ic-tile"); if (!t) return;
        const snippet = `S.icon("${t.dataset.name}")`;
        const copied = await S.copy(snippet);
        if (!copied) { S.toast({ title: "Clipboard unavailable", desc: snippet, tone: "warning", duration: 6000 }); return; }
        t.classList.remove("is-copied"); t.offsetWidth; t.classList.add("is-copied");
        S.toast({ title: "Copied to clipboard", desc: snippet, tone: "success", duration: 2200 });
      });
    },
  });
})();

</script>
