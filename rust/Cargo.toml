[package]
name = "schematic-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Rust implementation of the Schematic interface library"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svgtypes = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
